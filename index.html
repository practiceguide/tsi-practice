ark.", "The writer was glad to read about the playground plan.", "The council is urged to act before the opening."], "answer": 0, "explanation": "The writer supports the request with a firsthand example: a toddler running toward the curb. That event shows the danger a fence would reduce. The playground plan is background, and the writer’s gladness is an opinion that opens the letter. The urging of the council is the request itself, not evidence for it. Evidence must show why the request is reasonable, and a specific incident does that best."}, {"n": 35, "domain": "D8", "stem": "A household tracked its weekly food waste for a month. Week 1: 4 pounds. Week 2: 3 pounds. Week 3: 2 pounds. Week 4: 2 pounds. After week 1, the family began planning meals on Sunday and freezing extra portions. The household’s notes say the first big drop came right after the planning began.\n\nWhich statement about the data is best supported by the passage?", "options": ["Waste rose each week after the family began freezing food.", "Waste dropped after meal planning began and then leveled off.", "Waste dropped by half between the second and third weeks.", "The family wasted the most food in the fourth week."], "answer": 1, "explanation": "The weekly figures fall from 4 to 3 to 2 pounds after planning starts and then stay at 2, which matches the key. The claim that waste rose contradicts the numbers. A drop from 3 to 2 pounds is one third, not half. Week 4 is tied for the lowest amount at 2 pounds, and the largest amount belongs to week 1 at 4 pounds."}, {"n": 36, "domain": "D9", "stem": "Read this sentence from a family newsletter: “The soup simmered for an hour, the family gathered at the table.” Which revision corrects the error without changing the meaning?", "options": ["The soup simmered for an hour the family gathered at the table.", "The soup simmered for an hour, then the family gathered at the table.", "The soup simmered for an hour; and the family gathered at the table.", "The soup simmered for an hour, and the family gathered at the table."], "answer": 3, "explanation": "As written, a comma alone links two complete sentences, which makes a comma splice. Adding a coordinating conjunction after the comma fixes it. Removing the comma leaves a run-on sentence. Using a comma before the word then still joins two independent clauses with just a comma. A semicolon followed by and is also incorrect, because a semicolon does the joining on its own and needs no conjunction."}, {"n": 37, "domain": "D9", "stem": "Read this sentence from a kitchen guide: “A bowl of fresh oranges and apples sit on the counter near the window.” Which verb form should replace the word sit so the sentence is correct?", "options": ["are sitting", "have sat", "sits", "sitting"], "answer": 2, "explanation": "The subject is the singular noun bowl, and the phrase of fresh oranges and apples only describes what the bowl holds. A singular subject takes the singular verb sits. The plural form are sitting wrongly matches the nearby nouns oranges and apples. The form have sat is plural and also changes the tense. The word sitting is incomplete without a helping verb and would leave a fragment."}, {"n": 38, "domain": "D9", "stem": "Read this sentence from a bakery diary: “Maya told her sister that she needed to rest after the long shift at the bakery.” Which revision makes clear who needs to rest?", "options": ["After the long shift at the bakery, Maya told her sister that she needed to rest.", "Maya told her sister that her needing rest came after the long shift at the bakery.", "Maya told her sister that one needed to rest after the long shift at the bakery.", "Maya told her sister, “You need to rest after the long shift at the bakery.”"], "answer": 3, "explanation": "In the original, the pronoun she could refer to Maya or to her sister, so the reference is unclear. Quoting Maya’s words with the pronoun you removes the doubt. Moving the opening phrase leaves the same ambiguous pronoun. The version with needing rest is awkward and still uses her for either person. Replacing the pronoun with the vague word one avoids a name but no longer tells the reader who is meant."}, {"n": 39, "domain": "D9", "stem": "A neighborhood newsletter prints this sentence: “The two ____ bakery sells whole wheat loaves on Saturday mornings.” Which choice correctly completes the sentence?", "options": ["sisters’", "sister’s", "sisters", "sisters’s"], "answer": 0, "explanation": "The bakery belongs to two sisters, so the possessive form of a plural noun ending in s is made by adding only an apostrophe after the s. The form sister’s shows ownership by one sister, which does not fit the word two. The plain plural sisters has no apostrophe and so does not show ownership. The form sisters’s adds an extra s that is not used for a plural noun already ending in s."}, {"n": 40, "domain": "D9", "stem": "A health clinic’s flyer includes this sentence: “Dr. Rao advises patients to sleep eight hours, drinking more water, and to walk daily.” Which revision makes the list parallel?", "options": ["Dr. Rao advises patients to sleep eight hours, drinking more water, and walking daily.", "Dr. Rao advises patients to sleep eight hours, to drink more water, and to walk daily.", "Dr. Rao advises patients sleeping eight hours, to drink more water, and walking daily.", "Dr. Rao advises patients to sleep eight hours, to drink more water, and daily walks."], "answer": 1, "explanation": "The items in a series should share the same grammatical form. The original mixes two infinitives with a phrase starting with drinking. Making all three items begin with to, as in to sleep, to drink and to walk, restores parallel structure. The first distractor shifts to drinking and walking. The second mixes sleeping, to drink and walking. The last ends with the noun phrase daily walks, which breaks the pattern of verbs."}, {"n": 41, "domain": "D9", "stem": "A grocery list in a family handbook reads: “The pantry list was short flour, rice, lentils, and salt.” Which revision punctuates the sentence correctly?", "options": ["The pantry list was short; flour, rice, lentils, and salt.", "The pantry list was short, flour, rice, lentils, and salt.", "The pantry list was short: flour, rice, lentils, and salt.", "The pantry list was short. Flour, rice, lentils, and salt."], "answer": 2, "explanation": "A colon correctly introduces a list after a complete sentence, and the clause before it, the pantry list was short, can stand alone. A semicolon needs a complete clause on both sides, but the list is not one. A comma alone creates a run of items that blurs where the list begins. The period creates a fragment, because flour, rice, lentils, and salt has no subject or verb."}, {"n": 42, "domain": "D9", "stem": "Read this sentence from a cooking blog: “Simmering on the back burner, Grandma stirred the pot of lentil soup.” Which revision fixes the misplaced modifier?", "options": ["Grandma stirred the pot of lentil soup simmering on the back burner.", "Grandma, simmering on the back burner, stirred the pot of lentil soup.", "On the back burner, Grandma simmering stirred the pot of lentil soup.", "Stirring the pot of lentil soup, Grandma was simmering on the back burner."], "answer": 0, "explanation": "A descriptive phrase must sit next to the word it describes. In the original, simmering seems to describe Grandma, which is silly. Placing the phrase right after the pot of lentil soup makes it describe the soup. The other revisions still attach simmering to Grandma, either directly or through a new phrase, so the confusion remains. The last choice makes the error worse by saying that Grandma was simmering."}, {"n": 43, "domain": "D9", "stem": "Read this sentence from a wellness newsletter: “Last winter, the family starts a habit of evening walks and kept it through spring.” Which revision corrects the verb tense?", "options": ["Last winter, the family starts a habit of evening walks and keeps it through spring.", "Last winter, the family will start a habit of evening walks and kept it through spring.", "Last winter, the family had start a habit of evening walks and kept it through spring.", "Last winter, the family started a habit of evening walks and kept it through spring."], "answer": 3, "explanation": "The phrase last winter places the action in the past, and the verb kept already uses past tense, so starts should become started. The first distractor puts both verbs in the present, which conflicts with last winter. The second uses will start, a future form that clashes with the past time and with kept. The third uses had start, an incorrect verb form that is neither past tense nor past perfect."}, {"n": 44, "domain": "D9", "stem": "A parenting handout prints this sentence: “The new bedtime schedule had a positive ____ on the whole household.” Which choice correctly completes the sentence?", "options": ["affect", "effect", "affects", "effected"], "answer": 1, "explanation": "After the adjective positive and the article a, the sentence needs a noun, and the noun meaning a result is effect. The word affect is usually a verb meaning to influence, so it does not fit here. The form affects is also a verb, and it would not agree with the article a. The form effected is a verb meaning brought about, which does not fit after the word positive."}, {"n": 45, "domain": "D9", "stem": "A student is editing a household diary and wants every line to be a full sentence rather than a fragment. Which of the following choices is a complete, correctly punctuated sentence?", "options": ["After the dishes were washed, the family walked to the park.", "Because the evening air was cool and the sky was clear.", "Walking slowly along the river path with the dog.", "The children who had finished their homework early."], "answer": 0, "explanation": "A complete sentence needs a subject and a verb and must express a full thought. The key has the main clause the family walked to the park with an introductory clause before it. The first distractor starts with because and leaves the thought unfinished. The second is a participial phrase with no subject and no main verb. The third has a subject with a describing clause but no main verb telling what the children did."}, {"n": 46, "domain": "D9", "stem": "Read this sentence from a home cooking guide: “Fresh basil gives the sauce a bright flavor; ____ dried basil can be used when the market is out.” Which transition best completes the sentence?", "options": ["as a result,", "for instance,", "however,", "in the same way,"], "answer": 2, "explanation": "The two clauses contrast: fresh basil is the preferred choice, but dried basil is an acceptable substitute, so a word of contrast such as however fits. The phrase as a result implies that the second idea follows from the first, which it does not. The phrase for instance introduces an example, but dried basil is not an example of fresh basil. The phrase in the same way suggests similarity instead of contrast."}, {"n": 47, "domain": "D10", "stem": "A student drafts the introduction of an essay on family meals: “Many families struggle to find time to eat together. Work schedules, school activities and phones all pull people into separate rooms. Yet shared meals give children a place to talk about their day, and they let parents notice small changes in mood. Some families choose just two evenings each week and protect them from every other plan.” Which sentence would be the most effective thesis statement to end the introduction?", "options": ["Families have many different kinds of dinners, and some of them include dessert.", "Phones are the main reason that people no longer eat together.", "In this essay, I will talk about the topic of family dinners.", "Even two protected meals a week can strengthen family bonds, so households should treat shared dinners as a priority."], "answer": 3, "explanation": "A thesis states a clear position the essay can support, and the draft already builds toward the value of protected shared meals. The key claims that even two meals help and gives a conclusion about priorities. The dessert sentence is vague and unrelated to the argument. Blaming phones narrows the focus to a cause the paragraph does not argue. An announcement of the topic names the subject but states no position."}, {"n": 48, "domain": "D10", "stem": "An essay on grocery shopping has a first paragraph about writing a weekly list. The second paragraph begins: “Sticking to it is harder.” The first paragraph reads: “A weekly grocery list saves both time and money. Start by checking the refrigerator and pantry so that nothing is bought twice. Next, plan five dinners and write down only the missing ingredients. Finally, group the items by section of the store so the trip moves in one direction.” Which revision of the opening sentence of the second paragraph best links the two paragraphs?", "options": ["Grocery stores are found in nearly every town.", "Once the list is complete, the next challenge is following it at the store.", "Lists can also be written on paper or saved on a phone.", "Another challenge exists, and it is rather difficult."], "answer": 1, "explanation": "A good transition refers back to the first paragraph and points ahead to the new idea. The key names the finished list, which links to the earlier steps, and introduces the topic of following it in the store. The sentence about towns is off topic. The sentence about paper or phones returns to the list format rather than moving forward. The last choice is vague, since it never says which challenge it means."}, {"n": 49, "domain": "D10", "stem": "A student drafts this paragraph: “(1) Our shared kitchen is crowded during dinner preparation. (2) Several family members cook on weeknights. (3) Due to the fact that the kitchen was extremely small in size, the cooks took turns working at the counter one at a time. (4) This system keeps the evening calm.” Which revision of sentence 3 is the most concise while keeping its meaning?", "options": ["Due to the fact that the kitchen was small in size, the cooks took turns, one at a time, at the counter.", "The kitchen being extremely small, the cooks each took a turn at the counter one by one.", "Because the kitchen was small, the cooks took turns at the counter.", "Because of the small size of the kitchen, the cooks took turns working one at a time at the counter."], "answer": 2, "explanation": "Concise writing removes words that repeat an idea. In sentence 3, small in size repeats small, and one at a time repeats took turns. The key keeps the cause, the cooks and the action in the fewest words. The first distractor keeps due to the fact that and one at a time. The second uses a clumsy absolute phrase and the repetition of one by one. The third replaces the short cause with a longer phrase and keeps the repeated idea."}, {"n": 50, "domain": "D10", "stem": "A student drafts this paragraph: “(1) A steady bedtime helps children fall asleep faster. (2) When the lights go out at the same hour every night, the body learns to expect rest. (3) My neighbor’s garden has won several prizes at the county fair. (4) A short routine, such as washing up, reading a page or two and dimming the lamps, adds a signal that the day is ending. (5) Over time, families often find that mornings run more smoothly too.” Which sentence should the writer delete because it does not support the main point?", "options": ["Sentence 3", "Sentence 2", "Sentence 4", "Sentence 5"], "answer": 0, "explanation": "The paragraph is about how a steady bedtime and a short routine help children sleep. Sentence 3 describes a neighbor’s garden prizes, which has nothing to do with sleep, so it breaks the focus. Sentence 2 explains why a regular hour works. Sentence 4 gives a concrete routine that supports the point. Sentence 5 closes with a benefit that follows from better rest, so each of those belongs."}]}, {"id": "test5", "title": "Practice Test 5", "items": [{"n": 1, "domain": "D1", "stem": "A tram travels 3/8 of a mile from the depot to the first stop and then 1/4 of a mile to the second stop. How far does the tram travel in all?", "options": ["3/32 mile", "4/12 mile", "5/8 mile", "7/8 mile"], "answer": 2, "explanation": "Rename 1/4 as 2/8, then add 3/8 + 2/8 to get 5/8 of a mile. The answer 4/12 adds the tops and the bottoms separately, which is never valid for fractions. The answer 3/32 multiplies the denominators and keeps the first numerator, as if the fractions were being multiplied. The answer 7/8 renames 1/4 as 4/8 instead of 2/8, so the common denominator was handled incorrectly."}, {"n": 2, "domain": "D1", "stem": "A rideshare app advertises a 35 percent promotion on a $48 airport fare. How many dollars does the promotion save the rider?", "options": ["16.80", "31.20", "35", "83"], "answer": 0, "explanation": "Find 35 percent of 48 by multiplying 0.35 by 48, which gives 16.80 dollars saved. The answer 31.20 is the price after the promotion, not the amount saved, so it responds to a different question. The answer 35 treats the percent as if it were dollars. The answer 83 adds 35 to 48, which raises the fare instead of lowering it."}, {"n": 3, "domain": "D1", "stem": "A phone’s battery meter shows 0.6 of a full charge, a laptop’s shows 5/8, and a tablet’s shows 62 percent. Which device has the greatest charge?", "options": ["The tablet, because 62 is larger than 5 and 0.6", "The phone, because 0.6 is the only decimal", "The laptop and tablet are tied, because both are close to 0.6", "The laptop, because 5/8 equals 0.625"], "answer": 3, "explanation": "Convert all three values to decimals before comparing: 0.6, 0.625 and 0.62. The largest is 0.625, which is 5/8, so the laptop leads. Comparing 62 with 5 and 0.6 ignores that 62 percent means 0.62. Having a decimal form does not make a value larger. Values that are close are still different, and 0.625 beats 0.62 by a small but real amount."}, {"n": 4, "domain": "D2", "stem": "A cargo drone flies 18 miles in 24 minutes at a steady pace. What is its speed in miles per hour?", "options": ["45", "75", "80", "432"], "answer": 0, "explanation": "Convert 24 minutes to 0.4 hour, then divide 18 miles by 0.4 hour to get 45 miles per hour. The answer 75 comes from dividing 18 by 24 and multiplying by 100, which mixes percent with a rate. The answer 80 inverts the rate, using 60 divided by 18 times 24. The answer 432 multiplies the two numbers given, which has no meaning here."}, {"n": 5, "domain": "D2", "stem": "A scooter rental charges $3.00 to unlock plus $0.35 for each minute ridden. What is the total cost of an 18-minute ride?", "options": ["6.30", "9.30", "21.00", "60.30"], "answer": 1, "explanation": "Multiply 18 minutes by $0.35 to get $6.30, then add the $3.00 unlock fee for a total of $9.30. The answer 6.30 forgets the unlock fee. The answer 21.00 adds the unlock fee to the 18 minutes as if they were the same kind of quantity. The answer 60.30 charges the per-minute price on the unlock fee as well, which is not part of the rate."}, {"n": 6, "domain": "D2", "stem": "On a transit map, 1 inch stands for 4 miles. Two stations are 3.5 inches apart on the map. How many miles apart are the stations?", "options": ["0.875", "7.5", "12", "14"], "answer": 3, "explanation": "Multiply the map distance by the scale: 3.5 inches times 4 miles per inch gives 14 miles. The answer 0.875 divides instead of multiplying. The answer 7.5 adds 4 to 3.5 as if the scale were a fixed amount to add. The answer 12 multiplies only the whole 3 inches by 4 and drops the half inch."}, {"n": 7, "domain": "D3", "stem": "A parking meter charges a flat $2.00 plus $1.50 per hour. A driver pays $11.00. For how many hours did the driver park?", "options": ["2", "6", "7.5", "8.67"], "answer": 1, "explanation": "Write 2 + 1.5h = 11. Subtract 2 from both sides to get 1.5h = 9, then divide by 1.5 to get 6 hours. The answer 2 confuses the flat fee with the hours. The answer 7.5 subtracts 1.5 from 9 instead of dividing by it. The answer 8.67 divides 13 by 1.5 because the flat fee was added instead of subtracted."}, {"n": 8, "domain": "D3", "stem": "A commuter has $30 to spend on a ride pass. The pass costs $5 to activate and each ride then costs $2.75. What is the greatest whole number of rides the commuter can take?", "options": ["9", "10", "11", "25"], "answer": 0, "explanation": "Write 5 + 2.75r is at most 30, so 2.75r is at most 25 and r is at most about 9.09. Only whole rides count, so the answer rounds down to 9. The answer 10 divides 30 by 2.75 and ignores the activation fee. The answer 11 rounds that quotient up. The answer 25 is the money left after the fee, not a number of rides."}, {"n": 9, "domain": "D3", "stem": "A cable car track passes through the points (2, 7) and (6, 19) on a grid of distance and height. What is the slope of the track?", "options": ["1/3", "3", "4", "12"], "answer": 1, "explanation": "Slope is the change in height divided by the change in distance: (19 - 7) divided by (6 - 2) equals 12 divided by 4, which is 3. The answer 1/3 turns the ratio upside down. The answer 4 is only the change in distance. The answer 12 is only the change in height, so neither part was divided by the other."}, {"n": 10, "domain": "D3", "stem": "A freight scheduler sets up the equation 3(x - 4) = 2x + 5 to balance two shifts. What is the value of x?", "options": ["-7", "7", "9", "17"], "answer": 3, "explanation": "Distribute the 3 to get 3x - 12 = 2x + 5. Subtract 2x from both sides to get x - 12 = 5, then add 12 to get x = 17. The answer 9 distributes the 3 to only the x, leaving 3x - 4. The answer 7 uses 2x - 5 on the right side, a sign slip. The answer -7 also moves the constant with the wrong sign."}, {"n": 11, "domain": "D4", "stem": "A shuttle company sold 30 tickets in all. Adult tickets cost $6 each and child tickets cost $4 each, and the total sales were $152. How many adult tickets were sold?", "options": ["14", "15", "16", "20"], "answer": 2, "explanation": "Let x be adult tickets, so child tickets are 30 - x. Then 6x + 4(30 - x) = 152, which simplifies to 2x + 120 = 152, so x = 16. The answer 14 is the number of child tickets. The answer 15 assumes an even split, which the sales total contradicts. The answer 20 divides the 120 dollars from 30 child tickets by the adult price, ignoring the second equation."}, {"n": 12, "domain": "D4", "stem": "A transit planner is rewriting a cost model and needs the factored form of the expression x^2 + 7x + 12. Which choice shows the correct factored form?", "options": ["(x + 3)(x + 4)", "(x + 2)(x + 6)", "(x + 1)(x + 12)", "(x - 3)(x - 4)"], "answer": 0, "explanation": "Look for two numbers that multiply to 12 and add to 7. The numbers 3 and 4 do both, so the factors are (x + 3) and (x + 4). The pair 2 and 6 multiplies to 12 but adds to 8. The pair 1 and 12 multiplies to 12 but adds to 13. The pair of negative numbers multiplies to 12 but adds to -7, which flips the sign of the middle term."}, {"n": 13, "domain": "D4", "stem": "A toll plaza models its cost in dollars with the function f(x) = x^2 + 4x - 3. What is the value of f(-2)?", "options": ["-15", "-11", "-7", "9"], "answer": 2, "explanation": "Substitute -2 for x: (-2)^2 is 4, 4 times -2 is -8, and 4 - 8 - 3 = -7. The answer -15 treats (-2)^2 as -4. The answer -11 leaves out the squared term and computes only -8 - 3. The answer 9 changes the sign of the middle term and computes 4 + 8 - 3. Square the input first, then handle each sign."}, {"n": 14, "domain": "D5", "stem": "A rectangular parking lot measures 60 feet by 40 feet and contains a rectangular landscaped island that measures 10 feet by 12 feet. How many square feet of the lot are available for parking?", "options": ["120", "2280", "2400", "2520"], "answer": 1, "explanation": "The whole lot has an area of 60 times 40, which is 2400 square feet. The island takes up 10 times 12, which is 120 square feet, so parking space is 2400 minus 120, or 2280. The answer 2520 adds the island instead of removing it. The answer 2400 ignores the island entirely. The answer 120 is only the island’s area."}, {"n": 15, "domain": "D5", "stem": "A wheelchair ramp rises 5 feet over a horizontal run of 12 feet. How long is the sloped surface of the ramp, in feet?", "options": ["7", "12", "13", "17"], "answer": 2, "explanation": "The ramp, the rise and the run form a right triangle, so the surface length is the square root of 5 squared plus 12 squared, which is the square root of 169, or 13. The answer 7 subtracts the legs. The answer 12 reports the horizontal run alone. The answer 17 adds the legs, which is the path along the two sides instead of the sloped hypotenuse."}, {"n": 16, "domain": "D5", "stem": "A shipping box measures 6 feet by 4 feet by 3 feet. How many solid cubes with 2-foot edges can be packed inside it with no gaps or overlap?", "options": ["9", "24", "36", "72"], "answer": 0, "explanation": "The box holds 6 times 4 times 3, which is 72 cubic feet, and each cube takes 2 times 2 times 2, or 8 cubic feet. Dividing 72 by 8 gives 9 cubes. The answer 72 never divides by the cube volume. The answer 36 divides by the edge length of 2 instead of by its cube. The answer 24 divides by only the 3-foot dimension."}, {"n": 17, "domain": "D6", "stem": "A transit analyst timed five trips, in minutes: 14, 22, 18, 30 and 16. What is the mean trip time, in minutes?", "options": ["14", "16", "18", "20"], "answer": 3, "explanation": "Add the five times to get 100, then divide by 5, which gives a mean of 20 minutes. The answer 18 is the median of the ordered list 14, 16, 18, 22, 30, a different measure of center. The answer 16 is the range, the largest value minus the smallest. The answer 14 is only the shortest trip, which says nothing about the average."}, {"n": 18, "domain": "D6", "stem": "A dispatcher chooses two drivers at random, one after the other and without replacement, from a pool of six drivers. Four of the drivers are experienced and two are new. What is the probability that both chosen drivers are experienced?", "options": ["4/9", "2/3", "2/5", "1/3"], "answer": 2, "explanation": "The first pick is experienced with probability 4/6. With one experienced driver gone, the second pick is 3/5, so the product is 12/30, which is 2/5. The answer 4/9 treats the picks as independent, using 4/6 twice. The answer 2/3 is only the first pick. The answer 1/3 is the chance that the first pick is a new driver, which is a different event from the one asked about."}, {"n": 19, "domain": "D6", "stem": "A rider can choose from 3 morning routes and 4 evening routes for a round trip. How many different morning and evening route combinations are possible?", "options": ["7", "12", "14", "81"], "answer": 1, "explanation": "For each of the 3 morning routes there are 4 evening routes, so the combinations total 3 times 4, or 12. The answer 7 adds the counts instead of multiplying. The answer 14 adds them and then doubles for the round trip, which counts nothing real. The answer 81 raises 3 to the fourth power, a different counting model with repeated choices."}, {"n": 20, "domain": "D6", "stem": "Delays for five trains, in minutes, were 4, 5, 5, 6 and 40. Which statement best describes how to report a typical delay for these trains?", "options": ["The mean of 12 minutes is the better choice because it uses every value, including 40", "The mode of 5 minutes is the better choice because it is always the center of a data set", "The range of 36 minutes is the better choice because it shows a typical delay", "The median of 5 minutes is the better choice because the single 40-minute delay pulls the mean up to 12"], "answer": 3, "explanation": "One extreme value distorts the mean, which here is 12 even though four of five trains were delayed 6 minutes or less. The median, 5 minutes, resists that outlier and stays near the typical case. Using every value is exactly why the mean is pulled upward. A mode is not always central. The range measures spread, so it cannot describe a typical delay."}, {"n": 21, "domain": "D7", "stem": "Story excerpt: Imani had driven the number 14 bus for eleven winters, and she knew every pothole by name. Tonight the road was slick, and a young man in a gray coat stood at the Ferris Street stop with no umbrella. She did not open the doors right away. Instead she glanced at the empty seats, tugged the heater lever, and only then pulled the handle. ‘Sit near the front,’ she said. ‘It warms up first.’ He nodded, and she pretended not to see him wipe his eyes.\n\nWhich statement about Imani is best supported by the excerpt?", "options": ["She is experienced and quietly considerate toward her passengers.", "She is annoyed by passengers who arrive at stops without umbrellas.", "She is new to the route and unsure how to operate the heater.", "She dislikes driving at night and hopes to change her route."], "answer": 0, "explanation": "The excerpt shows Imani readying the heater before opening the doors, offering the warmest seat, and politely ignoring the young man’s tears. Those details point to experience and gentle care. Her pause is not annoyance, since she acts kindly. Eleven winters on the route rules out being new. Nothing says she dislikes night driving or wants another route, so those choices add claims the text never makes."}, {"n": 22, "domain": "D7", "stem": "Story excerpt: The ferry horn sounded twice, and Tomas gripped the railing. His grandfather’s workshop had always smelled of pine shavings and warm metal, and now the island behind him was shrinking to a smudge of green. He had promised himself he would not look back, yet he turned anyway. The dock lights blinked like patient eyes. ‘Not goodbye,’ he whispered to the water. ‘Just a long pause.’\n\nIn the excerpt, the phrase ‘blinked like patient eyes’ most nearly suggest about the dock lights?", "options": ["warn Tomas that the ferry is moving too quickly", "show that the island has become dangerous and dark", "seem to wait calmly for Tomas to return someday", "prove that Tomas has forgotten his grandfather’s workshop"], "answer": 2, "explanation": "The simile compares blinking lights to patient eyes, which wait without hurrying. Combined with Tomas’s whisper that this is a long pause rather than a goodbye, the image suggests calm waiting and a possible return. Nothing in the lines presents a warning or danger. The workshop memories show that Tomas remembers it vividly, so forgetting it is the opposite of the passage."}, {"n": 23, "domain": "D7", "stem": "Diary entry: Tuesday. The new bike lane opened this morning, and I rode it with more suspicion than joy. For years I have dodged delivery vans and opened car doors, so a painted stripe seemed like wishful thinking. But a low concrete curb now separates me from traffic. At the first light, a truck driver actually waved me ahead. I pedaled the rest of the way home grinning, feeling slightly foolish about my doubts.\n\nWhich sentence best describes how the writer’s attitude changes during the entry?", "options": ["The writer moves from excitement about the lane to anger about the traffic.", "The writer remains certain from start to finish that bike lanes are unsafe.", "The writer moves from confidence in drivers to fear of delivery vans.", "The writer moves from doubt about the lane to cheerful surprise at how well it works."], "answer": 3, "explanation": "At the start the writer rides ‘with more suspicion than joy’ and calls the stripe ‘wishful thinking.’ By the end the writer is grinning and ‘slightly foolish about my doubts.’ That is a shift from doubt to pleased surprise. The excitement-to-anger choice reverses the order. The ‘certain from start to finish’ choice ignores the grin at the end. The writer never expresses confidence in drivers at the start."}, {"n": 24, "domain": "D7", "stem": "Poem excerpt: The night train hums a low, unhurried tune, / and windows slide like pages in a book. / The sleepers lean on strangers’ shoulders, soon / forgiven, as the cold towns pass and look. / The conductor walks the aisle with a lamp, / and everyone is carried, no one lost.\n\nWhich idea does the poem most develop?", "options": ["Night trains are too slow to be useful for travel between towns.", "Travelers on a night train share quiet trust and safety.", "Strangers on trains usually argue about seats and shoulder room.", "Cold towns are dangerous places that travelers should avoid."], "answer": 1, "explanation": "Details such as the humming tune, sleepers leaning on strangers and being quickly forgiven, and ‘everyone is carried, no one lost’ all build a mood of calm trust and safety. The word ‘unhurried’ describes a soothing pace, not a flaw. Leaning on shoulders is forgiven, not argued over. The cold towns are only scenery passing by, with no hint of danger."}, {"n": 25, "domain": "D8", "stem": "City newsletter: Starting in March, the Harbor Avenue bridge will close to cars for three weekends while crews replace worn expansion joints. Walkers and cyclists may still cross, and two extra shuttle buses will connect the east and west landings every fifteen minutes. Engineers chose weekends because traffic counts are lowest then. Officials say the work should extend the bridge’s useful life and avoid a longer closure later.\n\nWhich statement best expresses the main idea of the newsletter?", "options": ["The city plans to build a new bridge to replace the Harbor Avenue bridge.", "Shuttle buses will run every fifteen minutes on all city routes.", "The Harbor Avenue bridge will close to cars on three weekends for repairs that were planned to limit disruption.", "Walkers and cyclists are no longer allowed to use the bridge."], "answer": 2, "explanation": "The main idea covers the whole notice: a short, scheduled closure for repairs, with weekend timing and alternatives chosen to reduce disruption. No new bridge is mentioned, only replacing expansion joints. The shuttle buses serve the two landings, not every route. Walkers and cyclists may still cross, so the last choice states the opposite of the text."}, {"n": 26, "domain": "D8", "stem": "Lab report summary: Students tested three tire pressures on a toy cart rolling down the same ramp. At 10 units of pressure the cart traveled 2.1 meters past the ramp, at 20 units it traveled 2.9 meters, and at 30 units it traveled 3.0 meters. The group noted that the gain from 20 to 30 units was far smaller than the gain from 10 to 20. They suggested that adding pressure helps at first but has less effect at higher levels.\n\nWhich conclusion is best supported by the data?", "options": ["Raising the pressure improved distance, but the improvement became smaller at higher pressure.", "Raising the pressure beyond 20 units made the cart travel a shorter distance.", "The cart traveled the same distance at every pressure that was tested.", "The ramp, not the pressure, caused the differences in distance."], "answer": 0, "explanation": "The distances rise from 2.1 to 2.9 to 3.0 meters, so more pressure helped, but the last step added only 0.1 meter. That matches the stated conclusion of shrinking gains. The 30-unit cart went farther than the 20-unit cart, not shorter. The three distances differ, so they are not equal. The ramp was the same each time, so it cannot explain the differences."}, {"n": 27, "domain": "D8", "stem": "Museum label: The Signal Lantern, c. 1890. Railway workers once carried lanterns like this one to send messages along the track. A colored glass lens could be slid in front of the flame, so that red meant stop, green meant go, and white meant the way was clear. At night, a worker could swing the lantern in set patterns to be seen from a long distance. Electric signals later replaced hand lanterns on most lines.\n\nAccording to the label, what was the purpose of the colored glass lens?", "options": ["It protected the flame from wind during storms at night.", "It made the lantern heavy enough to stay on the track.", "It showed workers which engine was arriving first.", "It changed the color of the light to send a message along the track."], "answer": 3, "explanation": "The label states that the lens could be slid in front of the flame so that red, green and white lights each carried a meaning: stop, go or clear. Wind protection, weight and engine identification are never mentioned. The last sentence about electric signals only explains what replaced the lanterns later, not what the lens did."}, {"n": 28, "domain": "D8", "stem": "Field note: On the morning count, I recorded fourteen pigeons, six sparrows and one hawk on the station roof. By noon, the pigeons had thinned to five and the sparrows had scattered entirely. The hawk was still there, perched on the highest rail and turning its head slowly. Whenever it shifted, nearby pigeons flew off in a body. I suspect the hawk’s presence, rather than the noon heat, explains the change.\n\nWhich detail from the note best supports the writer’s suspicion?", "options": ["Fourteen pigeons were counted on the roof during the morning.", "Nearby pigeons flew off in a body whenever the hawk shifted.", "The hawk was perched on the highest rail near the station.", "Sparrows were counted before the pigeons during the morning count."], "answer": 1, "explanation": "The writer thinks the hawk, not the heat, caused the birds to leave. The best evidence links the hawk’s movement directly to the birds flying away. The morning count and the hawk’s perch describe the situation but do not connect the hawk to the departures. The order in which species were counted has nothing to do with why the birds left."}, {"n": 29, "domain": "D8", "stem": "Campus notice: Beginning Monday, the shuttle that circles the north parking lots will leave every ten minutes instead of every twenty. Riders with a valid student card ride free. Because the buses are busiest between eight and nine in the morning, a third bus will run only during that hour. The change will continue through the end of the semester, when schedules will be reviewed.\n\nWhy does the notice mention that the buses are busiest between eight and nine in the morning?", "options": ["To explain why a third bus will run during that hour", "To show that the shuttle will stop running after the semester ends", "To argue that students should avoid riding the shuttle in the morning", "To announce that student cards will be required on every bus"], "answer": 0, "explanation": "The sentence beginning with ‘Because’ gives the reason for the extra bus: demand peaks between eight and nine. That is a cause-and-effect link. The notice says schedules will be reviewed, not that service ends. It does not discourage morning riding, since it adds service then. The student card requirement is stated separately and is unrelated to the busy hour."}, {"n": 30, "domain": "D8", "stem": "Opinion column: Cities often add parking to fix crowded streets, but extra parking can pull in more cars and recreate the problem. A better first step is to price curbside spaces by demand, so spaces near busy shops cost a little more and a block away costs less. Drivers who can walk a few minutes save money, and the busiest spaces open up for people who truly need them. Pricing alone cannot fix every street, but it is cheaper than building garages.\n\nWhich sentence best states the author’s central claim?", "options": ["Garages are always cheaper to operate than curbside parking spaces.", "Drivers should never park more than a block away from a shop.", "Pricing curbside parking by demand is a better first step than building more parking.", "Crowded streets will disappear once pricing is used on every block."], "answer": 2, "explanation": "The column argues that demand pricing is a better first step than adding parking, and the rest of the passage supports that claim. The author does not say garages are cheaper to operate, only that pricing is cheaper than building them. Walking a few minutes is offered as an option, not a rule. The final sentence admits pricing cannot fix every street, so the last choice overstates the claim."}, {"n": 31, "domain": "D8", "stem": "Technical bulletin: Lithium batteries age in two ways. Each full charge and use slowly reduces capacity, which is called cycle wear. A battery also loses capacity just by sitting, particularly in high heat, which is called calendar wear. Makers therefore suggest keeping a device cool and avoiding long periods at a full charge. Following these steps cannot stop aging, but it can slow it down.\n\nHow does the writer organize the information in the bulletin?", "options": ["By comparing two brands of batteries and recommending the cheaper one", "By describing two kinds of aging and then giving advice", "By telling a story about one device that stopped working suddenly", "By listing events in order from the first charge to the final failure"], "answer": 1, "explanation": "The bulletin first defines two types of wear, cycle and calendar, and then closes with suggestions that slow aging. That is a classification followed by advice. No brands are compared. No single device story appears. The passage does not move through a timeline from first charge to failure, even though it mentions charging, because the two wear types are explained as categories rather than steps."}, {"n": 32, "domain": "D8", "stem": "Travel brief: Rail passengers who book early often pay less, but the lowest fares are limited in number. Some riders overlook this and wait until a trip is close, hoping for a bargain, only to find the cheapest seats gone. Others book too early, before they are sure of their plans, and lose money when they must change. Experts recommend booking about when schedules are confirmed, which balances savings against flexibility.\n\nWhich inference is best supported by the brief?", "options": ["Rail fares never change after the schedules have been confirmed.", "Travelers who change plans always receive a full refund on tickets.", "The cheapest rail seats are available in unlimited numbers all year.", "Waiting too long and booking too early can each cost a rail traveler money."], "answer": 3, "explanation": "The brief describes waiting too long, which loses the cheap seats, and booking too early, which loses money when plans change. Together these support the inference. Nothing says fares are frozen after schedules are confirmed. The statement that early bookers ‘lose money’ contradicts the idea of full refunds. The lowest fares are described as limited, so unlimited cheap seats is the opposite of the text."}, {"n": 33, "domain": "D8", "stem": "Safety flyer: Cyclists should use a white front light and a red rear light after dark. Lights make a rider visible from far away, giving drivers extra time to react. Reflective strips on ankles or wheels add visibility because the moving motion catches the eye. Check batteries weekly so that lights do not fail partway through a ride.\n\nIn the flyer, what does the word ‘react’ most nearly mean?", "options": ["argue loudly about the cyclist", "ignore the lights", "respond to what they see", "repair the bicycle"], "answer": 2, "explanation": "In context, lights give drivers ‘extra time to react,’ meaning time to respond to a rider they can now see. The flyer concerns visibility and safety, so arguing about the cyclist is out of place. Ignoring the lights would defeat their purpose. Repairing the bicycle is not something drivers do, and nothing in the sentence involves fixing equipment."}, {"n": 34, "domain": "D8", "stem": "Two views. Writer 1: A subway line is the best way to move large crowds, because trains carry thousands per hour and never sit in traffic. Writer 2: Buses are the better value for most cities, because lanes can be painted in weeks while tunnels take years and cost far more. Both writers want a reliable system that people will actually use.\n\nHow do the two writers differ in their approaches?", "options": ["Writer 1 prefers buses, while Writer 2 prefers subway trains for all cities.", "Writer 1 focuses on carrying capacity, while Writer 2 focuses on cost and speed of building.", "Both writers agree that tunnels are the fastest and cheapest option.", "Writer 1 focuses on cost, while Writer 2 focuses on train capacity."], "answer": 1, "explanation": "Writer 1 supports subways for how many people they carry and their independence from traffic. Writer 2 supports buses because lanes are fast and cheap compared with tunnels. The correct choice matches each writer with the right reason. The other choices swap the writers’ preferences or reasons, or claim both favor tunnels, which Writer 2 specifically calls slow and expensive."}, {"n": 35, "domain": "D8", "stem": "Airport memo: Passengers often assume a long layover is wasted time, but a layover of three hours or more can be used well. Many terminals now offer quiet rooms, charging stations and short walking paths with signs that count the steps. Travelers who plan one task, such as answering email or stretching, tend to leave the gate feeling less rushed. The memo suggests choosing the task before landing, so the time does not slip away.\n\nWhat is the author’s main purpose in the memo?", "options": ["To warn travelers that long layovers should always be avoided", "To describe how airports count steps along walking paths", "To prove that terminals are quieter than most train stations", "To encourage travelers to use long layovers wisely"], "answer": 3, "explanation": "The memo opens by challenging the idea that layovers are wasted, lists terminal features as support, and ends with advice to pick a task in advance. That shows a purpose of encouraging planned use of the time. Avoiding layovers contradicts the opening. The step-counting signs are only a supporting detail, and no comparison with train stations is made."}, {"n": 36, "domain": "D9", "stem": "Read the sentence: The train arrived ten minutes late, the passengers waited patiently on the platform. Which revision corrects the sentence without changing its meaning?", "options": ["The train arrived ten minutes late, but the passengers waited patiently on the platform.", "The train arrived ten minutes late the passengers waited patiently on the platform.", "The train arrived ten minutes late, the passengers, waiting patiently on the platform.", "The train arrived ten minutes late which the passengers waited patiently on the platform."], "answer": 0, "explanation": "Two complete sentences sit side by side with just a comma between them, which is a comma splice. Adding the conjunction but after the comma fixes it and keeps the contrast. Removing the comma creates a run-on sentence. The third choice leaves a fragment with no verb for the passengers. The fourth choice uses which in a way that does not connect to any word in the first clause."}, {"n": 37, "domain": "D9", "stem": "Read the sentence: The list of approved bus routes for the new schedule are posted outside the office. Which revision corrects the error in the sentence?", "options": ["The list of approved bus routes for the new schedule were posted outside the office.", "The lists of approved bus routes for the new schedule is posted outside the office.", "The list of approved bus routes for the new schedule is posted outside the office.", "The list of approved bus routes for the new schedule are being posting outside the office."], "answer": 2, "explanation": "The subject is the singular noun list, not the plural routes in the prepositional phrase, so the verb must be singular: is posted. The second choice repeats the mismatch by pairing a plural subject with a singular verb. The first choice keeps a plural verb with a singular subject. The last choice adds a malformed verb form, being posting, that creates a new error."}, {"n": 38, "domain": "D9", "stem": "Read the sentence: When the driver spoke with the mechanic, he said he needed to replace the brake pads. Which revision best clarifies who needs to replace the brake pads?", "options": ["When the driver spoke with the mechanic, the mechanic said the brake pads needed replacing.", "When the driver spoke with the mechanic, he said he needed to replace them.", "When the driver spoke with the mechanic, he said that it was necessary.", "The driver spoke with the mechanic, and he said that the pads must be replaced by him."], "answer": 0, "explanation": "In the original, he could refer to either the driver or the mechanic, and the second he is equally unclear. Naming the mechanic and rewording the claim removes the ambiguity. The next choice keeps both pronouns. The following choice adds the vague pronouns he and it. The last choice repeats he twice and also becomes awkward through the passive form."}, {"n": 39, "domain": "D9", "stem": "Read the sentence: The airlines announcement about it’s new baggage policy surprised many travelers. Which revision corrects the error in the sentence?", "options": ["The airlines announcement about it’s new baggage policy surprised many travelers.", "The airline’s announcement about its new baggage policy surprised many travelers.", "The airline’s announcement about it’s new baggage policy surprised many travelers.", "The airlines’ announcement about its’ new baggage policy surprised many travelers."], "answer": 1, "explanation": "Two errors appear in the original. The announcement belongs to one airline, so the possessive is airline’s. The possessive pronoun its has no apostrophe, while it’s means it is. Only the correct choice fixes both. The second choice leaves the missing possessive in airlines, the third leaves it’s, and the fourth moves the apostrophe after the s and adds one to its, which is never correct."}, {"n": 40, "domain": "D9", "stem": "Read the sentence: Three lanes were closed for repairs, traffic backed up for two miles. Which punctuation choice best joins the two ideas into one correct sentence?", "options": ["Three lanes were closed for repairs: traffic, backed up for two miles.", "Three lanes were closed for repairs traffic backed up for two miles.", "Three lanes were closed for repairs, and, traffic backed up for two miles.", "Three lanes were closed for repairs; traffic backed up for two miles."], "answer": 3, "explanation": "A semicolon can join two closely related complete sentences, which is what the two clauses are. The colon choice follows with a fragment and adds an unneeded comma. The no-punctuation choice is a run-on sentence. The last choice places commas around and in a way that splits the conjunction from the second clause and makes the sentence read awkwardly."}, {"n": 41, "domain": "D9", "stem": "Read the sentence: The new app lets riders plan trips, to pay fares and checking arrival times. Which revision corrects the sentence so its parts are parallel?", "options": ["The new app lets riders plan trips, pay fares and check arrival times.", "The new app lets riders plan trips, paying fares and to check arrival times.", "The new app lets riders to plan trips, pay fares and checking arrival times.", "The new app lets riders plan trips, pays fares and checks arrival times."], "answer": 0, "explanation": "A list of actions after lets riders should use the same base verb form: plan, pay and check. The original mixes a base form, an infinitive and an ing form. The first alternative still mixes forms. The second still contains checking and adds an unneeded to. The last gives pays and checks, which do not agree with the plural riders."}, {"n": 42, "domain": "D9", "stem": "Read the sentence: Covered in bright stickers, the mechanic carried the old suitcase to the baggage cart. Which revision corrects the misplaced modifier?", "options": ["Covered in bright stickers, the mechanic carried the old suitcase to the baggage cart.", "The mechanic, covered in bright stickers, carried the old suitcase in a baggage cart.", "Carrying the suitcase, the bright stickers covered the mechanic at the baggage cart.", "Covered in bright stickers, the old suitcase was carried to the baggage cart by the mechanic."], "answer": 3, "explanation": "The opening phrase should describe the suitcase, but the original places it beside the mechanic, which suggests the mechanic is covered in stickers. The correct choice puts the suitcase right after the phrase. The second choice still makes the mechanic the covered one. The third choice makes the stickers cover the mechanic, which is a new misreading."}, {"n": 43, "domain": "D9", "stem": "Read the sentence: Yesterday the crew replaces the signal wires and tests each circuit before the first train arrives. Which revision uses verb tense correctly and consistently?", "options": ["Yesterday the crew replaced the signal wires and tests each circuit before the first train arrived.", "Yesterday the crew replaced the signal wires and tested each circuit before the first train arrived.", "Yesterday the crew replaces the signal wires and tested each circuit before the first train arrives.", "Yesterday the crew has replaced the signal wires and tests each circuit before the first train arrived."], "answer": 1, "explanation": "The word yesterday places every action in the past, so all the verbs should be past tense: replaced, tested and arrived. The first alternative leaves tests in the present. The second leaves replaces and arrives in the present. The third uses has replaced, which does not suit a definite time like yesterday, and keeps tests in the present as well."}, {"n": 44, "domain": "D9", "stem": "Read the sentence: The conductor asked all passengers to except the new seating rules before the train left. Which word should replace the word except?", "options": ["expect", "excerpt", "accept", "exempt"], "answer": 2, "explanation": "Accept means to agree to or receive, which fits the passengers agreeing to follow the rules. Except means to leave out, so it is the wrong word here. Expect means to anticipate, which changes the meaning, since passengers cannot expect rules they are being asked to follow. Excerpt names a short passage, and exempt means freed from a rule, which is the opposite of the request."}, {"n": 45, "domain": "D9", "stem": "Read the sentence: Due to the fact that the road was closed, the delivery driver had to take a longer route that was longer in distance. Which revision is the most concise and clear?", "options": ["Due to the fact that the road was closed, the delivery driver took a route of greater distance.", "Because of the closed road, the delivery driver had to take a route that was long.", "The road being closed, the delivery driver, therefore, had to take a longer route in distance.", "Because the road was closed, the delivery driver had to take a longer route."], "answer": 3, "explanation": "The original wastes words: due to the fact that means because, and a longer route that was longer in distance repeats itself. The correct choice keeps the cause and effect in fewer words. The first alternative remains wordy. The second changes longer to long and loses the comparison. The last keeps the redundancy and adds a needless therefore."}, {"n": 46, "domain": "D9", "stem": "Read the sentence: Neither the driver nor the passengers was aware that the schedule had changed. Which revision corrects the subject-verb agreement?", "options": ["Neither the driver nor the passengers were aware that the schedule had changed.", "Neither the driver nor the passengers is aware that the schedule had changed.", "Neither the driver nor the passengers has been aware that the schedule had changed.", "Neither the driver nor the passengers was being aware that the schedule had changed."], "answer": 0, "explanation": "With neither and nor, the verb agrees with the subject closer to it. The nearer subject is passengers, which is plural, so the verb should be were. The remaining choices keep a singular verb: is, has been or was being aware. Each pairs a singular verb with the plural noun closest to it, and the last also makes the verb form awkward."}, {"n": 47, "domain": "D10", "stem": "Read the paragraph. (1) Many commuters now keep a small repair kit in their bags. (2) A kit with a tire lever and a patch can save a long walk home. (3) Bicycle seats come in many shapes and colors. (4) Even a short repair class helps riders feel more prepared. Which sentence should be removed to improve the focus of the paragraph?", "options": ["Sentence 1, because it introduces the topic too early", "Sentence 2, because it gives an example of a kit’s contents", "Sentence 3, because it does not relate to repair kits", "Sentence 4, because it adds a supporting detail about preparation"], "answer": 2, "explanation": "The paragraph is about commuters preparing for bicycle repairs. Sentence 3 discusses seat shapes and colors, which has no link to repair kits or preparation, so removing it improves focus. Sentence 1 states the topic, which a paragraph needs. Sentence 2 supports it with a concrete example. Sentence 4 supports it with a further detail about readiness."}, {"n": 48, "domain": "D10", "stem": "Read the paragraph. (1) Our town’s old bus shelters need updating. (2) The benches are cracked, and the roofs leak. (3) ______ (4) New shelters would also make riding the bus more appealing to people who now drive. Which sentence best fills the blank as sentence 3 to connect the ideas?", "options": ["Many shelters were built several years ago by local workers.", "Riders who wait in rain or cold may choose another way to travel.", "Buses come every twenty minutes on most weekdays.", "Cracked benches are available in several different colors."], "answer": 1, "explanation": "Sentence 4 begins with also and speaks of making the bus more appealing, so sentence 3 should explain a current problem that discourages riders. Riders waiting in rain or cold fits that link. When the shelters were built does not connect to the appeal of riding. Bus frequency is a separate topic. The color of benches is irrelevant to the damage described in sentence 2."}, {"n": 49, "domain": "D10", "stem": "Read the paragraph. (1) The first trial run of the new ferry was a success. (2) ______ the crew noticed that the loading ramp moved too slowly. (3) They plan to adjust the ramp before opening day. Which transition best fits the blank at the start of sentence 2?", "options": ["Therefore,", "In addition,", "For instance,", "However,"], "answer": 3, "explanation": "Sentence 1 reports a success, and sentence 2 introduces a problem, so a contrast word is needed. However signals that shift. Therefore would suggest the problem followed from the success. In addition would present the problem as another success, which it is not. For instance would present the problem as an example of the success, which makes no sense."}, {"n": 50, "domain": "D10", "stem": "Read the paragraph. (1) Bike share stations are now common in many cities. (2) Riders unlock a bike with a phone, ride to a station near their stop, and return it. (3) The system works best when stations are close together. (4) Cities should place stations within a short walk of one another. Which sentence is the best thesis statement if the writer wants to open the essay with a clear claim?", "options": ["City leaders should place bike share stations close together so that more people can use them.", "Bike share stations are a kind of transportation found in cities.", "A phone is needed to unlock a bike at most stations.", "Some riders return bikes to a different station than where they began."], "answer": 0, "explanation": "A thesis states a debatable claim the rest of the paragraph can support. Sentences 3 and 4 point to station spacing, and the correct choice states it as a recommendation. The second choice is only a general fact. The third describes the unlock process, a detail from sentence 2. The last introduces a point that the paragraph never develops."}]}, {"id": "test6", "title": "Practice Test 6", "items": [{"n": 1, "domain": "D1", "stem": "The community theater on Maple Street has 240 seats, and 3/8 of them were sold for opening night. How many seats were sold?", "options": ["30", "80", "90", "150"], "answer": 2, "explanation": "Multiply 240 by 3/8: divide 240 by 8 to get 30, then multiply by 3 to get 90. The answer 30 stops after finding one eighth. The answer 80 divides by 3 instead of by 8, swapping the numerator and denominator roles. The answer 150 uses 5/8, which is the share of seats that stayed unsold. Keep track of which part the question asks for."}, {"n": 2, "domain": "D1", "stem": "A framed print at a gallery shop costs $48, and this week it is discounted by 25 percent. What is the sale price, in dollars?", "options": ["12", "23", "24", "36"], "answer": 3, "explanation": "Twenty-five percent of 48 is 12, and the sale price is 48 minus 12, which is 36. The answer 12 is only the amount of the discount, not the price after it. The answer 23 subtracts 25 dollars, treating the percent as a dollar amount. The answer 24 takes half of the price, treating 25 percent as 50 percent. The discount must be found first and then removed."}, {"n": 3, "domain": "D1", "stem": "A pottery class recipe calls for 7/20 of a kilogram of clay for each small bowl. Written as a decimal, how many kilograms of clay is that?", "options": ["0.35", "0.7", "2.86", "3.5"], "answer": 0, "explanation": "Convert 7/20 by scaling the denominator to 100: multiply top and bottom by 5 to get 35/100, which is 0.35. The answer 0.7 treats the fraction as 7/10 and ignores the 20. The answer 2.86 flips the fraction and divides 20 by 7. The answer 3.5 slides the decimal point a place, turning 0.35 into 3.5. Check that a value under half a kilogram is below 0.5."}, {"n": 4, "domain": "D2", "stem": "A stage crew mixes set paint at 3 parts blue to 5 parts white. To make 40 cups of paint in all, how many cups of white are needed?", "options": ["8", "15", "24", "25"], "answer": 3, "explanation": "The ratio has 3 + 5 = 8 parts, so each part is 40 divided by 8, which is 5 cups. White takes 5 parts, giving 25 cups. The answer 8 is the number of parts, not a volume. The answer 15 is the blue amount, which responds to a different question. The answer 24 multiplies 40 by 3/5, comparing blue to white instead of white to the whole mix."}, {"n": 5, "domain": "D2", "stem": "A volunteer water station at a charity 5K fills 12 cups every 3 minutes. At that steady rate, how many cups are filled in 45 minutes?", "options": ["15", "57", "180", "540"], "answer": 2, "explanation": "In 45 minutes there are 45 divided by 3, or 15, blocks of 3 minutes. Each block fills 12 cups, so the total is 15 times 12, which is 180. The answer 15 counts only the blocks. The answer 57 adds 12 and 45 instead of using a rate. The answer 540 multiplies 12 by 45 and forgets that the 12 cups take 3 minutes, not 1."}, {"n": 6, "domain": "D2", "stem": "A woven tapestry in the history hall measures 126 inches along its top edge. How long is the tapestry in yards?", "options": ["3.5", "10.5", "42", "1512"], "answer": 0, "explanation": "One yard equals 36 inches, so divide 126 by 36 to get 3.5 yards. The answer 10.5 divides by 12 only, which gives feet. The answer 42 divides by 3 only, using the feet-per-yard number on inches. The answer 1512 multiplies 126 by 12, converting in the wrong direction. Converting to a larger unit should give a smaller number."}, {"n": 7, "domain": "D3", "stem": "A museum scoring sheet rates each exhibit with the expression 3x + 2y, where x is a visitor rating and y is a cost adjustment. What is the score when x = 4 and y = -5?", "options": ["-22", "2", "7", "22"], "answer": 1, "explanation": "Substitute to get 3(4) + 2(-5), which is 12 + (-10), or 2. The answer 22 treats the adjustment as positive 10. The answer 7 forgets to multiply y by 2 and computes 12 - 5. The answer -22 makes both terms negative by flipping the sign on x as well. Keep parentheses around a negative substitution so its sign survives."}, {"n": 8, "domain": "D3", "stem": "A lighting technician is paid a $30 setup fee plus $15 for each hour worked. One shift paid $150 in total. How many hours did the technician work?", "options": ["8", "10", "12", "120"], "answer": 0, "explanation": "Write 30 + 15h = 150. Subtract the fee to get 15h = 120, then divide by 15 to get 8 hours. The answer 10 divides 150 by 15 and ignores the setup fee. The answer 12 adds the fee to the total instead of subtracting it. The answer 120 removes the fee correctly but never divides by the hourly rate."}, {"n": 9, "domain": "D3", "stem": "A choir treasurer solves the inequality 5 - 3x >= 20 while planning the costs of a spring concert. Which solution is correct?", "options": ["x >= -5", "x <= 5", "x <= -5", "x >= 5"], "answer": 2, "explanation": "Subtract 5 from both sides to get -3x >= 15. Dividing by the negative number -3 reverses the inequality, so x <= -5. The choice x >= -5 gets the number right but forgets to reverse the sign. The choice x >= 5 drops the negative sign on the 15 side without flipping. The choice x <= 5 flips the sign but also loses the negative value."}, {"n": 10, "domain": "D3", "stem": "A ramp for a museum entrance is drawn on a design grid as a straight line through the points (2, 5) and (6, 17). What is the y-intercept of that line?", "options": ["-1", "3", "5", "11"], "answer": 0, "explanation": "The slope is (17 - 5) / (6 - 2) = 3. Using y = 3x + b with the point (2, 5) gives 5 = 6 + b, so b = -1. The answer 3 is the slope, not the intercept. The answer 5 is the y-value of the first point. The answer 11 subtracts 6 from 17, mixing a coordinate from each axis. The intercept is where x equals zero."}, {"n": 11, "domain": "D4", "stem": "At a community band concert, adult tickets cost $9 and youth tickets cost $5. The band sold 30 tickets for a total of $230. How many adult tickets were sold?", "options": ["10", "20", "30", "46"], "answer": 1, "explanation": "Let a be adults and y youth. Then a + y = 30 and 9a + 5y = 230. Substituting y = 30 - a gives 4a + 150 = 230, so a = 20. The answer 10 is the number of youth tickets. The answer 30 is the total tickets. The answer 46 divides 230 by the youth price, ignoring the second equation. Both conditions must hold at once."}, {"n": 12, "domain": "D4", "stem": "A mural on a school wall is 5 feet longer than it is wide, and its area is 84 square feet. What is the length of the mural, in feet?", "options": ["5", "7", "9", "12"], "answer": 3, "explanation": "With width w, the area gives w(w + 5) = 84, so w^2 + 5w - 84 = 0, which factors as (w + 12)(w - 7) = 0. The width is 7, so the length is 12. The answer 7 is the width. The answer 5 is only the extra length. The answer 9 estimates the square root of 84, which treats the mural as nearly square."}, {"n": 13, "domain": "D4", "stem": "A sculptor’s cost in dollars for x hours of studio time is modeled by f(x) = 2x^2 + 5x - 4. What is f(-3)?", "options": ["-37", "-10", "-1", "29"], "answer": 2, "explanation": "Substitute -3 for x: 2 times (-3)^2 is 2 times 9, or 18; 5 times -3 is -15; and 18 - 15 - 4 = -1. The answer -37 treats the squared term as negative. The answer -10 drops the coefficient 2 on the squared term and computes 9 - 15 - 4. The answer 29 changes the sign of the middle term and computes 18 + 15 - 4."}, {"n": 14, "domain": "D5", "stem": "A circular fountain base in a city park has a diameter of 10 feet. Using 3.14 for pi, what is the area of the base, in square feet?", "options": ["15.7", "78.5", "157", "314"], "answer": 1, "explanation": "The radius is half the diameter, 5 feet, so the area is 3.14 x 5 x 5 = 78.5 square feet. The answer 314 squares the diameter instead of the radius. The answer 157 multiplies pi by the radius and the diameter. The answer 15.7 multiplies pi by the radius only, leaving out a factor, and the circumference of 31.4 is a length, not an area. Area formulas always use the radius squared."}, {"n": 15, "domain": "D5", "stem": "A wooden planter for a community garden is 5 feet long, 2 feet wide and 1.5 feet deep. What is its volume, in cubic feet?", "options": ["7.5", "8.5", "10", "15"], "answer": 3, "explanation": "Volume is length times width times depth: 5 x 2 x 1.5 = 15 cubic feet. The answer 10 leaves out the depth. The answer 7.5 leaves out the width. The answer 8.5 adds the three dimensions instead of multiplying them. Volume measures filled space, so all three dimensions multiply together."}, {"n": 16, "domain": "D5", "stem": "Two angles of a triangular banner measure 48 degrees and 67 degrees. What is the measure of the third angle, in degrees?", "options": ["42", "65", "115", "132"], "answer": 1, "explanation": "The angles of a triangle add to 180 degrees, so the third is 180 - 48 - 67 = 65. The answer 115 is the sum of the two known angles and was never subtracted from 180. The answer 132 subtracts only 48 from 180. The answer 42 subtracts 48 from 90, using a right angle as if it were the total."}, {"n": 17, "domain": "D6", "stem": "A museum guide picks one visitor at random from a tour group of 4 teachers, 9 students and 7 retirees. What is the probability that the visitor is a student?", "options": ["9/20", "9/16", "9/11", "11/20"], "answer": 0, "explanation": "There are 4 + 9 + 7 = 20 visitors, and 9 are students, so the probability is 9/20. The answer 9/11 compares students to the other visitors, which gives odds rather than probability. The answer 9/16 leaves the retirees out of the total. The answer 11/20 is the probability of not choosing a student."}, {"n": 18, "domain": "D6", "stem": "Six volunteers logged hours this month: 4, 7, 7, 9, 12 and 15. Which value is the median number of hours?", "options": ["7", "8", "9", "11"], "answer": 1, "explanation": "The values are already in order. With six values the median is the mean of the middle two, 7 and 9, which is 8. The answer 7 is the mode. The answer 9 is the mean, since the total of 54 divided by 6 is 9. The answer 11 is the range, 15 minus 4. Each of those describes the data, but none marks the middle."}, {"n": 19, "domain": "D6", "stem": "Five evening concerts have a mean attendance of 86. The first four drew 80, 92, 76 and 88 people. How many people attended the fifth concert?", "options": ["84", "86", "94", "430"], "answer": 2, "explanation": "Five concerts averaging 86 must total 430. The first four total 336, so the fifth drew 430 minus 336, which is 94. The answer 86 repeats the target mean. The answer 84 is the mean of the first four, which ignores the new concert. The answer 430 is the needed grand total and was never reduced by the known attendance."}, {"n": 20, "domain": "D6", "stem": "Of 250 volunteers at a city marathon, 18 percent worked at the finish line. How many volunteers did not work at the finish line?", "options": ["45", "205", "232", "450"], "answer": 1, "explanation": "Eighteen percent of 250 is 45, so the other volunteers number 250 minus 45, which is 205. The answer 45 is the finish-line group itself. The answer 232 subtracts 18 people instead of 18 percent. The answer 450 multiplies 250 by 18 and then divides by 10, a slip with the percent conversion that overshoots the whole group."}, {"n": 21, "domain": "D7", "stem": "Marisol stood on the scaffold with her brush hovering, listening to the hall below. The town had hired her to restore the mural of the old harbor, but the paint along the lower edge had flaked into pale islands. Every few minutes a neighbor stopped to watch, and each one offered a different memory of the boats. She nodded politely and kept working. By noon she realized the restoration was not only about color. Each stroke returned something small to the people watching, and she began to paint more slowly, as if the wall were listening too.\n\nWhich statement best describes how Marisol’s attitude toward her work changes in the passage?", "options": ["She grows frustrated because neighbors keep interrupting her steady concentration all morning.", "She decides the flaking paint is too badly damaged to be repaired properly at all.", "She starts to prefer working quickly so that the job is finished by noon.", "She comes to see the restoration as a gift to her neighbors as well as a job."], "answer": 3, "explanation": "The change is shown in the sentence that says each stroke returned something to the people watching, after which she paints more slowly. That signals respect for the project’s meaning, not only its color. The passage says she nodded politely, so frustration is unsupported. Nothing says the damage is beyond repair. Noon is when she realizes something, not a deadline, and she slows down rather than speeding up."}, {"n": 22, "domain": "D7", "stem": "Tuesday. Today was my first shift at the food pantry, and I was nervous enough to rehearse my greeting twice on the bus. Mr. Alvarez, the coordinator, handed me a clipboard and said to just smile and check names off. A woman in a faded blue coat thanked me three times for a bag of rice, and I felt my cheeks warm. I had expected the work to feel like duty. Instead it felt like being let into a conversation that had started long before me. I wrote down the date so I would remember to come back on Thursday.\n\nAs used in the diary entry, which choice is the best meaning of the word duty?", "options": ["a payment owed to the government on goods", "an honor awarded to someone for long service", "a task a person feels obliged to complete", "a lengthy shift spent watching over a place"], "answer": 2, "explanation": "The writer contrasts duty with the warm feeling of joining a conversation, so duty must mean a chore done because one is expected to do it. The tax meaning does not fit a food pantry. An honor would be a pleasant surprise, not the thing the writer expected to feel. The watching meaning belongs to guard work, and nothing in the entry describes standing watch."}, {"n": 23, "domain": "D7", "stem": "The baton felt slick in Dev’s palm as the runner ahead came around the final curve. Dev had practiced the handoff four hundred times, yet the crowd’s roar seemed to shrink the track into a narrow strip. He crouched, eyes forward, and counted his breaths the way Coach had taught him. When Priya’s hand slapped the baton into his, he did not think about the crowd at all. His legs simply knew the rest.\n\nWhich statement best explains the effect of the sentence “His legs simply knew the rest”?", "options": ["It suggests that Dev’s legs are injured and will not carry him far.", "It reveals that Dev has forgotten the breathing method Coach taught him.", "It implies that Priya is a faster runner than Dev will ever be.", "It shows that his long practice has taken over from his nerves."], "answer": 3, "explanation": "The sentence follows the detail that Dev practiced the handoff four hundred times and that he stopped thinking about the crowd. Saying his legs knew the rest personifies his trained body and shows practice taking over from worry. Injury has no support, since he runs. Counting breaths was Coach’s method and he used it before the handoff. Nothing compares Priya’s speed with his."}, {"n": 24, "domain": "D7", "stem": "The Orpheum had been closed for eleven winters, and its marquee leaned like a tired traveler against the cold sky. Inside, dust lay over the velvet seats as softly as snow. When the volunteers pulled back the heavy curtain, a single beam of light fell across the stage, and for a moment every one of them held still, as though the room had been waiting for exactly this company.\n\nWhich choice best describes the mood the author creates in the passage?", "options": ["quiet anticipation touched with nostalgia", "bitter regret over a long wasted opportunity", "playful excitement about an upcoming celebration", "fearful dread of a dangerous empty building"], "answer": 0, "explanation": "Images such as dust as soft as snow, a single beam of light, and people holding still build a hushed, expectant feeling, while the closed years and the tired marquee add a wistful look backward. No word expresses bitterness or blame. The scene is calm, not playful, and nobody celebrates. The room seems to be waiting for the volunteers, so the tone is welcoming rather than frightening."}, {"n": 25, "domain": "D8", "stem": "Neighborhood Friendship Quilt, cotton, about 1930. Forty women from one neighborhood each stitched a square showing a favorite place or craft, such as a bakery, a river bridge, or a loom. The squares were joined by hand over a single winter and the finished quilt hung in the church hall. Each spring it was shown at the neighborhood fair to raise money for a lending library.\n\nWhich choice best states the main idea of this museum label?", "options": ["Quilts made of cotton are the best way to raise money for libraries.", "A quilt made by many neighbors records their shared places and crafts.", "A single woman sewed a quilt over the course of one long winter.", "River bridges and bakeries are the most common subjects in old quilts."], "answer": 1, "explanation": "The label explains who made the quilt, what each square shows, and how it was used, so its main idea is a shared neighborhood record. The money-raising detail belongs to one use of the quilt and the label never ranks it as best. Forty women sewed squares, so a single maker is wrong. The bridge and bakery are examples from this quilt, not claims about all quilts."}, {"n": 26, "domain": "D8", "stem": "The city council voted on Tuesday to extend the hours of the downtown skate park until nine o’clock on summer evenings. Council member Dana Okafor, who proposed the change, said the park is often empty during the cool evening hours but crowded in the heat of the afternoon. Neighbors will have until the end of the month to send comments, and the council will review the schedule again in September.\n\nAccording to the brief, what will the council do in September?", "options": ["begin accepting comments from neighbors", "close the skate park for repairs", "review the park’s schedule again", "vote to extend the hours until ten o’clock"], "answer": 2, "explanation": "The final sentence says the council will review the schedule again in September, which is the stated September action. Comments are due by the end of the month, so that step comes earlier. Repairs are never mentioned. The brief gives nine o’clock as the new closing time and says nothing about moving it to ten, so that choice invents a plan the passage does not contain."}, {"n": 27, "domain": "D8", "stem": "Long before cities had stadiums, towns gathered in open fields to watch footraces and ball games. These events did more than entertain. They brought families from distant farms together, gave neighbors a reason to trade news, and created shared traditions that outlasted any single season. When towns eventually built grandstands, the crowds did not lose their purpose. The stands simply gave an old habit a permanent home.\n\nWhich inference is best supported by the passage?", "options": ["Gathering for sports has long served social ends beyond fun.", "Grandstands caused families to stop traveling in from distant farms.", "Footraces were always more popular than ball games in early towns.", "Stadiums were built because open fields had become too crowded."], "answer": 0, "explanation": "The passage lists social benefits, such as trading news and building traditions, and says grandstands only housed an old habit. That supports a lasting social purpose. Nothing says grandstands stopped travel. The passage names both kinds of events and does not rank them. It also never states why stands were built, so the crowding claim is unsupported."}, {"n": 28, "domain": "D8", "stem": "Dear Ms. Hartwell: I am writing on behalf of the River Street Mural Club to ask permission to paint the blank east wall of your hardware store. Our design shows local birds along the river, and me
