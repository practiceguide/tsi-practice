ment because it never supplies a main verb for the shop owner."}, {"n": 39, "domain": "D9", "stem": "A supervisor is proofreading a memo about equipment that belongs to several mechanics and to the company. Which sentence uses apostrophes correctly?", "options": ["The mechanic’s tools were stored in the companys locked cabinet.", "The mechanics’ tools were stored in the company’s locked cabinet.", "The mechanics tools were stored in the company’s locked cabinet.", "The mechanics’ tool’s were stored in the companies locked cabinet."], "answer": 1, "explanation": "Several mechanics own the tools, so the plural possessive mechanics’ takes the apostrophe after the s, and the company owns the cabinet, so company’s takes it before the s. The first alternative shows a single mechanic and leaves the apostrophe out of the company’s name. The second leaves out the apostrophe of possession. The last turns the plural tools into a possessive and spells the possessive company incorrectly."}, {"n": 40, "domain": "D9", "stem": "A staff directory contains this sentence about a night supervisor: “My supervisor Ms. Tran who manages the night shift approved the schedule.” The name is extra information, as is the description of her job. Which version is punctuated correctly?", "options": ["My supervisor, Ms. Tran, who manages the night shift, approved the schedule.", "My supervisor, Ms. Tran who manages the night shift approved the schedule.", "My supervisor Ms. Tran, who manages the night shift approved the schedule.", "My supervisor, Ms. Tran, who manages, the night shift, approved the schedule."], "answer": 0, "explanation": "Extra information that can be removed without breaking the sentence must be set off at both ends with commas. Here that means a comma before and after Ms. Tran, and a comma before and after the who clause. The first alternative leaves the second comma out of the name phrase, and the second leaves the pair out altogether. The last splits the clause itself with commas that do not mark any pause in meaning."}, {"n": 41, "domain": "D9", "stem": "A job-site log contains this sentence: “The crew poured the slab on Monday, covers it with plastic that night, and returned on Tuesday to check the curing.” Which revision makes the verb tenses consistent?", "options": ["The crew pours the slab on Monday, covered it with plastic that night, and returns on Tuesday to check the curing.", "The crew poured the slab on Monday, cover it with plastic that night, and returns on Tuesday to check the curing.", "The crew poured the slab on Monday, covered it with plastic that night, and returned on Tuesday to check the curing.", "The crew has poured the slab on Monday, covers it with plastic that night, and returned on Tuesday to check the curing."], "answer": 2, "explanation": "All three actions happened in the past, as the dates Monday and Tuesday show, so each verb should be past tense: poured, covered, and returned. Each alternative keeps at least one present-tense form such as covers or returns, or an unneeded present perfect with has poured. Mixing tenses within a single list of completed actions confuses the timeline for the reader."}, {"n": 42, "domain": "D9", "stem": "A job posting for a front-desk position says: “Duties include answering the phone, to schedule appointments, and filing invoices.” Which revision makes the list of duties parallel?", "options": ["Duties include to answer the phone, scheduling appointments, and filing invoices.", "Duties include answering the phone, scheduling appointments, and to file invoices.", "Duties include answering the phone, schedule appointments, and filing invoices.", "Duties include answering the phone, scheduling appointments, and filing invoices."], "answer": 3, "explanation": "Items in a series should share one grammatical form. The original mixes two -ing forms with the infinitive to schedule. The correct revision uses -ing forms for all three: answering, scheduling, and filing. Each alternative still mixes forms, using to answer or to file beside -ing words, or the bare verb schedule among them."}, {"n": 43, "domain": "D9", "stem": "A bookkeeper wrote this sentence: “Hurrying to finish before closing, the cash register was left unlocked.” Which revision fixes the dangling modifier?", "options": ["Hurrying to finish before closing, the cash register was left unlocked by the clerk.", "Hurrying to finish before closing, the clerk left the cash register unlocked.", "The clerk hurrying to finish before closing, the cash register was left unlocked.", "Before closing, hurrying to finish, the cash register was left unlocked."], "answer": 1, "explanation": "An opening phrase describes the noun that follows it, so the person who was hurrying must come right after the comma. A cash register cannot hurry. The correct revision names the clerk as the subject. The passive version still places the register right after the comma, and the other two keep the register as the thing that appears to be hurrying or leave the phrase attached to no one."}, {"n": 44, "domain": "D9", "stem": "A safety trainer is checking word choice in a handout that says, “All of the apprentices ____ Rosa passed the equipment exam on the first try.” Which word correctly completes the sentence?", "options": ["except", "accept", "expect", "excerpt"], "answer": 0, "explanation": "The sentence needs a word meaning excluding, so Rosa is the one apprentice who did not pass on the first try. That word is except. The word accept is a verb meaning to receive or agree to, which sounds almost the same but cannot replace excluding. The word expect means to anticipate and the word excerpt means a short passage, so neither fits the meaning."}, {"n": 45, "domain": "D9", "stem": "A purchasing assistant is proofreading an order note and must choose the sentence that uses a colon correctly. Which sentence is correct?", "options": ["The manager ordered: gloves, tape, and filters.", "The manager ordered three supplies, such as: gloves, tape, and filters.", "The manager ordered three supplies: gloves, tape, and filters.", "The manager: ordered gloves, tape, and filters."], "answer": 2, "explanation": "A colon follows a complete statement and introduces a list, and the words The manager ordered three supplies form a complete statement. The first alternative places the colon right after a verb that still needs its object, and the third splits the subject from the verb. The second adds such as, which already introduces the examples, so the colon is unnecessary and interrupts the phrase."}, {"n": 46, "domain": "D9", "stem": "A manager wrote this sentence in a team email: “In my personal opinion, I believe that the new schedule is better and improved.” Which revision is the most concise and still keeps the meaning?", "options": ["I believe the new schedule is better.", "In my opinion, I believe the new schedule is better.", "I personally believe that the new schedule is better and improved.", "The new schedule, in my own personal opinion, is improved."], "answer": 0, "explanation": "Each part of the original repeats another: in my opinion and I believe say the same thing, and better and improved say the same thing. The correct revision keeps one of each. The first alternative still repeats the opinion signal. The second keeps better and improved together and adds personally. The last keeps personal opinion and drops the idea that it is better, so it is wordy as well."}, {"n": 47, "domain": "D10", "stem": "A student is revising an essay about a neighborhood hardware store. Read the draft passage. (1) Hollis Hardware keeps drawers of rare screws and bolts that big stores no longer carry. (2) Contractors drive across the county to find a single odd washer. (3) ____ the staff knows each regular customer’s projects by name and will call when a special order arrives. Which choice best fills the blank to introduce the new point?", "options": ["For example, in its stock,", "In contrast,", "Therefore,", "In addition to its stock,"], "answer": 3, "explanation": "Sentences 1 and 2 describe the store’s unusual stock, and sentence 3 adds a second strength, the knowledgeable staff. A phrase that signals an added point fits. For example would suggest that staff service illustrates the stock, which it does not. In contrast would signal an opposing idea, but the staff is another positive. Therefore would claim the stock caused the staff’s behavior, a link the draft never makes."}, {"n": 48, "domain": "D10", "stem": "A student is drafting a paragraph about food stands. (1) A successful food stand needs a clear menu. (2) Customers decide in seconds, so a short list of items they can read at a glance works best. (3) My cousin once sold lemonade at a school fair. (4) Photos beside each item help new customers choose even faster. Which sentence should be deleted to improve the focus of the paragraph?", "options": ["Sentence 1", "Sentence 3", "Sentence 2", "Sentence 4"], "answer": 1, "explanation": "The paragraph is about how a clear menu helps customers decide. Sentence 3 is a personal aside about a school fair that does not support that idea, so it breaks the focus. Sentence 1 states the topic, and sentence 2 explains why short lists work. Sentence 4 adds another menu feature, photos, that serves the same point, so each of those belongs in the paragraph."}, {"n": 49, "domain": "D10", "stem": "A student is combining short sentences in a volunteer program flyer. (1) The workshop opens at seven. (2) The workshop is run by volunteers. (3) It teaches basic wiring to teenagers. Which revision combines the three sentences most effectively?", "options": ["The workshop opens at seven, it is run by volunteers, it teaches basic wiring to teenagers.", "The workshop opens at seven, and the workshop is run by volunteers, and the workshop teaches basic wiring to teenagers.", "Opening at seven, the workshop teaches basic wiring, and volunteers run teenagers.", "The volunteer-run workshop opens at seven and teaches basic wiring to teenagers."], "answer": 3, "explanation": "The best revision turns the volunteer detail into a modifier, volunteer-run, and joins the two actions with and, so every fact survives in one smooth sentence. The first alternative strings three clauses together with commas only, a comma splice. The second repeats the workshop and uses and three times, which is wordy. The last distorts the meaning by saying that volunteers run the teenagers."}, {"n": 50, "domain": "D10", "stem": "A student is writing an essay arguing that small shops should keep a written checklist for opening and closing. The body paragraphs explain that checklists prevent forgotten tasks, help new staff learn quickly, and reduce arguments about who was responsible. Which sentence would make the strongest concluding sentence for the essay?", "options": ["Checklists are used in many places, and some people like them better than others.", "Next, I will explain how to print a checklist on colored paper.", "A simple checklist protects a shop from forgotten tasks, speeds up training, and keeps the team working together.", "Closing times differ from one shop to another across the region."], "answer": 2, "explanation": "A strong conclusion returns to the essay’s main claim and pulls together its three supports: forgotten tasks, training, and teamwork. The first alternative is vague and states no position. The second announces a new topic instead of closing the argument. The last is a loosely related fact about closing times that does not support the claim about checklists."}]}, {"id": "test3", "title": "Practice Test 3", "items": [{"n": 1, "domain": "D1", "stem": "A rain gauge at a field station collected 0.75 inch of rain on Monday and 0.625 inch on Tuesday. What is the total rainfall for the two days, in inches?", "options": ["0.8125", "1.25", "1.325", "1.375"], "answer": 3, "explanation": "Write both amounts with three decimal places and add: 0.750 plus 0.625 equals 1.375. The answer 1.325 comes from a carrying slip in the thousandths and hundredths columns. The answer 1.25 treats 0.625 as 0.5 and drops its last digits. The answer 0.8125 reads 0.625 as 0.0625, which shifts the digit one place to the right. Lining up the decimal points keeps every digit in its own column."}, {"n": 2, "domain": "D1", "stem": "A nature reserve counted 240 birds during a spring survey, and 35 percent of them were finches. How many finches were counted?", "options": ["84", "156", "205", "275"], "answer": 0, "explanation": "Change 35 percent to 0.35 and multiply by 240 to get 84 finches. The answer 156 is the number of birds that were not finches, found by taking 65 percent instead of 35 percent. The answer 205 subtracts 35 from 240 and treats the percent as a plain count. The answer 275 adds 35 to 240. Finding a percent of a quantity is a multiplication, never an addition or a subtraction."}, {"n": 3, "domain": "D1", "stem": "A soil mix for seed trays uses sand, compost and loam in a ratio of 2 to 3 to 5. How many liters of compost are in 40 liters of the finished mix?", "options": ["8", "12", "15", "20"], "answer": 1, "explanation": "The ratio has 2 + 3 + 5 = 10 equal parts, so each part is 40 divided by 10, or 4 liters. Compost takes 3 parts, which is 12 liters. The answer 8 is the sand, which takes 2 parts. The answer 20 is the loam, which takes 5 parts. The answer 15 divides by 8 instead of 10, which leaves out two of the parts in the whole mix."}, {"n": 4, "domain": "D2", "stem": "A stream moves at 3 meters per second. At that speed, how many kilometers does the water travel in one hour?", "options": ["10.8", "108", "180", "10800"], "answer": 0, "explanation": "One hour holds 3,600 seconds, so the water moves 3 x 3,600 = 10,800 meters, which is 10.8 kilometers. The answer 10800 stops before the meters are converted to kilometers. The answer 180 is the distance in meters for one minute, so it never converts minutes to hours. The answer 108 divides by 100 instead of 1,000 in the last step. Convert the time and the distance as two separate steps."}, {"n": 5, "domain": "D2", "stem": "A weather station recorded 2.5 inches of rain in 4 hours. If the rain keeps falling at the same steady rate, how many inches will fall in 10 hours?", "options": ["1.6", "2.5", "6.25", "8.5"], "answer": 2, "explanation": "Set up the proportion 2.5 over 4 equals x over 10. The rate is 0.625 inch per hour, and multiplying by 10 hours gives 6.25 inches. The answer 8.5 adds the 6 extra hours to 2.5, which treats rainfall as something added instead of scaled. The answer 2.5 only restates the ratio of 10 hours to 4 hours. The answer 1.6 flips the rate and divides 4 by 2.5."}, {"n": 6, "domain": "D2", "stem": "A campground charges 24 dollars per night plus a one-time 15 dollar cleaning fee. A group staying 5 nights gets 10 percent off the nightly charges only, not the fee. What is the total cost, in dollars?", "options": ["108", "120", "121.5", "123"], "answer": 3, "explanation": "Five nights cost 24 x 5 = 120 dollars. Taking 10 percent off gives 108, and adding the 15 dollar fee gives 123. The answer 108 forgets the fee. The answer 120 forgets both the discount and the fee. The answer 121.5 applies the discount to the fee as well, taking 10 percent off 135 dollars, which the offer does not allow. Apply each rule only to the part it covers."}, {"n": 7, "domain": "D3", "stem": "A lab technician simplifies the expression 3(2x - 4) - 2(x - 5) while preparing a water-sample worksheet. Which expression is equivalent?", "options": ["4x - 22", "4x + 6", "4x - 2", "8x - 2"], "answer": 2, "explanation": "Distribute to get 6x - 12 - 2x + 10, then combine like terms to get 4x - 2. The choice 4x - 22 multiplies -2 by -5 and gets -10, missing that two negatives make a positive. The choice 8x - 2 ignores the subtraction sign in front of 2x. The choice 4x + 6 multiplies 3 by 2x but leaves the -4 unmultiplied, so it uses -4 + 10."}, {"n": 8, "domain": "D3", "stem": "A weather balloon is 120 meters up when a timer starts, and it rises 40 meters each minute, so its height after t minutes is h = 120 + 40t. After how many minutes will it reach 760 meters?", "options": ["4.75", "16", "19", "22"], "answer": 1, "explanation": "Solve 120 + 40t = 760. Subtract 120 from both sides to get 40t = 640, then divide by 40 to get t = 16. The answer 19 divides 760 by 40 and forgets the starting height. The answer 22 adds 120 instead of subtracting it. The answer 4.75 combines 120 and 40 into 160 before dividing, but the 120 is a starting height and not a rate multiplied by time."}, {"n": 9, "domain": "D3", "stem": "A researcher has 85 dollars to spend on soil-test kits. Each kit costs 6 dollars, and shipping adds a flat 11 dollars to the whole order. What is the greatest number of kits that can be bought?", "options": ["12", "13", "14", "16"], "answer": 0, "explanation": "The cost inequality is 6k + 11 is at most 85, so 6k is at most 74 and k is at most 12.33. Only whole kits can be bought, so the greatest is 12. The answer 13 rounds the 12.33 up, which would cost 89 dollars. The answer 14 divides 85 by 6 and ignores shipping. The answer 16 adds the shipping to the budget instead of subtracting it."}, {"n": 10, "domain": "D3", "stem": "The graph of a straight line crosses the y-axis at 8 and also passes through the point (4, 20) on a field-temperature chart. Which equation describes the line?", "options": ["y = 3x + 20", "y = 3x + 8", "y = 5x + 8", "y = 8x + 3"], "answer": 1, "explanation": "The y-intercept is 8, and the slope is the rise over the run from (0, 8) to (4, 20), which is 12 over 4, or 3. So y = 3x + 8. The equation with 5x divides the full height 20 by 4 and forgets to subtract the starting 8. The equation with + 20 uses the point’s y-value as the intercept. The equation y = 8x + 3 swaps the slope and the intercept."}, {"n": 11, "domain": "D4", "stem": "At a nature park, adult tickets cost 9 dollars and child tickets cost 5 dollars. A group bought 8 tickets for a total of 52 dollars. How many adult tickets did the group buy?", "options": ["3", "4", "5", "12"], "answer": 0, "explanation": "Let a be adult tickets, so children are 8 - a. Then 9a + 5(8 - a) = 52, which gives 4a + 40 = 52, so a = 3. Check: 27 + 25 = 52. The answer 5 is the number of child tickets. The answer 4 assumes the 8 tickets split evenly between adults and children, which would cost 56 dollars. The answer 12 stops at 4a = 12 and forgets to divide by 4."}, {"n": 12, "domain": "D4", "stem": "A technician sets x^2 - 5x - 14 = 0 to find when a sensor reading returns to zero. What are the solutions?", "options": ["x = -7 and x = 2", "x = 5 and x = -14", "x = 7 and x = -2", "x = 14 and x = -1"], "answer": 2, "explanation": "Factor the left side as (x - 7)(x + 2). Setting each factor to zero gives x = 7 and x = -2. Check: 7 x (-2) = -14 and 7 + (-2) = 5, matching the constant and the opposite of the middle coefficient. The pair 7 and -2 reversed in sign would multiply correctly but add to -5. The pair 5 and -14 just copies the coefficients. The pair 14 and -1 multiplies to -14 but adds to 13."}, {"n": 13, "domain": "D4", "stem": "A weather model estimates a pressure change after x hours as f(x) = 2x^2 - 3x + 1. What is f(4)?", "options": ["-3", "19", "20", "21"], "answer": 3, "explanation": "Substitute 4 for x: 2 x 16 - 3 x 4 + 1 = 32 - 12 + 1 = 21. The answer 20 drops the final + 1. The answer 19 subtracts the 1 instead of adding it. The answer -3 computes 2 x 4 instead of 2 x 4^2, so the square is missing. Always square the input first, multiply by the coefficient, and then handle the remaining terms in order."}, {"n": 14, "domain": "D5", "stem": "A circular funnel on a rain gauge has a diameter of 10 centimeters. Using 3.14 for pi, what is the area of its opening, in square centimeters?", "options": ["25", "31.4", "78.5", "314"], "answer": 2, "explanation": "The radius is half the diameter, 5 centimeters, and the area is pi x r^2 = 3.14 x 25 = 78.5 square centimeters. The answer 31.4 is the circumference, pi times the diameter. The answer 25 squares the radius but never multiplies by pi. The answer 314 squares the diameter instead of the radius. Area uses the radius squared and always includes pi."}, {"n": 15, "domain": "D5", "stem": "A rectangular rain barrel is 2 meters long, 1.5 meters wide and 1.2 meters deep. What is its volume, in cubic meters?", "options": ["3.6", "4.7", "9.4", "14.4"], "answer": 0, "explanation": "Volume is length x width x depth, so 2 x 1.5 x 1.2 = 3.6 cubic meters. The answer 4.7 adds the three dimensions, which gives no volume at all. The answer 9.4 doubles that sum, which looks like a perimeter idea. The answer 14.4 is the total surface area, 2 x (3 + 2.4 + 1.8), which measures the outside of the barrel instead of the space inside."}, {"n": 16, "domain": "D5", "stem": "A tent pole stands 8 feet tall, and a guy rope runs from its top to a stake on level ground 6 feet from the base of the pole. How long is the rope, in feet?", "options": ["2", "10", "14", "100"], "answer": 1, "explanation": "The pole, the ground and the rope form a right triangle, so the rope is the hypotenuse: the square root of 8^2 + 6^2, which is the square root of 100, or 10. The answer 100 stops before taking the square root. The answer 14 adds the two legs instead of using the Pythagorean relationship. The answer 2 subtracts the legs, which does not describe the diagonal."}, {"n": 17, "domain": "D6", "stem": "Midday temperatures at a mountain station over five days were 12, 14, 21, 15 and 28 degrees. What is the mean temperature, in degrees?", "options": ["18", "20", "28", "90"], "answer": 0, "explanation": "Add the five values to get 90, then divide by 5 to get a mean of 18. The answer 90 is the sum and was never divided. The answer 28 is only the highest reading. The answer 20 is the midrange, the average of just the smallest and largest values, which ignores the other three days."}, {"n": 18, "domain": "D6", "stem": "A box of pressed leaf samples holds 8 maple, 6 oak, 4 birch and 2 elm leaves. If one leaf is chosen at random, what is the probability that it is not an oak leaf?", "options": ["0.3", "0.4", "0.6", "0.7"], "answer": 3, "explanation": "There are 20 leaves in all, and 20 - 6 = 14 are not oak, so the probability is 14/20, or 0.7. The answer 0.3 is the chance of drawing an oak leaf, the opposite of what was asked. The answer 0.4 is the chance of drawing a maple leaf. The answer 0.6 divides the oak count of 6 by 10 instead of dividing by the total number of leaves."}, {"n": 19, "domain": "D6", "stem": "Each of two consecutive days has a 40 percent chance of rain, and the two days are independent. What is the probability that neither day has rain?", "options": ["0.16", "0.2", "0.36", "0.6"], "answer": 2, "explanation": "The chance of no rain on one day is 1 - 0.4 = 0.6. For independent days, multiply: 0.6 x 0.6 = 0.36. The answer 0.16 is the chance that both days are rainy. The answer 0.6 is the chance for a single dry day, which skips the second day. The answer 0.2 adds the two rain chances to get 0.8 and subtracts from 1, but independent chances multiply instead of adding."}, {"n": 20, "domain": "D6", "stem": "A scatterplot of elevation (x) against average July temperature (y) for twelve weather stations shows points falling from the upper left to the lower right in a fairly tight band. Which statement best describes the relationship?", "options": ["Higher stations tend to have higher July temperatures, a strong positive association", "Elevation and temperature are unrelated because the points do not lie on one exact line", "Higher elevation causes every station’s temperature to drop by exactly the same amount", "Higher stations tend to have lower July temperatures, a strong negative association"], "answer": 3, "explanation": "Points that fall from upper left to lower right show that y decreases as x increases, a negative association, and the tight band makes it strong. The positive reading reverses the direction. The unrelated claim demands a perfect line, which real data rarely shows. The last choice overstates the evidence: a scatterplot shows a trend across stations, not an identical drop for each one, and it cannot prove cause."}, {"n": 21, "domain": "D7", "stem": "Story excerpt: Inés reached the ridge just as the first thunder rolled across the valley. Her father had warned her about afternoon storms, and she had nodded without listening. Now the clouds stacked up like gray stones, and the pines below her bent all in one direction. She tightened the straps on her pack, counted the seconds between the flash and the sound, and started down the trail, quickly but without running.\n\nWhich inference about Inés is best supported by the excerpt?", "options": ["She is excited by the storm and plans to wait on the ridge to watch it.", "She realizes her father’s warning was sound and responds with calm, steady control.", "She has hiked this ridge many times and is not concerned about the weather.", "She is angry with her father and refuses to follow any of his advice."], "answer": 1, "explanation": "The details that she tightens her straps, counts the seconds, and moves ‘quickly but without running’ show a careful, controlled response to danger. Remembering the warning she once ignored shows she now accepts it. Nothing suggests she wants to wait and watch, and she leaves the ridge at once. The text never says she knows the trail well or is angry at her father."}, {"n": 22, "domain": "D7", "stem": "Diary entry, March 3: The ice finally let go of the pond today. All winter it sat there like a lid, and this morning I heard a long, low groan, followed by a crack as sharp as a snapped branch. By noon, dark water showed along the edges and the ducks had returned, circling twice before they landed. I stood at the window longer than I meant to, feeling as though the whole yard had exhaled.\n\nIn the entry, what does the phrase “the whole yard had exhaled” suggest about how the writer feels?", "options": ["fear that the thawing ice will soon cause damage to the nearby house.", "boredom after standing at the window for so many hours this morning.", "disappointment that the ducks arrived so much later than they were expected.", "relief and a sense of release now that winter is loosening its hold."], "answer": 3, "explanation": "To exhale is to let out held breath, which suggests tension easing. Paired with the image of ice that ‘let go’ and the return of the ducks, the phrase conveys relief at winter’s end. Nothing in the entry mentions danger to the house. The writer stood at the window ‘longer than I meant to’ out of interest, not boredom, and the ducks are welcomed, not late."}, {"n": 23, "domain": "D7", "stem": "Story excerpt: The fog came in overnight and swallowed the harbor. By morning the boats were only faint shapes, the foghorn sounded from nowhere in particular, and Tomas could not tell the end of the dock from the water below it. He set his thermos down, felt for the post with his boot, and waited. Somewhere a gull complained. The world had shrunk to the width of his own two arms.\n\nWhich statement best describes the effect of the phrase “swallowed the harbor”?", "options": ["It states the exact time of day when the fog first began to roll in.", "It compares the harbor to a hungry animal that is looking for something to eat.", "It personifies the fog as something that completely hides the harbor from view.", "It shows that Tomas is hungry and has not yet eaten his breakfast."], "answer": 2, "explanation": "Describing fog as swallowing gives it an action usually done by a living creature, which is personification, and the effect is a harbor wholly hidden. The excerpt says only that the fog came ‘overnight,’ so no exact time is given. The comparison is of the fog, not the harbor, to something that swallows. Tomas’s thermos is not evidence of hunger, and the phrase is about the fog."}, {"n": 24, "domain": "D7", "stem": "When the sheep did not come down with the others, Delphine climbed back up alone. The wind had pushed the snow into hard waves, and every step cracked through the crust. She found the ewe wedged between two boulders, shivering but unhurt. Delphine knelt, loosened a stone with her gloved hands, and spoke softly until the animal stepped free. Only then did she notice that she could no longer feel her fingers, and she laughed at herself.\n\nWhat does Delphine’s laughter at the end of the excerpt most likely show?", "options": ["She is making fun of the ewe for getting stuck between the two boulders.", "She is relieved and amused that she was so focused on the sheep that she ignored the cold.", "She is frightened that she may not find her way back down the mountain.", "She thinks the other herders should have helped her rescue the ewe."], "answer": 1, "explanation": "Delphine laughs only after she notices her numb fingers, which she ignored while helping the animal. The laugh is aimed at herself, as the text says, and it follows a successful rescue, so it signals relief and amusement. The ewe is described with concern, not mockery. Nothing in the passage shows fear about the descent or resentment toward other herders; she is calm throughout."}, {"n": 25, "domain": "D8", "stem": "Science brief: Lightning does not strike randomly. A cloud builds up electric charge, and a path of charged air called a stepped leader reaches toward the ground in short jumps. Tall, pointed objects, such as trees and towers, give the leader a shorter route to follow. When the leader connects with a charge rising from the ground, a bright return stroke flashes along the path in a fraction of a second.\n\nWhich statement best expresses the main idea of the brief?", "options": ["Trees and towers produce the electric charge that a thunderstorm cloud holds.", "A return stroke takes much longer to travel than the stepped leader does.", "Lightning follows a predictable process that favors tall, pointed objects.", "Lightning strikes are random events that cannot be explained by science."], "answer": 2, "explanation": "The brief opens by denying that lightning is random and then explains the steps: a leader descends, tall objects offer shorter routes, and a return stroke flashes. That makes a predictable process favoring tall objects the main idea. The clouds, not trees, hold the charge. The return stroke lasts only a fraction of a second, and the opening sentence rejects the idea that strikes are unexplained."}, {"n": 26, "domain": "D8", "stem": "Field note: At the lake station, water samples were taken at dawn, noon and dusk for six days. Oxygen readings were lowest just before sunrise and highest in late afternoon. The pattern matches what the team expected, since the algae near the surface release oxygen while the sun shines and use it up through the night. Cloudy days showed smaller afternoon peaks than clear ones.\n\nWhich detail from the note best supports the claim that sunlight affects oxygen in the lake?", "options": ["Water samples were taken at dawn, noon and dusk for a total of six days.", "Cloudy days showed smaller afternoon peaks of oxygen than clear days did.", "Oxygen readings were lowest in the hours just before the sun came up.", "The team had expected the oxygen pattern before collecting any of the data."], "answer": 1, "explanation": "A claim about sunlight needs evidence that changes when sunlight changes. Smaller peaks on cloudy days, when less sun reached the algae, connects the two directly. The sampling schedule only describes method. The low readings before sunrise fit the pattern but do not isolate sunlight, and the team’s expectation is not evidence at all, since it came before the data."}, {"n": 27, "domain": "D8", "stem": "Weather column: Meteorologists often describe a cold front as a wall of cool air pushing under warm air. Because the cool air is denser, it lifts the warm air quickly, which can build tall clouds and sudden showers. A warm front works differently. The warm air slides gently over a retreating layer of cool air, so rain tends to be lighter and last longer.\n\nWhich organizational pattern does the author mainly use in the column?", "options": ["A list of events arranged in the order in which they happen", "A problem followed by a series of proposed solutions to it", "A cause named first and then a long list of its many effects", "Comparison and contrast of how two kinds of weather fronts behave"], "answer": 3, "explanation": "The author sets a cold front beside a warm front and uses ‘works differently’ to mark the contrast in how each lifts air and produces rain. That is comparison and contrast. The passage is not a time sequence, and it poses no problem to solve. Although causes and effects appear inside each description, the column as a whole is built around the two fronts, not one cause with many effects."}, {"n": 28, "domain": "D8", "stem": "Park flyer: Visiting a tide pool is a wonderful way to meet sea life up close, but the creatures here are fragile. Please step only on bare rock, never on the green or brown patches, which are living algae. Look with your eyes, not your hands, since oils on skin can harm the animals. Return every shell and stone where you found it. These small habits keep the pools healthy for the next visitor.\n\nWhich word best describes the tone of the flyer?", "options": ["Encouraging but firm", "Angry and accusing", "Humorous and joking", "Cold and highly technical"], "answer": 0, "explanation": "The flyer welcomes visitors (‘a wonderful way to meet sea life’) while giving clear rules (‘Please step only on bare rock’), and it closes by explaining that the rules help the next visitor. That balance is encouraging but firm. The tone is polite, so angry and accusing does not fit. There are no jokes. The language is plain and caring, not cold or technical."}, {"n": 29, "domain": "D8", "stem": "Lab report summary: Two groups of students measured how fast ice melted in identical cups placed in different spots. One cup sat in direct sun, and the other sat in shade at the same room temperature. The sunlit ice melted in 38 minutes, while the shaded ice took 61 minutes. The students noted that their thermometer was not checked against a second one, so the exact temperatures may be slightly off.\n\nWhich conclusion is best supported by the report?", "options": ["Sunlight is the only factor that ever affects how quickly ice melts.", "The thermometer readings prove that the room was exactly the same temperature.", "Ice in direct sun melted faster than ice in shade under these conditions.", "Ice melts at the same speed whether it is kept in the sun or in shade."], "answer": 2, "explanation": "The measured times, 38 minutes in sun and 61 in shade, directly support the claim that sunlit ice melted faster in this test. The word ‘only’ in the first distractor goes beyond one experiment. The students admit the thermometer was unchecked, so nothing is proven about exact temperatures. The last choice contradicts the two recorded times, which differ by 23 minutes."}, {"n": 30, "domain": "D8", "stem": "Trail guide: The word “scree” refers to loose, broken rock that collects at the base of a cliff. Hikers crossing a scree slope should take short steps and keep their weight over their feet, since the stones shift and slide with each step. On a steep slope, a falling rock can also tumble onto people below, so groups should cross one at a time and spread out.\n\nBased on the passage, which hazard is a scree slope most likely to present?", "options": ["Shifting stones that can slide underfoot and fall on people below", "Thick fog that makes the trail difficult to follow in the morning", "Deep, soft snow that slows hikers as they climb toward the summit", "Sharp thorns that scratch the arms and legs of hikers on the path"], "answer": 0, "explanation": "The passage defines scree as loose rock and says the stones ‘shift and slide’ and may ‘tumble onto people below.’ Those details name the hazard. Fog, deep snow, and thorns are never mentioned, and none follows from the definition of loose broken rock. The advice to take short steps and cross one at a time responds to the movement and falling of stones, not to weather or plants."}, {"n": 31, "domain": "D8", "stem": "Nature essay: Many people believe that bats are blind, but this is a myth. Most bats see well, and some species see better than humans in dim light. Bats that hunt insects at night add a second tool, echolocation, in which they send out high calls and listen for echoes to find prey. Their eyes and ears work together, so the idea of a helpless, sightless animal does not fit the facts.\n\nWhich sentence best states the author’s purpose in the essay?", "options": ["To persuade readers to build bat houses in their own backyards this season", "To correct a common belief about how bats sense the world around them at night", "To tell a personal story about an unexpected meeting with a bat at night", "To compare the hunting habits of bats with the hunting habits of owls"], "answer": 1, "explanation": "The essay begins by naming a myth, then supplies facts about bat vision and echolocation to show that the myth is wrong, so its purpose is to correct a belief. No call to build bat houses appears. There is no personal story or narrator, and the essay never mentions owls. The closing sentence returns to the myth, confirming the corrective purpose."}, {"n": 32, "domain": "D8", "stem": "Weather service notice: A heat advisory is in effect from noon Thursday until 8 p.m. Friday. Afternoon highs are expected to reach the upper nineties, with humid nights that offer little relief. Residents should drink water often, limit outdoor work to the early morning, and check on neighbors who live alone. Cooling centers will open at the public library and the senior center.\n\nWhich of these actions does the notice recommend?", "options": ["Moving outdoor work to the hottest part of the afternoon", "Waiting until Saturday to open the library and senior center", "Staying away from neighbors who live alone until the advisory ends", "Limiting outdoor work to the cooler early morning hours of each day"], "answer": 3, "explanation": "The notice tells residents to ‘limit outdoor work to the early morning,’ which is the first choice. Doing work in the hottest part of the afternoon reverses that advice. The library and senior center are opening as cooling centers during the advisory, not on Saturday. The notice urges people to check on neighbors who live alone, the opposite of staying away from them."}, {"n": 33, "domain": "D8", "stem": "Science column: When a volcano erupts, the ash it throws into the air can circle the globe. The tiny particles reflect some sunlight back into space, and the air below can cool slightly for a year or two. After the largest eruptions in history, farmers in distant countries reported short summers and early frost. Scientists therefore treat ash clouds as one natural cause of temporary cooling.\n\nWhich statement is an inference supported by the column rather than a stated fact?", "options": ["Volcanic ash can travel through the air all the way around the globe.", "Ash particles reflect some of the sunlight back out into space.", "A big eruption could shorten crop seasons in faraway places around the world.", "Scientists treat ash clouds as one natural cause of temporary cooling."], "answer": 2, "explanation": "The three other choices restate what the column says outright about ash circling the globe, reflecting sunlight, and being treated as a cause of cooling. The correct choice goes one step further by combining the cooling effect with the reports from farmers in distant countries to conclude that crop seasons could shift far away. Stated facts are quoted, while inferences connect details to reach a new point."}, {"n": 34, "domain": "D8", "stem": "Notice to residents: The Eastbrook Wetland Trust will hold a cleanup on the first Saturday of the month, beginning at nine in the morning at the boardwalk entrance. Volunteers should wear boots and bring work gloves, and bags will be provided. Anyone under sixteen must come with an adult. The cleanup ends by noon, when the Trust will serve lunch to every volunteer.\n\nWhat should a volunteer do to prepare for the cleanup?", "options": ["Bring trash bags and a packed lunch to share with the others", "Wear boots and bring work gloves to the boardwalk entrance at the start time", "Arrive at noon so that the Trust can serve lunch to everyone", "Meet at the parking area with an adult over the age of sixteen"], "answer": 1, "explanation": "The notice states that volunteers ‘should wear boots and bring work gloves’ and meet at the boardwalk entrance. Bags and lunch are provided by the Trust, so volunteers need not bring them. Noon is when the cleanup ends and lunch is served, not when it begins. The adult requirement applies only to those under sixteen, and the meeting place is the boardwalk, not a parking area."}, {"n": 35, "domain": "D8", "stem": "Opinion piece: Our town should plant more shade trees along Mill Street. Summer afternoons on the paved stretch feel several degrees hotter than the park two blocks away, and few people walk there at midday. Trees would cool the sidewalk, make the route friendlier to shoppers and cut the cost of running air conditioners in the shops. Planting them now means the trees will be tall by the time the next heat wave arrives.\n\nWhich sentence from the piece contains the author’s main claim?", "options": ["Our town should plant more shade trees along Mill Street.", "Summer afternoons on the paved stretch feel several degrees hotter than the park.", "Few people walk along the stretch of Mill Street at midday on summer days.", "Planting them now means the trees will be tall by the next heat wave."], "answer": 0, "explanation": "The main claim is what the author wants readers to accept, and the word ‘should’ in the opening sentence marks that recommendation. The other sentences supply reasons: the heat on the paved stretch, the lack of walkers, and the timing of growth. Each of those supports the claim but could not stand in for it, because none of them tells the town what action to take."}, {"n": 36, "domain": "D9", "stem": "A student drafts this sentence for a weather report: “The storm moved east overnight, the morning sky was clear.” Which revision corrects the error in the sentence?", "options": ["The storm moved east overnight the morning sky was clear.", "The storm moved east overnight, however the morning sky was clear.", "The storm moved east overnight; and the morning sky was clear.", "The storm moved east overnight, and the morning sky was clear."], "answer": 3, "explanation": "The original joins two complete thoughts with only a comma, which is a comma splice. Adding the conjunction ‘and’ after the comma fixes it. Removing the comma creates a run-on sentence with no punctuation at all. The word ‘however’ is a transitional adverb, which cannot join two sentences with just a comma. A semicolon followed by ‘and’ doubles the joining device and is incorrect."}, {"n": 37, "domain": "D9", "stem": "Consider this sentence: “The collection of rock samples from the three canyons ____ displayed in the main hall of the science center.” Which choice completes the sentence so that the verb agrees with its subject?", "options": ["is", "are", "were", "have been"], "answer": 0, "explanation": "The subject is the singular noun ‘collection,’ and the phrase ‘of rock samples from the three canyons’ only describes it. A singular subject takes the singular verb ‘is.’ The choice ‘are’ agrees with ‘samples’ or ‘canyons,’ which are objects of prepositions and not the subject. The choices ‘were’ and ‘have been’ are also plural, so they repeat the same agreement error with a different tense."}, {"n": 38, "domain": "D9", "stem": "Consider this sentence: “After the creek crossing, the two ____ were caked with mud up to the laces.” Which choice correctly completes the sentence?", "options": ["hikers boots", "hikers’ boots", "hiker’s boots", "hikers’s boots"], "answer": 1, "explanation": "The boots belong to two hikers, so the possessive is formed by adding an apostrophe after the plural noun: hikers’ boots. The choice with no apostrophe leaves out the possessive. The choice ‘hiker’s’ signals one hiker, which conflicts with ‘the two.’ The choice ‘hikers’s’ adds an extra s that is not needed after a plural noun that already ends in s."}, {"n": 39, "domain": "D9", "stem": "A volunteer writes: “When the ranger handed the volunteer a map, she explained that it was out of date.” Which revision most clearly removes the unclear pronoun reference?", "options": ["The ranger handed the volunteer a map, and then she explained that it was out of date.", "When the ranger handed the volunteer a map, it was explained to be out of date.", "The ranger handed the volunteer a map and explained that the map was out of date.", "The ranger handed the volunteer a map, and the volunteer said she explained it was old."], "answer": 2, "explanation": "In the original, ‘she’ could mean the ranger or the volunteer, and ‘it’ could mean the map or something else. The best revision names the ranger as the speaker and repeats ‘the map.’ The first distractor keeps both pronouns, so the confusion stays. The second hides who is speaking behind a passive verb. The third creates a new, confusing claim by changing who is speaking."}, {"n": 40, "domain": "D9", "stem": "A field crew’s plan reads: “The crew will collect soil samples, measuring the air temperature, and to record the wind speed.” Which revision uses parallel structure?", "options": ["The crew will collect soil samples, measuring the air temperature, and recording the wind speed.", "The crew will collect soil samples, to measure the air temperature, and record the wind speed.", "The crew will collect soil samples, the measurement of air temperature, and record the wind speed.", "The crew will collect soil samples, measure the air temperature, and record the wind speed."], "answer": 3, "explanation": "Items in a series should share one grammatical form. The best revision uses three base verbs after ‘will’: collect, measure, record. The first distractor uses two ing forms after a base verb, so the list still shifts forms. The second mixes an infinitive with base verbs. The third puts a noun phrase in the middle of two verbs, which breaks the pattern."}, {"n": 41, "domain": "D9", "stem": "A student drafts this sentence for a beach nature journal: “Walking along the shore, a rare shell caught Lena’s eye.” Which revision corrects the misplaced modifier in the sentence?", "options": ["Walking along the shore, Lena noticed a rare shell.", "Walking along the shore, a rare shell was noticed by Lena’s eye.", "A rare shell caught Lena’s eye, walking along the shore.", "Lena’s eye, walking along the shore, noticed a rare shell."], "answer": 0, "explanation": "The opening phrase ‘Walking along the shore’ must describe the person walking, and in the original it seems to describe the shell. The best revision names Lena right after the comma. The first distractor still places the shell and an eye after the phrase. The second leaves the phrase attached to the shell. The third makes the eye the walker, which is both illogical and awkward."}, {"n": 42, "domain": "D9", "stem": "A student editing a weather journal is checking the punctuation in several sentences about a frozen creek. Which choice uses a semicolon correctly?", "options": ["The creek froze in January; because it did not thaw until March.", "Although the creek froze in January; it did not thaw until March.", "The creek froze in January; it did not thaw until March.", "The creek froze in January; and, it did not thaw until March."], "answer": 2, "explanation": "A semicolon joins two complete sentences that are closely related. ‘The creek froze in January’ and ‘it did not thaw until March’ each stand alone, so the semicolon works. The first distractor places a semicolon before a dependent clause starting with ‘because.’ The second puts a semicolon after an introductory dependent clause, where a comma belongs. The third adds a conjunction and an extra comma after the semicolon."}, {"n": 43, "domain": "D9", "stem": "Consider this sentence: “The botanist’s explanation of how ferns reproduce was so ____ that even the beginners in the audience could follow every step.” Which word best completes the sentence?", "options": ["cryptic", "lucid", "ambiguous", "elaborate"], "answer": 1, "explanation": "The clause after ‘so’ says that beginners could follow every step, which means the explanation was clear. ‘Lucid’ means clear and easy to understand. ‘Cryptic’ and ‘ambiguous’ both describe something confusing or open to several meanings, which is the opposite of the sense required. ‘Elaborate’ means detailed and complex, which would not explain why beginners could follow it so easily."}, {"n": 44, "domain": "D9", "stem": "Consider this sentence: “Scientists hope the new dam will have a lasting ____ on the health of the wetland downstream.” Which choice completes the sentence correctly?", "options": ["affect", "affects", "affecting", "effect"], "answer": 3, "explanation": "The article ‘a’ and the adjective ‘lasting’ call for a noun, and ‘effect’ is the noun meaning a result or outcome. ‘Affect’ is usually a verb meaning to influence, so it cannot follow ‘a lasting’ here. The forms ‘affects’ and ‘affecting’ are also verb forms, and neither fits after ‘a lasting.’ A helpful test is to ask whether the blank names a thing, which calls for effect."}, {"n": 45, "domain": "D9", "stem": "Consider this sentence: “Before the ice melted the team packed three items a sled, a tent and extra fuel.” Which choice correctly punctuates the sentence?", "options": ["Before the ice melted the team packed three items: a sled, a tent, and extra fuel.", "Before the ice melted, the team packed three items: a sled, a tent, and extra fuel.", "Before the ice melted, the team packed three items, a sled, a tent, and extra fuel.", "Before the ice melted, the team packed three items; a sled, a tent, and extra fuel."], "answer": 1, "explanation": "An introductory clause needs a comma before the main clause, and a complete statement that leads into a list takes a colon. The best choice does both and also separates the list items with commas. The first distractor omits the comma after ‘melted.’ The second uses a comma where a colon belongs, which blurs the list with the sentence. The third uses a semicolon, which cannot introduce a list."}, {"n": 46, "domain": "D9", "stem": "Consider this sentence: “The trail crew cleared fallen branches from the path yesterday morning, then ____ the washed-out footbridge by noon.” Which choice completes the sentence so that its verb tenses are consistent?", "options": ["repairs", "will repair", "has been repairing", "repaired"], "answer": 3, "explanation": "The sentence is set in the past, signaled by ‘cleared’ and ‘yesterday morning,’ so the second action must also be in the simple past: repaired. The choice ‘repairs’ is present tense, and ‘will repair’ is future, so both shift the time frame for no reason. The choice ‘has been repairing’ suggests an action that continues up to now, which does not fit a job finished by yesterday’s noon."}, {"n": 47, "domain": "D10", "stem": "A student is revising a paragraph about rain barrels. (1) Rain barrels collect water that would otherwise run off the roof. (2) The stored water can be used on the garden during dry weeks. (3) ____, the barrel lowers the amount of tap water a household needs. (4) A barrel also keeps rain from rushing into the storm drain all at once.\n\nWhich transition best fills the beginning of sentence 3?", "options": ["As a result", "In contrast", "Meanwhile", "For instance, last year"], "answer": 0, "explanation": "Sentence 3 states a consequence of sentence 2: when stored rainwater waters the garden, less tap water is needed. ‘As a result’ signals that cause-and-effect link. ‘In contrast’ signals a difference, which the sentences do not show. ‘Meanwhile’ signals events happening at the same time. ‘For instance, last year’ promises a specific example from the past, but sentence 3 offers a general benefit."}, {"n": 48, "domain": "D10", "stem": "A student is revising a paragraph. (1) Many birds gather on the lake in autumn before they fly south. (2) They rest and feed on the water plants. (3) My cousin took a train to the coast last week. (4) The extra food gives the birds the energy for a long migration.\n\nWhich revision would improve the paragraph’s focus most?", "options": ["Move sentence 3 to the beginning to introduce the idea of travel.", "Combine sentences 1 and 2 to make the paragraph shorter overall.", "Delete sentence 3 because it does not relate to the birds in the paragraph.", "Add a sentence after sentence 3 that describes the coast in detail."], "answer": 2, "explanation": "The paragraph is about why birds gather on the lake, and sentences 1, 2 and 4 all develop that point. Sentence 3 is about a cousin’s train trip, which has nothing to do with it, so deleting it improves unity. Moving it to the start would put the off-topic idea in a stronger position. Combining sentences 1 and 2 does not touch the problem, and describing the coast would add more off-topic detail."}, {"n": 49, "domain": "D10", "stem": "A student is writing a paragraph about frost. The paragraph begins with the sentence below. (1) ____ (2) On clear, still nights the ground loses heat quickly. (3) Water vapor in the air then turns directly into ice crystals on cold surfaces.\n\nWhich sentence would be the best opening sentence for the paragraph?", "options": ["Frost is something that many people have seen on cold windows in winter.", "Frost forms when surface air cools below the freezing point.", "Frost is much prettier than snow, although it melts away more quickly.", "Frost causes major crop losses in some regions each year."], "answer": 1, "explanation": "An opening sentence should introduce the idea that the rest of the paragraph develops, and the sentences that follow explain how frost forms on clear, still nights. The first distractor is true but only mentions where frost is seen. The second gives an opinion about beauty. The third raises crop losses, a new topic that the following sentences never develop, so it would mislead readers about the paragraph’s purpose."}, {"n": 50, "domain": "D10", "stem": "A student is concluding an essay that argues a school should build a rooftop weather station. The body paragraphs describe lower costs, hands-on learning and community data sharing. Which concluding sentence best ends the essay?", "options": ["Weather stations are found in many places, and some of them are quite old.", "Some people might prefer a different project, so the idea may not work.", "Next, the school should also consider repainting the hallways and the library.", "A rooftop station would give students real data and also serve the whole community."], "answer": 3, "explanation": "A strong conclusion restates the essay’s argument by pulling together its main points: real data, lower cost and community connection. The first distractor shifts to general facts about stations and ignores the argument. The second ends on a weak, uncertain note that undercuts the claim. The third introduces an unrelated topic, repainting, that the essay never discussed, and a conclusion should not open a new subject."}]}, {"id": "test4", "title": "Practice Test 4", "items": [{"n": 1, "domain": "D1", "stem": "Mina walks 0.6 mile each morning and 0.85 mile each evening to build a healthy habit. How many miles does she walk in 7 days?", "options": ["4.2", "10.15", "14.5", "20.3"], "answer": 1, "explanation": "Add the two daily walks to get 1.45 miles, then multiply by 7 to get 10.15 miles. The value 4.2 counts only the morning walks over seven days. The value 14.5 multiplies the daily total by 10, a slip of one decimal place. The value 20.3 doubles the correct weekly total by counting each daily sum twice. Combine the walks first, then scale to the week."}, {"n": 2, "domain": "D1", "stem": "A child’s daily water goal at the family clinic rises from 800 milliliters to 1,000 milliliters. By what percent does the goal increase?", "options": ["25", "80", "125", "200"], "answer": 0, "explanation": "Percent increase compares the change to the original amount: 200 divided by 800 is 0.25, or 25 percent. The value 80 expresses the old goal as a percent of the new goal. The value 125 is the new goal as a percent of the old goal, which is the total, not the increase. The value 200 is the change in milliliters and was never converted to a percent."}, {"n": 3, "domain": "D1", "stem": "A smoothie base is made of yogurt, berries and oats by weight in the ratio 4 : 3 : 1. A batch of the base weighs 640 grams. How many grams of yogurt are in the batch?", "options": ["80", "160", "240", "320"], "answer": 3, "explanation": "The ratio has 4 + 3 + 1 = 8 parts, so one part weighs 640 divided by 8, or 80 grams. Yogurt is 4 parts, which is 320 grams. The value 80 is one part, not four. The value 160 divides the total by 4 without finding the whole number of parts. The value 240 is the weight of the berries, the second ingredient rather than the one asked for."}, {"n": 4, "domain": "D2", "stem": "A recipe for vegetable broth needs 2.5 quarts of water, and the cook plans to make a double batch. Given that 1 quart equals 4 cups, how many cups of water does the double batch need?", "options": ["5", "10", "20", "40"], "answer": 2, "explanation": "Double 2.5 quarts to get 5 quarts, then multiply by 4 cups per quart to get 20 cups. The value 5 is the doubled amount still measured in quarts. The value 10 converts to cups but forgets to double the batch. The value 40 uses 8 cups per quart, which confuses the quart with a larger measure. Both the doubling and the conversion are required."}, {"n": 5, "domain": "D2", "stem": "A leaking kitchen faucet drips 18 milliliters of water every minute. How many liters of water drip in 8 hours?", "options": ["0.144", "8.64", "144", "8640"], "answer": 1, "explanation": "Eight hours is 480 minutes, and 18 times 480 is 8,640 milliliters. Dividing by 1,000 gives 8.64 liters. The value 8640 stops before converting to liters. The value 144 multiplies 18 by 8 and treats hours as if they were minutes, leaving milliliters. The value 0.144 makes that same slip and then converts to liters. Convert hours to minutes first because the rate is per minute."}, {"n": 6, "domain": "D2", "stem": "Rice costs 2.40 dollars for 3 pounds at a family market. Mr. Adeyemi needs 7.5 pounds for a community dinner at the same price per pound. What is the cost?", "options": ["$3.13", "$4.50", "$6.00", "$18.00"], "answer": 2, "explanation": "The unit price is 2.40 divided by 3, or 0.80 dollars per pound, and 7.5 pounds cost 0.80 times 7.5, which is 6.00 dollars. The amount 18.00 multiplies the 3-pound price by the pounds needed. The amount 4.50 subtracts 3 from 7.5 and calls the pounds a price. The amount 3.13 divides 7.5 by 2.40, which inverts the rate."}, {"n": 7, "domain": "D3", "stem": "The monthly cost of a home meal service is C = 3(2n - 5) + 4n dollars, where n is the number of meals ordered. What is C when n = 3?", "options": ["15", "25", "39", "45"], "answer": 0, "explanation": "Substitute n = 3: 3(6 - 5) + 12 equals 3 + 12, or 15. The value 25 multiplies only the first term inside the parentheses and leaves the minus 5 outside. The value 39 puts the 4n term inside the parentheses before multiplying by 3. The value 45 flips the sign inside the parentheses to plus 5. Distribute carefully and keep the signs."}, {"n": 8, "domain": "D3", "stem": "Gym Plan A charges a 12 dollar joining fee plus 5 dollars per visit. Gym Plan B charges a 40 dollar joining fee plus 3 dollars per visit. After how many visits do the two plans cost the same amount?", "options": ["6.5", "14", "28", "52"], "answer": 1, "explanation": "Set 12 + 5v equal to 40 + 3v. Subtract 3v and 12 from both sides to get 2v = 28, so v = 14. The value 28 stops before dividing by 2. The value 6.5 adds the visit terms instead of subtracting them and then adds the fees, giving 52 divided by 8. The value 52 is the sum of the two fees, which is not part of the solution."}, {"n": 9, "domain": "D3", "stem": "A baker has 60 dollars to spend. Each bag of flour costs 4.50 dollars, and delivery adds a flat 9 dollars. What is the greatest whole number of bags the baker can order?", "options": ["11", "12", "13", "15"], "answer": 0, "explanation": "The condition is 4.50b + 9 is at most 60, so 4.50b is at most 51 and b is at most 11.33. Only whole bags can be bought, so round down to 11. The value 12 rounds the answer up and would break the budget. The value 13 ignores the delivery fee. The value 15 adds the fee to the budget instead of subtracting it."}, {"n": 10, "domain": "D3", "stem": "A child’s height was 85 centimeters at age 2 and 109 centimeters at age 6. Assuming the growth is linear, what is the slope of the line through these two points, in centimeters per year?", "options": ["0.17", "4", "6", "24"], "answer": 2, "explanation": "Slope is rise over run: (109 - 85) divided by (6 - 2) equals 24 divided by 4, or 6 centimeters per year. The value 24 is the rise alone. The value 4 is the run alone. The value 0.17 inverts the ratio, dividing the run by the rise. A slope must compare the change in height to the change in age, in that order."}, {"n": 11, "domain": "D4", "stem": "At a farm stand, 2 baskets of pears and 1 basket of plums cost 11 dollars. One basket of pears and 1 basket of plums cost 7 dollars. How many dollars do 3 baskets of circumference, 3.14 times the diameter. The value 47.1 multiplies pi by the radius without squaring. The value 2826 squares the diameter instead of the radius. Always halve the diameter before squaring."}, {"n": 15, "domain": "D5", "stem": "A rectangular cooking pot measures 20 centimeters long, 15 centimeters wide and 12 centimeters tall inside. What is its volume in cubic centimeters?", "options": ["47", "300", "1440", "3600"], "answer": 3, "explanation": "Volume of a box is length times width times height: 20 times 15 is 300, and 300 times 12 is 3,600. The value 300 is only the area of the base. The value 47 adds the three dimensions together. The value 1440 is the surface area, which is twice the sum of the three face areas. Capacity needs a product of all three lengths."}, {"n": 16, "domain": "D5", "stem": "A 10-foot ladder reaches 8 feet up a wall. How far from the wall, in feet, is the bottom of the ladder?", "options": ["2", "6", "12.8", "18"], "answer": 1, "explanation": "The ladder, wall and ground form a right triangle with hypotenuse 10 and leg 8. The other leg satisfies a^2 = 100 - 64 = 36, so a = 6. The value 2 subtracts the lengths directly. The value 12.8 adds the squares instead of subtracting them. The value 18 adds the two given lengths. The hypotenuse must be the longest side, so subtract the squares."}, {"n": 17, "domain": "D6", "stem": "Five family dinners took 20, 25, 40, 30 and 45 minutes to prepare. What is the mean preparation time, in minutes?", "options": ["20", "25", "30", "32"], "answer": 3, "explanation": "Add the five times to get 160 and divide by 5 to get 32 minutes. The value 30 is the median of the ordered times, a different measure of center. The value 25 is the range, the largest time minus the smallest. The value 20 is only the shortest time. The mean uses every value, so none of these shortcuts match it."}, {"n": 18, "domain": "D6", "stem": "A snack drawer holds 5 granola bars, 3 fruit bars and 2 nut bars. A child takes one bar without looking, and each bar is equally likely. What is the probability that it is a fruit bar?", "options": ["0.3", "0.43", "0.6", "3"], "answer": 0, "explanation": "There are 10 bars in all and 3 are fruit bars, so the probability is 3 divided by 10, or 0.3. The value 0.43 compares the 3 fruit bars with the 7 other bars instead of with all 10. The value 0.6 compares fruit bars with granola bars. The value 3 is the count of fruit bars, and a probability cannot be larger than 1."}, {"n": 19, "domain": "D6", "stem": "A lunch box is packed by choosing 1 of 4 sandwiches, 1 of 3 fruits and 1 of 2 drinks, either water or milk. How many different lunch boxes are possible?", "options": ["9", "24", "36", "48"], "answer": 1, "explanation": "Independent choices multiply: 4 times 3 times 2 equals 24. The value 9 adds the three counts, which would apply only if the child picked a single item from one pooled list. The value 36 uses the fruit count twice, multiplying 4 by 3 by 3. The value 48 multiplies the correct total by 2 a second time, counting the drink choice twice."}, {"n": 20, "domain": "D6", "stem": "A family tracked nightly sleep for six nights: 8, 5, 9, 6, 7 and 6 hours. What is the median number of hours?", "options": ["4", "6", "6.5", "7"], "answer": 2, "explanation": "Order the values: 5, 6, 6, 7, 8, 9. With six values the median is the average of the third and fourth, so (6 + 7) divided by 2 equals 6.5. The value 6 is the mode, the most frequent value. The value 7 is the mean of about 6.8 rounded up. The value 4 is the range, the gap between 9 and 5."}, {"n": 21, "domain": "D7", "stem": "Dalia pressed the heel of her hand into the dough the way her grandfather had shown her, then folded it over and pressed again. At first the dough stuck to her fingers and tore. Now it grew smooth and sprang back when she poked it. Her grandfather watched from his stool without saying a word. When she looked up, expecting a correction, he only nodded and slid the flour bowl closer to her side of the table.\n\nWhich interpretation of the grandfather’s nod is best supported by the passage?", "options": ["He is tired of watching her practice one step.", "He wants her to stop and begin a new recipe.", "He is waiting for her to ask him for flour.", "He approves of how well she is now kneading."], "answer": 3, "explanation": "The dough has changed from sticky and torn to smooth and springy, and Dalia expects a correction but receives a nod and the bowl moved closer to her. Together these details signal approval. Nothing in the passage mentions tiredness, so that reading invents a feeling. A new recipe is never suggested. The bowl is moved toward Dalia, which gives her more flour to work with, so the idea that he wants her to ask reverses the action."}, {"n": 22, "domain": "D7", "stem": "Tuesday, first week. The apartment is smaller than I pictured, and the radiator knocks like someone tapping a pipe with a spoon. I lay awake for an hour counting the knocks and feeling that I had made a terrible mistake. Tonight, though, I learned that the knocking means the heat is working, and my upstairs neighbor, Mrs. Okafor, left a pot of rice and stew at my door with a note that said welcome. I ate it on the floor beside the window. The knocking sounded almost friendly.\n\nHow does the narrator’s feeling about the new apartment change over the entry?", "options": ["From regret and unease to comfort and a sense of welcome.", "From excitement about the space to disappointment in its size.", "From curiosity about the heating to anger at the neighbor.", "From loneliness in the evening to boredom late at night."], "answer": 0, "explanation": "The entry opens with the narrator lying awake and feeling that moving was a terrible mistake, which signals regret and unease. It closes with a shared meal, a welcome note, and a radiator that sounds almost friendly, which signals comfort. The size of the apartment bothers the narrator only briefly and is never the main shift. The neighbor is kind, not a source of anger. Boredom is not mentioned anywhere in the entry."}, {"n": 23, "domain": "D7", "stem": "Before dawn the kettle starts its thin song,\nand the kitchen fills with the soft gold of the stove light.\nMy mother moves between cupboard and counter\nlike a sailor who knows every rope.\nShe sets out three bowls and pours the oats,\nand the steam unwinds like a slow, warm ribbon\nuntil the whole small room becomes a harbor\nwhere morning comes in to rest.\n\nWhat does the comparison of the mother to a sailor mainly suggest?", "options": ["She dislikes being in the kitchen so early in the day.", "She works with calm skill in a space she knows well.", "She is planning a long journey away from her family.", "She has trouble finding things in the cupboards."], "answer": 1, "explanation": "A sailor who knows every rope handles a ship without hesitation, so the comparison presents the mother as confident and practiced in her own kitchen. The harbor image later in the poem adds to that sense of calm and safety. Nothing in the lines shows that she dislikes the early hour. The sailor image is a comparison about skill, not a hint that she will travel. Knowing every rope is the opposite of searching for things."}, {"n": 24, "domain": "D7", "stem": "Imani had been scrubbing the same pan for ten minutes while her brother Kofi dried plate after plate, humming off-key. “You are doing it again,” she said. “Doing what?” “Humming the same four notes.” Kofi grinned and hummed louder, and when she flicked suds at him, he flicked a towel back. By the time the pan was clean, the floor was wet, and neither of them could stop laughing. “Mom will ask why the kitchen is soaked,” Imani said, reaching for the mop. “We will tell her it was teamwork,” said Kofi.\n\nWhat does the exchange at the end of the passage suggest about the siblings’ relationship?", "options": ["They resent each other’s habits and rarely cooperate.", "They compete to see who can finish chores the fastest.", "They are nervous about being punished by their mother.", "They share an easy, playful bond."], "answer": 3, "explanation": "Both children tease, laugh and play with the suds and towel while working, and Kofi’s joke about teamwork shows they enjoy each other. The complaint about humming is gentle, not resentful, because it ends in laughter. No race or contest is described. Imani mentions what her mother will ask and reaches for the mop, which shows awareness of the mess, not fear of punishment, and the tone stays light throughout."}, {"n": 25, "domain": "D8", "stem": "Notice from the Maple Street Family Clinic: Beginning in March, the clinic will hold a free blood pressure check on the first Saturday of every month from nine to eleven in the morning. No appointment is needed. Nurses will record each reading on a small card so visitors can share it with their regular doctor. The clinic reminds visitors that these checks are a screening, not a diagnosis, and anyone with concerns should book a visit.\n\nAccording to the notice, why will nurses record each reading on a card?", "options": ["So the clinic can diagnose any condition on the spot.", "So visitors will have to book a later appointment with the clinic.", "So visitors can share the result with their regular doctor.", "So the clinic can post the readings for the public."], "answer": 2, "explanation": "The notice states the reason directly: the card lets visitors share each reading with their regular doctor. The clinic says the checks are a screening, not a diagnosis, so the idea of diagnosing on the spot contradicts the text. The notice says no appointment is needed, so the card is not a way to force a later booking. Nothing suggests that readings will be posted, which would also raise privacy concerns."}, {"n": 26, "domain": "D8", "stem": "Riverside Community Kitchen served 1,200 meals in its first month, double what organizers expected. The kitchen, run by volunteers in a church hall, now plans to add a second weeknight. Volunteer coordinator Hana Petrov said the biggest need is people who can chop vegetables before the doors open at five. Donations of rice, beans and cooking oil have kept the shelves stocked, she added, but fresh produce runs out first.\n\nWhich sentence best summarizes the brief?", "options": ["A volunteer kitchen served more than planned and now seeks help to add a night.", "A church hall will be rebuilt to make room for a much larger kitchen.", "Donations of rice and beans have mostly stopped arriving at the kitchen.", "Fresh produce costs less than other foods for most local families."], "answer": 0, "explanation": "A summary covers the whole brief in one sentence: the kitchen exceeded expectations, plans a second weeknight, and needs volunteers. The church hall is only the location, and no rebuilding is mentioned. The coordinator says donations of rice, beans and oil have kept the shelves stocked, so they have not stopped. The remark about fresh produce running out first says nothing about its price compared with other foods."}, {"n": 27, "domain": "D8", "stem": "A school science club tested which of three storage methods kept cut apple slices from browning longest. Slices were left on a plate in the open, in a covered bowl, or in water with a little lemon juice. After four hours, the open slices were brown, the covered slices were slightly brown at the edges, and the lemon water slices were nearly unchanged. The club concluded that limiting contact with air and adding acid both slow browning, though they noted that the water also softened the slices.\n\nWhich conclusion is best supported by the results?", "options": ["Covering the bowl stopped browning completely for four hours.", "Open air slowed browning more than lemon water did.", "Soaking in water keeps cut apples fresh for a full day.", "Lemon water slowed browning the most but also changed the slices’ texture."], "answer": 3, "explanation": "The lemon water slices were nearly unchanged after four hours, the best result, and the club noted that the water softened them, which is a change in texture. The covered slices were slightly brown at the edges, so covering did not stop browning completely. The open slices browned fully, so open air did the opposite of what the second choice claims. The test lasted four hours, so a full day is unsupported."}, {"n": 28, "domain": "D8", "stem": "Pestle and Mortar, stone, about 150 years old. Families in this region ground spices and dried chilies in stone bowls like this one before electric grinders arrived. The rough inside of the bowl crushed seeds, while the heavy pestle gave the cook leverage. This bowl was donated by the Mensah family, who used it daily until 1985 to prepare the evening meal.\n\nAccording to the label, what was the purpose of the rough inside of the bowl?", "options": ["It kept the spices from touching the cook’s hands.", "It helped crush seeds.", "It made the bowl lighter to carry to the table.", "It showed which family had donated the bowl."], "answer": 1, "explanation": "The label states that the rough inside of the bowl crushed seeds while the heavy pestle gave leverage, so the texture worked with the pestle to grind spices. Nothing says the surface protected the cook’s hands. The label never discusses carrying the bowl or its weight. The donor family is named separately in the last sentence, and a rough surface is not described as a mark of ownership."}, {"n": 29, "domain": "D8", "stem": "Opinion: Families often say they have no time to cook, yet a ten-minute plan can change that. Choose one grain, one vegetable and one protein on Sunday, and cook double of each. Reheating those parts through the week takes less time than waiting for delivery and costs far less. Critics say leftovers get boring, but a pinch of new spice or a squeeze of lemon makes the same base taste fresh. The real obstacle is not time; it is the habit of deciding at six o’clock, when everyone is already hungry.\n\nHow does the author respond to the critics of the plan?", "options": ["The author admits leftovers can feel dull and offers a simple fix.", "The author argues that nobody ever grows bored of eating leftovers.", "The author says delivery meals are healthier than home cooking.", "The author claims most families already cook double each Sunday."], "answer": 0, "explanation": "The author names the critics’ complaint that leftovers get boring and answers it with a practical remedy: a new spice or a squeeze of lemon. That is a concession plus a fix. The author does not deny that boredom can happen. Delivery is mentioned only as slower and costlier, not healthier. The plan is presented as something families should start, so claiming they already do it contradicts the argument."}, {"n": 30, "domain": "D8", "stem": "Good evening, neighbors. When we started the walking group, there were four of us and one very slow dog. Tonight there are forty, and I can promise you the dog is still slow. We began because a few of us wanted to stay active without joining an expensive gym. We stayed because we found something better: someone who notices when you do not show up. So thank you for showing up, and please bring one friend next Thursday.\n\nWhat is the speaker’s main purpose in this excerpt?", "options": ["To explain why walking is better than joining a gym.", "To announce that the dog will no longer attend.", "To thank the members and encourage them to invite others.", "To scold members who sometimes miss meetings."], "answer": 2, "explanation": "The speaker thanks the audience (“thank you for showing up”) and ends with a request to bring a friend, so the purpose is gratitude and encouragement to grow the group. Gyms are mentioned only to explain how the group started, not to compare exercise methods. The dog is a joke about the group’s pace. The line about someone noticing an absence is warm, not a scolding, since it is offered as a reason people stayed."}, {"n": es only one method, so it is not a comparison. No problem is stated, so a problem and solution frame does not fit. The steps are instructions, not effects produced by an earlier cause."}, {"n": 33, "domain": "D8", "stem": "Field note: By the third week of June, the tomato plants in Row 2 had grown nearly twice as tall as those in Row 4, though both rows were planted on the same day from the same packet of seeds. Row 2 sits along the south fence and receives sun from morning until late afternoon. Row 4 sits beside the shed, which casts a shadow across it after noon. Both rows were watered on the same schedule.\n\nWhich inference is best supported by the field note?", "options": ["Seeds from a different packet were used for Row 4.", "Row 4 was watered less often than Row 2 was.", "The difference in sunlight probably explains the difference in plant height.", "The shed should be removed to protect the tomato plants."], "answer": 2, "explanation": "The note rules out the other likely causes: the seeds came from the same packet, planting happened on the same day, and the watering schedule was the same. The remaining difference it describes is sunlight, since Row 4 is shaded after noon, so sunlight is the best-supported inference. The note never recommends removing the shed. That would be an opinion about action, not an inference drawn from the evidence."}, {"n": 34, "domain": "D8", "stem": "I was glad to read that our town plans to add a playground at Hill Park. But the plan places the new equipment next to the road with no fence. Last summer, I watched a toddler run toward the curb while his grandfather stood twenty feet away. A simple fence would cost little compared with the equipment itself. I urge the council to add one before the playground opens.\n\nWhich detail from the letter is a specific event the writer uses to support the request for a fence?", "options": ["A toddler ran toward the curb at the park last summer.", "The town plans to add a playground at Hill P
