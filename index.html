mbers will supply all paint and ladders. We will meet with you to approve the sketch before beginning, and we will finish within two weekends so the shop’s entrance stays open. Thank you for considering a project that could brighten the street for everyone. Sincerely, Tomas Reyes, club volunteer\n\nWhat is the primary purpose of the letter?", "options": ["to advertise paint and ladders to local business owners", "to announce that a mural on the east wall is finished", "to complain that the street has too many blank walls", "to ask a store owner for permission to paint a mural"], "answer": 3, "explanation": "The opening line states the purpose: the club asks permission to paint the east wall. The rest of the letter supports that request by promising supplies, a sketch review, and a short schedule. The club supplies its own paint and ladders, so it is not selling them. The mural has not been started, so it cannot be finished. The tone is polite and hopeful, with no complaint."}, {"n": 29, "domain": "D8", "stem": "Field note, Saturday, wetland cleanup. Eight volunteers collected forty bags of litter along the east shore. Most items were plastic bottles and food wrappers, which gathered where the reeds slow the current. Because the reeds trap trash, the team plans to return monthly to the same stretch instead of searching the whole shoreline.\n\nWhich choice best describes the structure of the note?", "options": ["It lists events in the order they will take place over the next year.", "It compares two different shorelines point by point to pick a winner.", "It reports what was found and then explains a plan based on that finding.", "It argues against volunteer cleanups by offering several detailed counterexamples."], "answer": 2, "explanation": "The first sentences report results, namely the bags collected and the kinds of litter. The final sentence begins with because and gives a plan that follows from the reeds trapping trash. That is a report followed by a reasoned next step. The note describes one shoreline, so there is no comparison. The plan is monthly, not a year-long schedule, and the note supports cleanups rather than arguing against them."}, {"n": 30, "domain": "D8", "stem": "Notice to students: The Campus Theater Club will hold open auditions on Monday and Tuesday from four to six o’clock in Room 112. No experience is needed, and students may read a short passage provided at the door. Those who cannot attend may send a one minute recording by Friday. Costume and set crews are also welcome to sign up at the same table.\n\nWhich student would be able to take part in an audition under the notice?", "options": ["a student who arrives at Room 112 at seven on Monday evening", "a student who sends a short recording by Friday", "a student who wants to read a two page speech of their own writing", "a student who plans to join a costume crew by telephone"], "answer": 1, "explanation": "The notice allows those who cannot attend in person to send a one minute recording by Friday, so that student qualifies. Auditions end at six o’clock, so a seven o’clock arrival is too late. The passage is supplied at the door, and nothing allows a speech of the student’s own. Crews sign up at the table in person, and no telephone option is given."}, {"n": 31, "domain": "D8", "stem": "Every community should keep its small history museum open to the public free of charge. Admission fees may be low, but they still keep away families who might otherwise wander in on a slow afternoon. In towns that dropped their fees, volunteers report that more school groups booked tours. The lost fee income is small next to the value of a child meeting local history for the first time.\n\nWhich detail from the passage best supports the author’s claim that free admission is worthwhile?", "options": ["Towns that dropped their fees saw more school tours booked.", "Admission fees at small museums are usually quite low.", "Many history museums are staffed almost entirely by volunteers.", "Large museums in other countries charge much higher prices."], "answer": 0, "explanation": "Evidence must show a benefit that comes from removing fees. The report of more school tours in fee-free towns does that. Low fees are given as a concession and do not show a benefit of going free. Volunteer staffing and the prices at large foreign museums do not appear as supporting facts in the passage and do not connect to the claim."}, {"n": 32, "domain": "D8", "stem": "Friends, neighbors, and fellow volunteers: tonight we gather not to celebrate a finished building but to honor the hands that raised it. For two summers, retired carpenters taught teenagers to measure twice and cut once. Shopkeepers donated lumber they could scarcely spare. The result is a community stage that will outlast every one of us. Let us remember that generosity is not measured by what we give but by what we are willing to give up.\n\nIn the speech, what does the phrase “scarcely spare” most nearly mean?", "options": ["happily choose to waste", "have stored for many years", "refuse to share with anyone", "barely afford to give away"], "answer": 3, "explanation": "The speaker praises the shopkeepers’ generosity and ends by saying real giving means giving something up. So the lumber was something they had little of and could hardly afford to donate. The waste meaning contradicts the praise. Storage for years is never mentioned. Refusing to share is the opposite of what the shopkeepers did, since the speech says they donated the lumber."}, {"n": 33, "domain": "D8", "stem": "Ana Lucero spent thirty years teaching art in a small mountain school. Without a kiln, she taught her students to shape figures from river clay and dry them in the sun. Former students recall that the pieces cracked as often as they held, and that she praised the cracks as lessons. Several of them now run studios of their own.\n\nWhat is the author’s main purpose in the passage?", "options": ["to persuade readers to purchase river clay from mountain suppliers", "to show how a teacher’s resourcefulness shaped her students", "to explain in careful detail how a kiln fires clay at high heat", "to compare small mountain schools with schools in large cities"], "answer": 1, "explanation": "The passage describes a teacher who improvised with river clay and sun drying and ends by noting that several students became studio owners. That points to a purpose of showing her influence. Nothing sells clay. The passage mentions that she had no kiln but never explains how kilns work. No city school appears, so a comparison is unsupported."}, {"n": 34, "domain": "D8", "stem": "To prepare a community mural wall, volunteers first wash the surface with a stiff brush and water, then repair cracks with patching compound. After the compound dries overnight, they brush on a coat of primer and wait a full day. Only then do they sketch the design in chalk, which can be wiped away if the artist changes the plan.\n\nWhich step happens immediately before the volunteers sketch the design in chalk?", "options": ["They repair the cracks with patching compound first.", "They wash the whole wall with a stiff brush and water.", "They brush on primer and let it dry.", "They wipe away the chalk lines to change the plan."], "answer": 2, "explanation": "The passage orders the steps with first, then, after, and only then. Washing comes first, patching second, the overnight dry third, and primer with a day of waiting fourth. Chalk follows the primer wait, so primer is the step just before sketching. Patching and washing come earlier in the sequence. Wiping chalk happens after sketching, only if the artist revises the design."}, {"n": 35, "domain": "D8", "stem": "Letter one to the parks board: “The youth soccer league needs the east field every Saturday morning, because games need good light and dry grass.” Letter two to the parks board: “The community garden club needs the east field’s corner every Saturday morning, because seedlings must be watered before the day heats up.”\n\nWhich statement describes an idea that both letters share?", "options": ["The east field should be closed to every group until further notice.", "Youth games and gardening can never take place on the same day.", "The parks board has already turned down both requests.", "Saturday morning is a valuable time to use the east field."], "answer": 3, "explanation": "Each writer asks for the east field on Saturday morning and gives a reason that morning suits the activity, so both treat that time as valuable. Neither letter asks for the field to be closed. The writers do not say the activities cannot share the day, and one asks only for a corner. Neither letter mentions an earlier refusal from the board."}, {"n": 36, "domain": "D9", "stem": "A volunteer writing the program notes for a community choir concert drafted this sentence: “The choir rehearsed for three hours, the director still wanted another run-through.” Which revision corrects the error in the sentence?", "options": ["The choir rehearsed for three hours, but the director still wanted another run-through.", "The choir rehearsed for three hours the director still wanted another full run-through.", "The choir rehearsed for three hours; but the director still wanted a run-through.", "The choir rehearsed for three hours, however the director still wanted another run-through."], "answer": 0, "explanation": "The draft joins two complete thoughts with only a comma, which is a comma splice. Adding the conjunction but after the comma fixes it. Removing the comma leaves a run-on with no punctuation at all. A semicolon cannot be followed by a coordinating conjunction in this way. The word however is not a conjunction, so a comma before it still splices the clauses."}, {"n": 37, "domain": "D9", "stem": "A history club newsletter contains this sentence with one word missing: “The collection of antique posters ____ on loan from the city archive until the end of the spring exhibit.” Which choice correctly completes the sentence?", "options": ["are", "were", "is", "have been"], "answer": 2, "explanation": "The subject is the singular noun collection, not the plural noun posters inside the phrase that follows it. A singular subject takes the singular verb is. The choice are matches the nearby plural word posters instead of the true subject. The choices were and have been are plural forms and also shift the sentence away from the present exhibit that the sentence describes."}, {"n": 38, "domain": "D9", "stem": "A sports league newsletter includes this sentence: “Both ____ whistles were lost during the weekend tournament, so the referees borrowed new ones.” Which choice correctly completes the sentence for two coaches who each lost a whistle?", "options": ["coach’s", "coaches’", "coaches", "coaches’s"], "answer": 1, "explanation": "Two coaches own the whistles, so the noun must be plural and possessive. A plural ending in s adds only an apostrophe, giving coaches’. The form coach’s is singular possessive and suggests one coach. The plain plural coaches shows no ownership. The form coaches’s adds an extra ending that is not used for a plural noun already ending in s."}, {"n": 39, "domain": "D9", "stem": "A museum volunteer drafted this sentence for a training handout: “The curator told the volunteer that she had misplaced the catalog.” Which revision most clearly removes the unclear pronoun reference?", "options": ["The curator said to the volunteer, “You have misplaced the catalog.”", "The curator told the volunteer that she had, in fact, misplaced the catalog.", "The curator told her volunteer that she had misplaced the catalog.", "The curator, who told the volunteer she had misplaced the catalog."], "answer": 0, "explanation": "The pronoun she could refer to either the curator or the volunteer. Using direct address with the word you names the person who lost the catalog. Adding the phrase in fact leaves she just as unclear. Changing the volunteer to her volunteer adds a second pronoun without settling the problem. The last choice is a sentence fragment because who has no main verb to complete it."}, {"n": 40, "domain": "D9", "stem": "A student wrote this sentence for a race recap: “The coach blew the whistle, the runners lined up, and the crowd quiets.” Which revision corrects the inconsistent verb tense?", "options": ["The coach blew the whistle, the runners line up, and the crowd quieted.", "The coach blew the whistle, the runners lined up, and the crowd had quieted.", "The coach blew the whistle, the runners lined up, and the crowd will quiet.", "The coach blew the whistle, the runners lined up, and the crowd quieted."], "answer": 3, "explanation": "The first two verbs, blew and lined, are in the simple past, so the last verb should be past as well: quieted. The choice that changes lined to line creates a new shift to the present. The choice with had quieted moves the crowd’s action before the others and breaks the sequence. The choice with will quiet jumps to the future and disrupts the story."}, {"n": 41, "domain": "D9", "stem": "A festival organizer is editing a flyer that contains this sentence with one word missing: “The ____ reason for moving the opening concert indoors was the forecast of heavy rain.” Which choice correctly completes the sentence?", "options": ["principle", "principal", "principally", "principals"], "answer": 1, "explanation": "The blank needs an adjective meaning main, and principal is the word with that meaning. The word principle is a noun for a rule or belief, so it cannot describe the reason. The word principally is an adverb, which would modify a verb or adjective rather than the noun reason. The word principals is a plural noun for school heads or lead performers and also does not fit."}, {"n": 42, "domain": "D9", "stem": "An archive newsletter lists volunteer duties in this sentence: “Volunteers at the archive sort old letters, label folders, and ____.” Which choice best completes the sentence so that it uses parallel structure?", "options": ["are helping visitors to find records", "helping visitors who find records", "help visitors find records", "to help visitors find the records"], "answer": 2, "explanation": "The first two items, sort and label, are present-tense verbs that share the subject volunteers. A third matching item must also be a plain verb phrase, such as help visitors find records. The choice with are helping changes the form. The choice beginning with helping is an ing form that breaks the pattern. The choice beginning with to help adds an infinitive and no longer matches the first two verbs."}, {"n": 43, "domain": "D9", "stem": "A drama club member drafted this sentence for a show program: “Painting quickly, the mural was finished by the students before dinner.” Which revision corrects the dangling modifier?", "options": ["Painting quickly, the mural was completed before dinner by the students.", "The mural, painting quickly, was finished by the students before dinner.", "Quickly painted, the students finished the mural before dinner.", "Painting quickly, the students finished the mural before dinner."], "answer": 3, "explanation": "A mural cannot paint, so the opening phrase painting quickly does not logically describe the word that follows. Making the students the subject lets the phrase modify the people who did the painting. The passive rewrite still starts with a modifier next to the mural. Moving the phrase inside the sentence says the mural was painting. Quickly painted wrongly describes the students."}, {"n": 44, "domain": "D9", "stem": "A volunteer coordinator is preparing a poster for the spring festival and wants every line to read cleanly. Which version is punctuated correctly?", "options": ["The festival offered three attractions: a pottery tent, a drum circle, and a storytelling stage.", "The festival offered three attractions, a pottery tent, a drum circle, and a storytelling stage.", "The festival offered three attractions; a pottery tent, a drum circle, and a storytelling stage.", "The festival offered three attractions a pottery tent, a drum circle, and a storytelling stage."], "answer": 0, "explanation": "A colon follows a complete clause when a list that explains it comes next, and the first part of this sentence is complete. A comma there would create a comma splice. A semicolon must join two independent clauses, but the list is not one. Leaving out punctuation entirely runs the clause into the list and makes the sentence hard to read."}, {"n": 45, "domain": "D9", "stem": "A civic center bulletin includes this sentence without commas: “Rosa Delgado the volunteer coordinator opened the doors at nine o’clock for the first workshop of the season.” Which version uses commas correctly?", "options": ["Rosa Delgado, the volunteer coordinator opened the doors at nine o’clock for the first workshop of the season.", "Rosa, Delgado the volunteer coordinator, opened the doors at nine o’clock for the first workshop of the season.", "Rosa Delgado, the volunteer coordinator, opened the doors at nine o’clock for the first workshop of the season.", "Rosa Delgado the volunteer, coordinator opened the doors at nine o’clock for the first workshop of the season."], "answer": 2, "explanation": "The phrase the volunteer coordinator adds extra information about Rosa Delgado, so it must be set off by a pair of commas, one before and one after. The choice with only the first comma leaves the phrase half open. The choice that splits the name misplaces the first comma. The last choice breaks the title in the middle and sets off only one word."}, {"n": 46, "domain": "D9", "stem": "A town festival committee is revising a notice that reads: “Due to the fact that it rained, the parade was postponed until the following afternoon.” Which revision is the most concise while keeping the meaning of the sentence?", "options": ["Owing to the circumstance of rain falling, the parade got postponed until the following afternoon.", "Because it rained, the parade was postponed until the next afternoon.", "It rained, therefore the parade was postponed until the next afternoon.", "The parade was postponed until the following afternoon, on account of the fact of rain."], "answer": 1, "explanation": "The phrase due to the fact that is a wordy way to say because, and the revised sentence keeps every idea in fewer words. The second choice replaces one wordy phrase with another. The third choice is shorter but joins two clauses with only a comma, creating a splice. The fourth choice is longer and keeps the same wordy construction."}, {"n": 47, "domain": "D10", "stem": "A drama student drafted a paragraph about a community theater. Read the paragraph. (1) The Maple Street Players began in a borrowed garage. (2) Six neighbors built a stage from old doors. (3) ____ the group performs in a restored hall with two hundred seats.\n\nWhich transition best fills the blank at the start of sentence 3?", "options": ["Over the years,", "For example,", "In contrast,", "As a result of the rain,"], "answer": 0, "explanation": "Sentences 1 and 2 describe the group’s humble start, and sentence 3 describes where it performs now, so the transition should signal the passage of time. Over the years does that. For example would introduce a sample of an earlier point. In contrast suggests an opposing idea, but the sentences show growth. The rain is never mentioned, so that phrase has no support."}, {"n": 48, "domain": "D10", "stem": "A volunteer is revising a paragraph for a river race program. (1) The river race brings hundreds of rowers to our town each spring. (2) Local volunteers set out buoys the day before to mark the course. (3) The town bakery sells cinnamon rolls on Saturdays. (4) Other volunteers staff first aid tents along the bank. (5) Without these helpers, the race could not run safely.\n\nWhich sentence should be deleted to keep the paragraph focused on its main idea?", "options": ["Sentence 2, because it describes work done before the race day", "Sentence 4, because it repeats an idea from the first sentence of the paragraph", "Sentence 5, because it states a conclusion without any supporting detail", "Sentence 3, because it does not relate to how volunteers support the race"], "answer": 3, "explanation": "The paragraph is about how volunteers make the race safe. Sentence 3 turns to a bakery’s cinnamon rolls, which has no link to the race or its helpers, so it should go. Sentence 2 gives a volunteer task and supports the focus. Sentence 4 adds a second kind of helper rather than repeating the opener. Sentence 5 ties the details together and is the paragraph’s conclusion."}, {"n": 49, "domain": "D10", "stem": "A civics student is organizing a paragraph about town meetings. (1) Residents then vote by raising their hands. (2) First, the moderator reads each proposal aloud. (3) Next, neighbors may speak for up to two minutes. (4) Town meetings give residents a direct voice in local decisions.\n\nWhich order of the sentences makes the paragraph most logical?", "options": ["Sentence 2, then 3, then 1, then 4", "Sentence 4, then 3, then 2, then 1", "Sentence 4, then 2, then 3, then 1", "Sentence 2, then 4, then 3, then 1"], "answer": 2, "explanation": "A paragraph usually opens with the general idea, and sentence 4 states it. The signal words then explain the process: first the proposal is read, next neighbors speak, and then residents vote. The order that ends with the general idea is a valid pattern, but it separates the process from its introduction. Placing speaking before reading, or the main idea in the middle, breaks the first, next, then sequence."}, {"n": 50, "domain": "D10", "stem": "A student is finishing a short essay about a community bicycle workshop. Every Saturday, a group of retirees repairs bicycles at the community center and hands them to children who cannot afford one. The retirees learned the trade over sures add to 90 degrees.", "area": "Math"}, {"front": "Composite number", "back": "A whole number greater than 1 that has more than two factors, such as 12.", "area": "Math"}, {"front": "Constant", "back": "A term with no variable, whose value does not change, such as 9 in 3x + 9.", "area": "Math"}, {"front": "Coordinate plane", "back": "A flat grid formed by a horizontal x-axis and a vertical y-axis, used to locate points.", "area": "Math"}, {"front": "Denominator", "back": "The bottom number of a fraction, which tells how many equal parts make the whole.", "area": "Math"}, {"front": "Diameter", "back": "A segment through the center of a circle with both ends on the circle. It equals twice the radius.", "area": "Math"}, {"front": "Difference", "back": "The result of subtraction.", "area": "Math"}, {"front": "Discount", "back": "An amount taken off a price, often given as a percent of the original price.", "area": "Math"}, {"front": "Distributive property", "back": "Multiplying a sum by a number equals multiplying each addend and adding: a(b + c) = ab + ac.", "area": "Math"}, {"front": "Equation", "back": "A statement that two expressions are equal, joined by an equals sign.", "area": "Math"}, {"front": "Evaluate", "back": "To find the value of an expression by replacing each variable with a given number and computing.", "area": "Math"}, {"front": "Exponent", "back": "A small raised number that tells how many times the base is used as a factor.", "area": "Math"}, {"front": "Expression", "back": "A combination of numbers, variables and operations that does not contain an equals sign.", "area": "Math"}, {"front": "Factor", "back": "A whole number that divides another whole number with no remainder. Also, to write a product of factors.", "area": "Math"}, {"front": "Function", "back": "A rule that assigns exactly one output to each input.", "area": "Math"}, {"front": "Greatest common factor", "back": "The largest number that divides two or more numbers evenly. For 12 and 18 it is 6.", "area": "Math"}, {"front": "Hypotenuse", "back": "The longest side of a right triangle, opposite the right angle.", "area": "Math"}, {"front": "Inequality", "back": "A statement that compares two expressions using less than, greater than, or a similar symbol.", "area": "Math"}, {"front": "Integer", "back": "A whole number or its opposite, such as -3, 0 or 8.", "area": "Math"}, {"front": "Intercept", "back": "A point where a graph crosses an axis. The y-intercept is where x = 0.", "area": "Math"}, {"front": "Irrational number", "back": "A number that cannot be written as a fraction of integers, such as the square root of 2 or pi.", "area": "Math"}, {"front": "Least common multiple", "back": "The smallest positive number that is a multiple of each of two or more numbers.", "area": "Math"}, {"front": "Like terms", "back": "Terms with the same variable part, such as 3x and 8x, which can be combined.", "area": "Math"}, {"front": "Linear equation", "back": "An equation whose graph is a straight line, such as y = 2x + 1.", "area": "Math"}, {"front": "Mean", "back": "The average of a data set: the sum of the values divided by how many values there are.", "area": "Math"}, {"front": "Median", "back": "The middle value of a data set arranged in order, or the average of the two middle values.", "area": "Math"}, {"front": "Mode", "back": "The value that appears most often in a data set.", "area": "Math"}, {"front": "Monomial", "back": "A polynomial with one term, such as 5x^2.", "area": "Math"}, {"front": "Numerator", "back": "The top number of a fraction, which counts the equal parts taken.", "area": "Math"}, {"front": "Order of operations", "back": "The agreed sequence for computing: parentheses, exponents, multiplication and division, then addition and subtraction.", "area": "Math"}, {"front": "Outlier", "back": "A data value that is far from most of the other values.", "area": "Math"}, {"front": "Parabola", "back": "The U-shaped curve that is the graph of a quadratic function.", "area": "Math"}, {"front": "Percent", "back": "A ratio out of 100. Fifty percent means 50 out of 100.", "area": "Math"}, {"front": "Percent change", "back": "The change in a quantity divided by the original amount, written as a percent.", "area": "Math"}, {"front": "Perimeter", "back": "The total distance around the outside of a shape.", "area": "Math"}, {"front": "Polynomial", "back": "An expression made of terms with variables raised to whole-number powers, added or subtracted.", "area": "Math"}, {"front": "Prime number", "back": "A whole number greater than 1 whose only factors are 1 and itself, such as 7.", "area": "Math"}, {"front": "Probability", "back": "A number from 0 to 1 that measures how likely an event is: favorable outcomes over total outcomes.", "area": "Math"}, {"front": "Product", "back": "The result of multiplication.", "area": "Math"}, {"front": "Proportion", "back": "A statement that two ratios are equal, such as 3/4 = 6/8.", "area": "Math"}, {"front": "Pythagorean theorem", "back": "In a right triangle, a^2 + b^2 = c^2, where c is the hypotenuse.", "area": "Math"}, {"front": "Quadratic equation", "back": "An equation that can be written as ax^2 + bx + c = 0, where a is not zero.", "area": "Math"}, {"front": "Quotient", "back": "The result of division.", "area": "Math"}, {"front": "Radius", "back": "The distance from the center of a circle to any point on it.", "area": "Math"}, {"front": "Range", "back": "In statistics, the largest value minus the smallest. For a function, the set of all outputs.", "area": "Math"}, {"front": "Rate", "back": "A ratio that compares two quantities with different units, such as miles per hour.", "area": "Math"}, {"front": "Ratio", "back": "A comparison of two quantities, written as a to b, a:b or a/b.", "area": "Math"}, {"front": "Rational number", "back": "A number that can be written as a fraction of two integers, with a nonzero denominator.", "area": "Math"}, {"front": "Reciprocal", "back": "The fraction turned upside down. The reciprocal of 3/5 is 5/3, and their product is 1.", "area": "Math"}, {"front": "Scientific notation", "back": "A way to write a number as a product of a value from 1 up to 10 and a power of 10.", "area": "Math"}, {"front": "Slope", "back": "The steepness of a line: rise over run, or the change in y divided by the change in x.", "area": "Math"}, {"front": "Solution", "back": "A value of the variable that makes an equation or inequality true.", "area": "Math"}, {"front": "Square root", "back": "A number that, multiplied by itself, gives the original number. The square root of 49 is 7.", "area": "Math"}, {"front": "Sum", "back": "The result of addition.", "area": "Math"}, {"front": "Supplementary angles", "back": "Two angles whose measures add to 180 degrees.", "area": "Math"}, {"front": "System of equations", "back": "Two or more equations with the same variables, solved together for values that satisfy all of them.", "area": "Math"}, {"front": "Term", "back": "A number, a variable, or a product of numbers and variables, separated from others by plus or minus signs.", "area": "Math"}, {"front": "Unit rate", "back": "A rate with 1 in the denominator, such as 60 miles per 1 hour.", "area": "Math"}, {"front": "Variable", "back": "A letter that stands for an unknown or changing number.", "area": "Math"}, {"front": "Volume", "back": "The amount of space inside a solid, measured in cubic units.", "area": "Math"}, {"front": "Adaptive test", "back": "A test that chooses later questions based on how you answered earlier ones.", "area": "Reading and writing"}, {"front": "Adjective", "back": "A word that describes a noun or pronoun, such as tall or blue.", "area": "Reading and writing"}, {"front": "Adverb", "back": "A word that describes a verb, adjective or another adverb, often telling how, when or where.", "area": "Reading and writing"}, {"front": "Antecedent", "back": "The noun that a pronoun refers back to.", "area": "Reading and writing"}, {"front": "Apostrophe", "back": "A mark that shows possession or replaces missing letters in a contraction.", "area": "Reading and writing"}, {"front": "Audience", "back": "The people a writer is trying to reach, which shapes tone and word choice.", "area": "Reading and writing"}, {"front": "Author’s purpose", "back": "The main reason a writer wrote a text, such as to inform, persuade or entertain.", "area": "Reading and writing"}, {"front": "Bias", "back": "A one-sided leaning in a text that favors one view without fair treatment of others.", "area": "Reading and writing"}, {"front": "Claim", "back": "A statement that a writer wants the reader to accept, usually backed by evidence.", "area": "Reading and writing"}, {"front": "Clause", "back": "A group of words with a subject and a verb.", "area": "Reading and writing"}, {"front": "Cohesion", "back": "The way ideas in a text connect smoothly through repeated key terms, pronouns and transitions.", "area": "Reading and writing"}, {"front": "Comma splice", "back": "An error in which two independent clauses are joined by only a comma.", "area": "Reading and writing"}, {"front": "Conclusion", "back": "The closing part of an essay, which restates the main point and leaves the reader with a final thought.", "area": "Reading and writing"}, {"front": "Conjunction", "back": "A word that joins words, phrases or clauses, such as and, but or because.", "area": "Reading and writing"}, {"front": "Connotation", "back": "The feeling or association a word carries beyond its dictionary meaning.", "area": "Reading and writing"}, {"front": "Context clue", "back": "A hint in the surrounding words that helps you work out the meaning of an unfamiliar word.", "area": "Reading and writing"}, {"front": "Counterargument", "back": "An opposing point that a writer acknowledges and answers to strengthen an argument.", "area": "Reading and writing"}, {"front": "Denotation", "back": "The literal dictionary meaning of a word.", "area": "Reading and writing"}, {"front": "Dependent clause", "back": "A clause with a subject and verb that cannot stand alone as a sentence.", "area": "Reading and writing"}, {"front": "Diagnostic", "back": "A short test used to show which skills a student has and which need more work.", "area": "Reading and writing"}, {"front": "Diction", "back": "A writer’s choice of words.", "area": "Reading and writing"}, {"front": "Distractor", "back": "A wrong answer choice designed to look plausible to someone who has made a common error.", "area": "Reading and writing"}, {"front": "Evidence", "back": "Facts, examples or details from a text or experience that support a claim.", "area": "Reading and writing"}, {"front": "Figurative language", "back": "Language that uses comparison or exaggeration, such as simile or metaphor, instead of literal meaning.", "area": "Reading and writing"}, {"front": "Fragment", "back": "A group of words that is punctuated like a sentence but lacks a subject, a verb or a complete thought.", "area": "Reading and writing"}, {"front": "Fused sentence", "back": "Two independent clauses run together with no punctuation or joining word.", "area": "Reading and writing"}, {"front": "Genre", "back": "A category of writing, such as fiction, biography or a news report.", "area": "Reading and writing"}, {"front": "Independent clause", "back": "A clause with a subject and verb that can stand alone as a complete sentence.", "area": "Reading and writing"}, {"front": "Inference", "back": "A conclusion you reach by combining clues in the text with what you already know.", "area": "Reading and writing"}, {"front": "Introduction", "back": "The opening part of an essay, which presents the topic and the thesis.", "area": "Reading and writing"}, {"front": "Irony", "back": "A contrast between what is expected or said and what actually happens or is meant.", "area": "Reading and writing"}, {"front": "Main idea", "back": "The central point a passage makes about its topic.", "area": "Reading and writing"}, {"front": "Metaphor", "back": "A comparison that says one thing is another without using like or as.", "area": "Reading and writing"}, {"front": "Modifier", "back": "A word or phrase that adds detail to another word in the sentence.", "area": "Reading and writing"}, {"front": "Mood", "back": "The feeling a text creates in the reader.", "area": "Reading and writing"}, {"front": "Narrator", "back": "The voice that tells a story.", "area": "Reading and writing"}, {"front": "Noun", "back": "A word that names a person, place, thing or idea.", "area": "Reading and writing"}, {"front": "Pacing", "back": "Spending time on each question so that you can finish the whole test calmly.", "area": "Reading and writing"}, {"front": "Parallel structure", "back": "Using the same grammatical form for items in a pair or series.", "area": "Reading and writing"}, {"front": "Paraphrase", "back": "To restate a passage in your own words while keeping its meaning.", "area": "Reading and writing"}, {"front": "Point of view", "back": "The perspective from which a story is told, such as first person or third person.", "area": "Reading and writing"}, {"front": "Predicate", "back": "The part of a sentence that tells what the subject does or is.", "area": "Reading and writing"}, {"front": "Prefix", "back": "A word part added to the start of a word that changes its meaning.", "area": "Reading and writing"}, {"front": "Process of elimination", "back": "A test strategy of removing choices you know are wrong, so any guess is better informed.", "area": "Reading and writing"}, {"front": "Pronoun", "back": "A word that takes the place of a noun, such as she, they or it.", "area": "Reading and writing"}, {"front": "Rubric", "back": "A scoring guide that lists the qualities a piece of writing is judged on.", "area": "Reading and writing"}, {"front": "Run-on sentence", "back": "A sentence in which independent clauses are joined incorrectly, as a fused sentence or comma splice.", "area": "Reading and writing"}, {"front": "Semicolon", "back": "A mark that joins two closely related independent clauses.", "area": "Reading and writing"}, {"front": "Simile", "back": "A comparison that uses like or as.", "area": "Reading and writing"}, {"front": "Subject", "back": "The part of a sentence that tells who or what the sentence is about.", "area": "Reading and writing"}, {"front": "Subject-verb agreement", "back": "Matching a verb to its subject in number, so singular subjects take singular verbs.", "area": "Reading and writing"}, {"front": "Suffix", "back": "A word part added to the end of a word that changes its meaning or its part of speech.", "area": "Reading and writing"}, {"front": "Summary", "back": "A short statement of the main points of a text, without personal opinion.", "area": "Reading and writing"}, {"front": "Supporting detail", "back": "A fact or example that explains or proves the main idea.", "area": "Reading and writing"}, {"front": "Theme", "back": "The underlying message or lesson about life that a literary work conveys.", "area": "Reading and writing"}, {"front": "Thesis statement", "back": "A sentence that states the central claim of an essay.", "area": "Reading and writing"}, {"front": "Tone", "back": "The writer’s attitude toward the subject, shown through word choice and style.", "area": "Reading and writing"}, {"front": "Topic sentence", "back": "A sentence that states the main idea of a paragraph.", "area": "Reading and writing"}, {"front": "Transition", "back": "A word or phrase that links ideas, such as however, for example or therefore.", "area": "Reading and writing"}, {"front": "Verb", "back": "A word that expresses an action or a state of being.", "area": "Reading and writing"}, {"front": "Verb tense", "back": "The form of a verb that shows when an action happens: past, present or future.", "area": "Reading and writing"}, {"front": "Voice", "back": "A writer’s distinct style, or the form of a verb showing whether the subject acts or is acted upon.", "area": "Reading and writing"}]}</script>

function home(){
 clearInterval(timer);S=null;F=null;var best=store.get("best",{});
 var h='<h2>Practice Tests</h2><div class="card"><p>Six full-length tests, each with 20 mathematics questions and 30 reading and writing questions, the same questions and answer letters as in the book. The real assessment is untimed and adaptive; these tests are fixed-order and you may turn the clock on or off. Finish a test, then read every explanation.</p>'+
 '<label>Clock: <select id="clk"><option value="0">Off (untimed)</option><option value="90">90 minutes</option><option value="120">120 minutes</option></select></label></div>';
 D.tests.forEach(function(t,i){var b=best[t.id];h+='<div class="card a"><b>'+t.title+'</b> <small>50 questions'+(b!=null?" &middot; best score "+b+" of 50":"")+'</small><br><button onclick="startTest('+i+')">Start</button>'+(store.get("saved_"+t.id,null)?'<button class="alt" onclick="startTest('+i+',true)">Resume</button>':"")+'</div>'});
 h+='<h2>Flashcards</h2><div class="card"><p>'+D.cards.length+' key terms and ideas from the book&rsquo;s glossary.</p><button onclick="startCards(\'All\')">All cards</button><button class="alt" onclick="startCards(\'Math\')">Math only</button><button class="alt" onclick="startCards(\'Reading and writing\')">Reading and writing only</button></div>'+
 '<p class="note">An independent study aid. Not affiliated with or endorsed by the Texas Higher Education Coordinating Board, any college, or the testing vendor. It contains no actual test questions. Confirm current requirements with your college. Your progress is saved only in this browser.</p>';
 app.innerHTML=h}
function startTest(i,resume){
 var t=D.tests[i],lim=+document.getElementById("clk").value;
 var sv=resume?store.get("saved_"+t.id,null):null;
 S=sv||{i:i,ans:{},flag:{},cur:0,left:lim?lim*60:0,lim:lim};
 if(S.lim){timer=setInterval(function(){S.left--;var e=document.getElementById("tm");if(e)e.textContent=fmt(Math.max(S.left,0));if(S.left<=0){clearInterval(timer);finish()}persist()},1000)}
 drawQ()}
function persist(){store.set("saved_"+D.tests[S.i].id,S)}
function drawQ(){
 var t=D.tests[S.i],q=t.items[S.cur];persist();
 var h='<div class="bar"><span>'+t.title+' &middot; Question '+(S.cur+1)+' of 50 &middot; '+secName(S.cur+1)+'</span><span>'+(S.lim?'Time left <b id="tm">'+fmt(S.left)+'</b>':'Untimed')+'</span></div>'+
 '<div class="grid">'+t.items.map(function(_,k){return'<button class="'+(S.ans[k]!=null?"done ":"")+(S.flag[k]?"flag ":"")+(k==S.cur?"cur":"")+'" onclick="go('+k+')">'+(k+1)+'</button>'}).join("")+'</div>'+
 '<div class="stem">'+esc(q.stem)+'</div>';
 q.options.forEach(function(o,k){h+='<button class="opt'+(S.ans[S.cur]===k?" sel":"")+'" onclick="pick('+k+')"><b>'+L[k]+'.</b> '+esc(o)+'</button>'});
 h+='<button class="alt" onclick="go('+(S.cur-1)+')"'+(S.cur?"":" disabled")+'>Back</button><button class="alt" onclick="go('+(S.cur+1)+')"'+(S.cur<49?"":" disabled")+'>Next</button><button class="alt" onclick="flag()">'+(S.flag[S.cur]?"Unflag":"Flag for review")+'</button><button class="warn" onclick="submit()">Finish test</button>';
 app.innerHTML=h;window.scrollTo(0,0)}
function go(k){if(k<0||k>49)return;S.cur=k;drawQ()}
function pick(k){S.ans[S.cur]=k;drawQ()}
function flag(){S.flag[S.cur]=!S.flag[S.cur];drawQ()}
function submit(){var un=50-Object.keys(S.ans).length;if(un&&!confirm(un+" question(s) are unanswered. Finish anyway?"))return;finish()}
function finish(){
 clearInterval(timer);var t=D.tests[S.i],sec={Mathematics:[0,0],Reading:[0,0],Writing:[0,0]},tot=0,miss=[];
 t.items.forEach(function(q,k){var s=secName(k+1);sec[s][1]++;if(S.ans[k]===q.answer){sec[s][0]++;tot++}else miss.push(k)});
 var best=store.get("best",{});if(best[t.id]==null||tot>best[t.id])best[t.id]=tot;store.set("best",best);
 var hist=store.get("hist",[]);hist.push({t:t.title,s:tot,d:new Date().toLocaleDateString()});store.set("hist",hist.slice(-30));
 try{localStorage.removeItem("tsi_saved_"+t.id)}catch(e){}
 var h='<h2>'+t.title+' results</h2><div class="card"><p style="font-size:1.4rem"><b>'+tot+' of 50 correct</b> ('+(tot*2)+' percent)</p><table><tr><th>Section</th><th>Correct</th></tr>'+
 Object.keys(sec).map(function(k){return"<tr><td>"+k+"</td><td>"+sec[k][0]+" of "+sec[k][1]+"</td></tr>"}).join("")+'</table>'+
 '<p class="note">Percent correct is a practice measure only. It is not a predicted TSI score, and colleges set their own score requirements.</p></div>'+
 '<button onclick="review(false)">Review all explanations</button><button class="alt" onclick="review(true)">Review only my misses ('+miss.length+')</button><button class="alt" onclick="home()">Back to home</button>';
 if(hist.length>1)h+='<h2>Recent attempts</h2><table><tr><th>Test</th><th>Score</th><th>Date</th></tr>'+hist.slice(-8).reverse().map(function(x){return"<tr><td>"+x.t+"</td><td>"+x.s+" of 50</td><td>"+x.d+"</td></tr>"}).join("")+'</table>';
 app.innerHTML=h;window.scrollTo(0,0)}
function review(onlyMiss){
 var t=D.tests[S.i],h='<h2>'+t.title+' review</h2><button class="alt" onclick="home()">Back to home</button>';
 t.items.forEach(function(q,k){var mine=S.ans[k];if(onlyMiss&&mine===q.answer)return;
  h+='<div class="card"><b>Question '+(k+1)+'</b> <small>'+secName(k+1)+'</small><div class="stem">'+esc(q.stem)+'</div>';
  q.options.forEach(function(o,j){h+='<div class="opt '+(j===q.answer?"good":(j===mine?"wrong":""))+'"><b>'+L[j]+'.</b> '+esc(o)+(j===q.answer?" (correct)":"")+(j===mine&&j!==q.answer?" (your answer)":"")+'</div>'});
  if(mine==null)h+='<p class="note">You left this unanswered.</p>';
  h+='<div class="expl"><b>Explanation.</b> '+esc(q.explanation)+'</div></div>'});
 app.innerHTML=h;window.scrollTo(0,0)}
function startCards(area){
 var known=store.get("known",{});var deck=D.cards.map(function(c,i){return{i:i,c:c}}).filter(function(x){return area==="All"||x.c.area===area});
 F={area:area,deck:deck,pos:0,back:false,known:known,onlyUnknown:false};drawCard()}
function pool(){return F.deck.filter(function(x){return!F.onlyUnknown||!F.known[x.i]})}
function drawCard(){
 var p=pool(),h='<h2>Flashcards: '+esc(F.area)+'</h2><div class="bar"><span>'+F.deck.filter(function(x){return F.known[x.i]}).length+' of '+F.deck.length+' marked known</span><label><input type="checkbox" '+(F.onlyUnknown?"checked":"")+' onchange="F.onlyUnknown=this.checked;F.pos=0;F.back=false;drawCard()"> Hide known cards</label></div>';
 if(!p.length){h+='<div class="card"><p>Every card in this deck is marked known. Uncheck the box to see them again.</p></div><button class="alt" onclick="home()">Back to home</button>';app.innerHTML=h;return}
 if(F.pos>=p.length)F.pos=0;var x=p[F.pos];
 h+='<div class="fc'+(F.back?" back":"")+'" onclick="F.back=!F.back;drawCard()">'+esc(F.back?x.c.back:x.c.front)+'</div><p class="note" style="text-align:center">Card '+(F.pos+1)+' of '+p.length+' &middot; tap the card to flip</p>'+
 '<button class="alt" onclick="F.pos=(F.pos+p0()-1)%p0();F.back=false;drawCard()">Previous</button><button class="warn" onclick="mark(false)">Review again</button><button onclick="mark(true)">Got it</button><button class="alt" onclick="shuf()">Shuffle</button><button class="alt" onclick="home()">Home</button>';
 app.innerHTML=h}
function p0(){return pool().length}
function mark(k){var x=pool()[F.pos];if(k)F.known[x.i]=1;else delete F.known[x.i];store.set("known",F.known);F.back=false;if(!(F.onlyUnknown&&k))F.pos++;drawCard()}
function shuf(){for(var i=F.deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=F.deck[i];F.deck[i]=F.deck[j];F.deck[j]=t}F.pos=0;F.back=false;drawCard()}
home();
</script></body></html>
