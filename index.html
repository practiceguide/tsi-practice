<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSI Practice Tests and Flashcards</title>
<style>
:root{--p:#27428F;--a:#B3541F;--tp:#EAEFFA;--ta:#FBEEE6;--ink:#1d2433;--bg:#fff;--mut:#5b6478;--ok:#1d7a46;--bad:#b3261e;--bd:#cfd6e6}
@media (prefers-color-scheme:dark){:root{--bg:#12151f;--ink:#e8ebf3;--tp:#1b2442;--ta:#3a2418;--mut:#a3adc4;--bd:#2f3a5c;--p:#8fa8f0;--a:#f0955f;--ok:#58c88a;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
header{background:var(--p);color:#fff;padding:14px 16px}header h1{margin:0;font-size:1.05rem;letter-spacing:.04em}
@media (prefers-color-scheme:dark){header{background:#1b2442}}
main{max-width:820px;margin:0 auto;padding:16px}
h2{color:var(--p);margin:.2em 0 .5em}
.card{background:var(--tp);border-left:6px solid var(--p);padding:14px 16px;border-radius:6px;margin:12px 0}
.card.a{background:var(--ta);border-color:var(--a)}
button{font:inherit;cursor:pointer;border:2px solid var(--p);background:var(--p);color:#fff;border-radius:8px;padding:10px 16px;margin:4px 6px 4px 0}
button.alt{background:transparent;color:var(--p)}button.warn{background:var(--a);border-color:var(--a)}
@media (prefers-color-scheme:dark){button{color:#10131c}button.alt{color:var(--p)}}
button:disabled{opacity:.45;cursor:default}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--bd);margin:8px 0;padding:12px 14px;border-radius:8px}
button.opt.sel{border-color:var(--p);background:var(--tp);color:var(--ink)}.opt.good{border-color:var(--ok);background:rgba(29,122,70,.12)}.opt.wrong{border-color:var(--bad);background:rgba(179,38,30,.1)}
.stem{white-space:pre-line;margin:.6em 0}.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:10px 0}
.grid button{padding:6px 0;margin:0;font-size:.9rem;background:var(--bg);color:var(--ink);border-color:var(--bd)}
.grid .done{background:var(--tp);border-color:var(--p)}.grid .flag{border-color:var(--a);box-shadow:inset 0 -4px 0 var(--a)}.grid .cur{outline:3px solid var(--p)}
.fc{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.3rem;padding:24px;border:2px solid var(--p);border-radius:12px;background:var(--tp);cursor:pointer;margin:12px 0}
.fc.back{background:var(--ta);border-color:var(--a);font-size:1.1rem}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:8px;text-align:left}th{background:var(--p);color:#fff}
@media (prefers-color-scheme:dark){th{color:#10131c}}
small,.note{color:var(--mut);font-size:.88rem}.expl{margin-top:10px;padding:10px 14px;background:var(--ta);border-left:5px solid var(--a);border-radius:4px}
select{font:inherit;padding:8px;border-radius:6px;border:2px solid var(--bd);background:var(--bg);color:var(--ink)}
</style></head><body>
<header><h1>TSI ASSESSMENT STUDY GUIDE 2027 &middot; ONLINE PRACTICE</h1></header>
<main id="app"></main>
<script id="data" type="application/json">{"tests": [{"id": "test1", "title": "Practice Test 1", "items": [{"n": 1, "domain": "D1", "stem": "The laundry room in a campus residence hall has a detergent jug with 2.4 liters left. Each wash load uses 0.15 liters of detergent. How many full loads can the jug supply?", "options": ["0.06", "0.36", "2.55", "16"], "answer": 3, "explanation": "Divide the amount available by the amount per load: 2.4 divided by 0.15 equals 16, which is easy to see by scaling both numbers by 100 to get 240 divided by 15. The value 0.06 comes from dividing in the wrong direction, 0.15 by 2.4. The value 0.36 multiplies the two numbers, and 2.55 adds them, so neither answers how many loads fit."}, {"n": 2, "domain": "D1", "stem": "A student club orders a hooded sweatshirt that normally costs $60. The campus shop takes 15 percent off the price. What is the sale price of the sweatshirt, in dollars?", "options": ["9", "45", "51", "69"], "answer": 2, "explanation": "Fifteen percent of 60 is 0.15 times 60, which is 9 dollars of discount. Subtract it from the original price to get 51 dollars. The value 9 is only the discount, not the price paid. The value 45 subtracts 15 dollars instead of 15 percent. The value 69 adds the discount to the price, which would be a markup rather than a sale."}, {"n": 3, "domain": "D1", "stem": "Registration for a spring fun run fell from 80 runners last year to 60 runners this year. By what percent did registration decrease?", "options": ["25", "33", "75", "133"], "answer": 0, "explanation": "Percent change compares the change to the original amount. The drop is 20 runners, and 20 divided by the original 80 is 0.25, or 25 percent. The value 33 divides the drop by the new total of 60 instead of the original. The value 75 is the share of last year’s runners who came back, not the decrease. The value 133 is the old total as a percent of the new one."}, {"n": 4, "domain": "D2", "stem": "A shuttle bus on a community college loop travels 18 miles in 45 minutes at a steady pace. What is its speed in miles per hour?", "options": ["0.4", "24", "27", "810"], "answer": 1, "explanation": "Speed in miles per hour needs the time in hours. Forty-five minutes is 0.75 hour, and 18 divided by 0.75 is 24 miles per hour. The value 0.4 is 18 divided by 45, which is miles per minute and was never converted. The value 27 subtracts 18 from 45, mixing units. The value 810 multiplies miles by minutes, which has no meaning as a speed."}, {"n": 5, "domain": "D2", "stem": "A volunteer kitchen at a community center uses 1.5 cups of rice to serve 8 people. Using the same ratio, how many cups of rice are needed to serve 20 people?", "options": ["0.6", "3", "3.75", "13.5"], "answer": 2, "explanation": "Set up the proportion: 1.5 over 8 equals x over 20, so x equals 1.5 times 20 divided by 8, which is 3.75 cups. The value 0.6 flips the ratio and computes 1.5 times 8 divided by 20. The value 3 rounds the scale factor of 2.5 down to 2. The value 13.5 adds the 12 extra people to the cups, but amounts of rice scale by multiplication, not addition."}, {"n": 6, "domain": "D2", "stem": "A campus club buys 48 T-shirts priced at $7.95 each for a charity walk. Which is the best estimate of the total cost, in dollars?", "options": ["40", "56", "350", "400"], "answer": 3, "explanation": "Round both numbers to friendly values: 48 shirts is about 50 and $7.95 is about $8, so the total is about 50 times 8, which is 400 dollars. The value 350 cuts the price down to 7 dollars, a poor rounding for 7.95. The value 56 adds the quantity and the price instead of multiplying. The value 40 places the decimal point wrongly, giving a tenth of the real size."}, {"n": 7, "domain": "D3", "stem": "A community gym charges a $15 monthly fee plus $4 for each fitness class attended. The monthly cost is C = 15 + 4n, where n is the number of classes. What is the cost in dollars for a member who attends 9 classes?", "options": ["36", "51", "135", "171"], "answer": 1, "explanation": "Substitute 9 for n: C equals 15 plus 4 times 9, which is 15 plus 36, or 51 dollars. The value 36 leaves out the monthly fee. The value 135 multiplies the fee by the number of classes, which treats the 15 as a per-class charge. The value 171 adds 15 and 4 first and then multiplies by 9, breaking the order of operations."}, {"n": 8, "domain": "D3", "stem": "A tutor in the campus math lab works through the equation 2x + 5 = 21 with a student. What is the value of x?", "options": ["8", "13", "16", "26"], "answer": 0, "explanation": "Undo the addition first by subtracting 5 from both sides, which gives 2x equals 16. Then divide both sides by 2 to get x equals 8. The value 16 stops after the subtraction and never divides. The value 13 adds 5 instead of subtracting it and then divides by 2. The value 26 adds 5 and also forgets to divide by the coefficient."}, {"n": 9, "domain": "D3", "stem": "A neighborhood club has $150 to spend on an open house. The hall costs $30, and snacks cost $8 per guest. If p is the number of guests, which inequality shows the spending the club can afford?", "options": ["8p + 30 ≥ 150", "8p + 30 ≤ 150", "8p - 30 ≤ 150", "30p + 8 ≤ 150"], "answer": 1, "explanation": "Total spending is the per-guest cost times the guests plus the fixed hall fee, so 8p plus 30, and it must not exceed the 150 dollar budget, which calls for the less-than-or-equal symbol. One distractor reverses the symbol, which would require spending at least the budget. Another subtracts the hall fee, though it is an added cost. The last swaps the 30 and the 8, charging 30 dollars per guest."}, {"n": 10, "domain": "D3", "stem": "A pottery studio on campus charged $50 for 4 kiln firings and $110 for 10 firings. Assuming the cost grows at a constant rate, what is the slope of the cost line, in dollars per firing?", "options": ["0.1", "5", "6", "10"], "answer": 3, "explanation": "Slope is the change in cost divided by the change in firings: 110 minus 50 is 60, and 10 minus 4 is 6, so the slope is 60 divided by 6, which is 10 dollars per firing. The value 0.1 inverts the fraction. The value 6 is only the change in firings. The value 5 divides 50 by 10, which pairs a cost from one point with the firings from the other."}, {"n": 11, "domain": "D4", "stem": "The photography club charges a $12 joining fee plus $3 per session, and the cycling club charges a $4 joining fee plus $5 per session. After how many sessions are the total costs of the two clubs equal?", "options": ["4", "5", "8", "24"], "answer": 0, "explanation": "Set the totals equal: 12 plus 3n equals 4 plus 5n. Subtract 3n and 4 from both sides to get 8 equals 2n, so n equals 4 sessions. The value 8 is only the gap between the joining fees. The value 5 is the cycling club’s per-session price. The value 24 is the shared total cost at that point, not the number of sessions that produces it."}, {"n": 12, "domain": "D4", "stem": "A community garden bed is a rectangle with side lengths of (x + 3) feet and (x - 5) feet. Which expression gives the area of the bed in square feet?", "options": ["x² + 2x - 15", "x² - 2x - 15", "x² - 2x + 15", "x² - 15"], "answer": 1, "explanation": "Multiply each term of the first factor by each term of the second: x times x is x², x times negative 5 is negative 5x, 3 times x is 3x, and 3 times negative 5 is negative 15. Combining the middle terms gives negative 2x. One distractor flips the sign of the middle term, another flips the constant, and the last multiplies only the first and last terms, dropping the middle ones."}, {"n": 13, "domain": "D4", "stem": "Students in a rocketry club model a launch with the height formula h = -5t² + 20t, where h is in meters and t is time in seconds. What is the height at t = 3 seconds?", "options": ["15", "60", "105", "225"], "answer": 0, "explanation": "Substitute 3 for t and square before multiplying: negative 5 times 9 is negative 45, and 20 times 3 is 60, so the height is 15 meters. The value 60 drops the squared term entirely. The value 105 treats the squared term as positive 45. The value 225 squares the product of negative 5 and 3 instead of squaring only t."}, {"n": 14, "domain": "D5", "stem": "A triangular pennant hung in a student union has a base of 12 feet and a height of 7.5 feet. What is its area in square feet?", "options": ["9.75", "19.5", "45", "90"], "answer": 2, "explanation": "The area of a triangle is one half times base times height, so one half of 12 times 7.5 is half of 90, which is 45 square feet. The value 90 is the product of base and height with the one half left out. The value 19.5 adds the two lengths, and 9.75 takes half of that sum. Area comes from multiplying dimensions, never from adding them."}, {"n": 15, "domain": "D5", "stem": "A circular reading garden at a community library has a diameter of 10 meters. Using 3.14 for pi, what is its area in square meters?", "options": ["15.7", "25", "31.4", "78.5"], "answer": 3, "explanation": "Area uses the radius, which is half the diameter, or 5 meters. Then 3.14 times 5 squared is 3.14 times 25, which is 78.5 square meters. The value 31.4 is the circumference, found with pi times the diameter. The value 25 squares the radius but leaves out pi. The value 15.7 is pi times the radius, which uses the radius once instead of squaring it."}, {"n": 16, "domain": "D5", "stem": "A rectangular planter at a school garden measures 6 feet long, 2.5 feet wide and 1.5 feet deep. How many cubic feet of soil are needed to fill it?", "options": ["10", "15", "22.5", "55.5"], "answer": 2, "explanation": "Volume of a rectangular box is length times width times depth: 6 times 2.5 is 15, and 15 times 1.5 is 22.5 cubic feet. The value 15 stops after finding the floor area of the planter. The value 10 adds the three dimensions together. The value 55.5 is the total outside surface area, which measures covering, not filling."}, {"n": 17, "domain": "D6", "stem": "Five volunteers at a food pantry logged 6, 9, 4, 11 and 10 hours last month. What is the mean number of hours they logged?", "options": ["8", "9", "11", "40"], "answer": 0, "explanation": "The mean is the sum divided by the number of values. The hours add up to 40, and 40 divided by 5 is 8. The value 40 is the sum and was never divided. The value 9 is the median, the middle value after ordering 4, 6, 9, 10, 11. The value 11 is the largest number of hours, which is the maximum and not an average of anything."}, {"n": 18, "domain": "D6", "stem": "A club’s supply bag holds 5 blue pens, 3 green pens and 2 yellow pens. One pen is drawn at random. What is the probability that it is green or yellow?", "options": ["0.06", "0.3", "0.5", "0.8"], "answer": 2, "explanation": "Green and yellow pens together make 5 of the 10 pens, so the probability is 5 over 10, or 0.5. The value 0.3 counts only the green pens. The value 0.8 is the probability that the pen is not yellow. The value 0.06 multiplies the two separate probabilities, which would apply only to drawing both colors in a row, not to either color in one draw."}, {"n": 19, "domain": "D6", "stem": "On a typical morning, the campus bus runs on time with probability 0.6 and the library opens early with probability 0.5, and the two events do not affect each other. What is the probability that both happen on the same morning?", "options": ["0.3", "0.55", "0.6", "0.8"], "answer": 0, "explanation": "For independent events, multiply the probabilities: 0.6 times 0.5 is 0.3. The value 0.55 averages the two probabilities, which has no basis here. The value 0.6 takes the likelier event alone and ignores the second requirement. The value 0.8 comes from adding the probabilities and subtracting the product, which finds the chance of at least one event rather than both."}, {"n": 20, "domain": "D6", "stem": "Ride times, in minutes, for six students to reach campus were 20, 22, 25, 27, 28 and 81. Which statement best describes how the unusually long time of 81 affects the summary measures?", "options": ["It pulls the median far above the mean, so the mean describes a typical ride better.", "It leaves both measures unchanged, since only the most frequent time affects the mean.", "It becomes the mode of the data, which makes the mode the best measure of a typical ride.", "It pulls the mean far above the median, so the median describes a typical ride better."], "answer": 3, "explanation": "The mean is 203 divided by 6, about 34, while the median is the average of 25 and 27, which is 26. The extreme value drags the mean upward but barely moves the median, so the median is the better picture of a normal ride. The reverse claim has the direction of the effect wrong. No value repeats, so there is no mode, and every value counts toward the mean."}, {"n": 21, "domain": "D7", "stem": "The bus was already pulling away when Imani reached the corner, her backpack thumping against her spine. She watched the red taillights shrink and felt the old familiar sting. Then she noticed Mr. Okafor, the crossing guard, step into the road two blocks down and raise a hand to the driver. The brakes squealed. Imani did not stop to say thank you; she only ran. But when she climbed aboard, she turned and gave him a wave so wide it nearly knocked a passenger’s hat sideways.\n\nWhich inference about Imani is best supported by the passage?", "options": ["She is angry that the bus driver ignored her while she was running.", "She is grateful for Mr. Okafor’s help even though she does not say so aloud.", "She is embarrassed by the scene and hopes that no one noticed her.", "She misses the bus often because she never plans her mornings well."], "answer": 1, "explanation": "The wide wave she gives Mr. Okafor shows thanks expressed through action, since she had no time to speak. Nothing in the passage says the driver ignored her; the guard’s raised hand actually made him stop. A wave that big is not the act of someone hiding. The phrase ‘old familiar sting’ hints at past missed buses, but the passage never blames poor planning."}, {"n": 22, "domain": "D7", "stem": "March 3. The community orchestra’s first rehearsal was a storm of tuning violins and scraping chairs. Then Ms. Delgado raised her baton, and the noise folded itself into a single warm sound, like a crowd of strangers discovering they knew the same song. I had expected to feel small in that room. Instead I felt like one thread in a rope, and I wanted to hold on.\n\nIn the diary entry, the comparison of the writer to ‘one thread in a rope’ mainly conveys which idea?", "options": ["The writer feels weak and worries about being easily broken by the group.", "The writer feels trapped in the orchestra and wants to find a way out.", "The writer feels like a valued part of a group that is stronger together.", "The writer thinks the rehearsal was too loud and disorganized to enjoy."], "answer": 2, "explanation": "A single thread is thin, but a rope is strong because many threads are joined, so the image shows belonging and shared strength. The closing words ‘I wanted to hold on’ show a wish to stay, which rules out feeling trapped. The writer says the opposite of feeling small after the music came together. The noisy opening is described only as the starting point, before the sound became warm."}, {"n": 23, "domain": "D7", "stem": "Mateo stood at the edge of the community pool deck, toes curled over the tile. The water below was perfectly still, and he was perfectly sure it was a mistake to be here. Kids cannonballed past him, shrieking, but he stared at the surface the way you study a test you did not prepare for. His coach crouched beside him and said nothing at all. After a long minute, Mateo exhaled, bent his knees, and let go of the edge.\n\nWhich choice best describes the mood of the passage before Mateo lets go of the edge?", "options": ["Carefree and playful", "Bored and restless", "Calm and relaxed", "Tense and uncertain"], "answer": 3, "explanation": "Details such as toes curled over the tile, being sure it was a mistake, and comparing the water to an unprepared test all build nervous tension. The playful shrieking belongs to the other kids, not to Mateo. Nothing suggests boredom, since he is intensely focused. The still water might seem calm, but his reaction to it is dread, so the mood is not relaxed."}, {"n": 24, "domain": "D7", "stem": "Last Bus Home\n\nThe driver hums a half-remembered tune,\nthe windows hold our faces like old coins,\nand every stop we pass is a dim room\nwhere someone else’s evening just begins.\nWe carry our tired days like folded maps,\nand no one asks us where we have been tonight.\n\nWhat does the image of ‘folded maps’ mainly suggest about the riders?", "options": ["They are lost and need help finding the route to their stops.", "They hold quiet, private stories from the day that no one asks them to share.", "They plan to travel to distant places once they leave the bus.", "They are tourists who are new to the city and its bus system."], "answer": 1, "explanation": "Maps folded away keep their routes hidden, and the next line adds that ‘no one asks us where we have been tonight.’ Together they suggest private, unspoken experiences. The riders are described as tired after a day, not lost. The poem never mentions distant travel or tourists; it focuses on ordinary evening commuters sharing a quiet ride."}, {"n": 25, "domain": "D8", "stem": "Community notice: The Eastside Tool Library lets residents borrow ladders, drills and garden tools for a week at no charge, the same way a book library lends novels. Members need only a free card and a photo ID. Organizers say the project began when several neighbors realized they each owned a rarely used power saw. Sharing tools, they explain, saves money, frees up garage space and brings neighbors together. Volunteers staff the library on Saturday mornings.\n\nWhat is the main idea of the notice?", "options": ["The library began because several neighbors owned power saws they rarely used.", "Residents who want to borrow a tool must hold a free card and a photo ID.", "The Eastside Tool Library lends tools to residents, saving money and building community.", "Sharing belongings is a better way to live than owning anything in any setting."], "answer": 2, "explanation": "The main idea covers the whole notice: a tool library that lends tools and brings benefits. The origin story with the power saws and the card and ID requirement are single supporting details, so they are too narrow. The last choice is too broad, since the notice discusses sharing tools in one neighborhood and never says sharing is better in every setting."}, {"n": 26, "domain": "D8", "stem": "Lab summary: Students placed identical bean seedlings in three rooms: one with a south-facing window, one with a north-facing window, and one with no window but a lamp on a timer. After two weeks, the seedlings in the south room were the tallest, averaging 18 centimeters. The north-room seedlings averaged 11 centimeters and leaned toward the glass. The lamp seedlings averaged 14 centimeters and grew straight. The students concluded that both the amount and the direction of light shape how a seedling grows.\n\nWhich detail best supports the students’ conclusion that the direction of light affects growth?", "options": ["The north-room seedlings leaned toward the glass.", "The students placed identical seedlings in all three rooms.", "The south-room seedlings averaged 18 centimeters in height.", "The seedlings were observed for a period of two weeks."], "answer": 0, "explanation": "Leaning toward the glass shows the plants bending toward the side where light came from, which is direct evidence about direction. The identical seedlings and the two-week length describe the method, not the result. The 18 centimeter average supports the amount of light, since the south room was brightest, not the direction it came from."}, {"n": 27, "domain": "D8", "stem": "Good evening, neighbors. Three years ago this lot held broken glass and weeds. Tonight it holds forty garden beds, a clay oven built from donated bricks, and a hundred of you. I did not plant a single bean alone. Every row here exists because someone gave an hour on a cold Saturday. The beds will not weed themselves this summer, and our newest volunteers cannot be the only ones who show up. So I am asking every one of you to sign the sheet by the gate before you go home.\n\nWhat is the speaker’s main purpose in this speech?", "options": ["To explain how the clay oven was built from donated bricks", "To describe the history of the lot over the last three years", "To announce a new rule about who may use the garden beds", "To encourage neighbors to keep volunteering at the garden"], "answer": 3, "explanation": "The speech ends with a direct request, ‘I am asking every one of you to sign the sheet,’ and earlier lines praise volunteer hours, which shows the aim is to persuade people to keep helping. The history and the oven are supporting details used to build pride. No rule is announced anywhere in the speech, so the last choice is unsupported."}, {"n": 28, "domain": "D8", "stem": "When the campus moved its bike repair stand next to the dining hall, use climbed sharply. Before the move, riders had to walk across the quad to reach it, and many put off small repairs for weeks. Because the new spot sits where students already pass twice a day, flat tires are now fixed in minutes. As a result, the volunteers who run the stand report far fewer neglected bikes left leaning against the racks.\n\nWhich text structure does the passage mainly use?", "options": ["Chronological order, listing the steps in repairing a bicycle", "Cause and effect, showing how the new location led to results", "Compare and contrast, weighing two bike stands side by side", "Description, painting a detailed picture of the dining hall"], "answer": 1, "explanation": "Signal phrases such as ‘Because the new spot’ and ‘As a result’ show that the passage explains how one change caused several outcomes. It mentions a before and an after, but it never lists repair steps in order. It looks at one stand in two settings, not two stands. The dining hall is only a location marker and is not described in detail."}, {"n": 29, "domain": "D8", "stem": "Parking notice: Lot C will close for resurfacing from June 3 to June 14. During the closure, permit holders may park in Lot F, which is a seven-minute walk from the science building. A free shuttle will run every ten minutes from Lot F between 7 a.m. and 6 p.m. Evening classes that end after 6 p.m. will be served by campus security escorts, available on request.\n\nWhich conclusion is best supported by the notice?", "options": ["Lot F will also close for resurfacing during the first two weeks of June.", "Permit holders will be charged an extra fee to park in Lot F.", "Students leaving a class after 6 p.m. will have no shuttle but may request an escort.", "The shuttle will keep running through the night while Lot C is closed."], "answer": 2, "explanation": "The shuttle runs only until 6 p.m., and the notice says later classes get escorts on request, so the first choice follows directly. Lot F is named as the alternative, so it is not closing. No fee is mentioned, and the shuttle is described as free. A shuttle that ends at 6 p.m. cannot run through the night."}, {"n": 30, "domain": "D8", "stem": "Fundraising for the neighborhood mural fell short, so the committee’s budget this spring was meager. Instead of hiring painters, volunteers scraped the wall themselves, borrowed ladders from neighbors, and bought paint in small batches as donations arrived. Despite the thin funding, the finished mural, a river of orange and teal running past a row of paper-white houses, drew crowds on opening night. Residents said that working side by side made the wall feel like theirs.\n\nAs used in the passage, which word is closest in meaning to ‘meager’?", "options": ["Generous", "Hidden", "Complicated", "Limited"], "answer": 3, "explanation": "Context clues show the money was short: fundraising ‘fell short,’ paint was bought ‘in small batches,’ and the funding was ‘thin.’ Limited fits all of these. Generous is the opposite of what the passage describes. Hidden has no link to the amount of money. Complicated might describe a budget in general, but nothing in the passage describes a confusing budget."}, {"n": 31, "domain": "D8", "stem": "Letter to the editor: The city council plans to remove the crosswalk on Fifth Street because it says few people use it. But the count the council relies on was taken only at noon, which misses the students who cross at 8 a.m. and the nurses who cross at shift change. A fair decision needs counts across the whole day. Until the council gathers them, removing the crosswalk is premature.\n\nWhich statement best describes the weakness the writer sees in the council’s reasoning?", "options": ["The council based its decision on a count taken at only one time of day.", "The council did not ask any students for their opinions about the crosswalk.", "The council plans to remove every crosswalk in the city, not just one.", "The council built the crosswalk too recently to judge how it is used."], "answer": 0, "explanation": "The writer points to a count ‘taken only at noon’ and lists groups who cross at other times, so the flaw is a narrow sample. The letter never mentions surveying students’ opinions. It speaks of one crosswalk, not all of them. The age of the crosswalk is never discussed, so the last choice has no support in the text."}, {"n": 32, "domain": "D8", "stem": "A community fridge is a refrigerator placed on a public sidewalk or in a shop entrance, where neighbors leave extra food and others take what they need, with no questions asked. Volunteers check it each morning, throwing out anything past its date and wiping the shelves. Local grocers and home cooks supply most of the food. Because anyone may use it, the fridge avoids s no longer squeeze past with inches to spare, and the racks at the library are noticeably fuller. If every project were finished this cleanly, residents would complain far less about construction.\n\nWhich word best describes the author’s attitude toward the bike lane project?", "options": ["Approving", "Doubtful", "Indifferent", "Resentful"], "answer": 0, "explanation": "The author praises the speed of the project and lists improvements such as safer passing and fuller bike racks, ending with a wish that other projects were done so cleanly. These choices of detail show approval. Doubtful and resentful would require negative or uncertain wording, which never appears. Indifferent does not fit, since the author clearly cares about the result."}, {"n": 35, "domain": "D8", "stem": "Text 1: Many residents say the farmers market should move from Wednesday to Saturday, when more people are off work and can stroll the stalls with their families.\n\nText 2: Vendors respond that Saturday already hosts three other street fairs, so shoppers would have less attention and less money to give any single event, and sales could actually fall.\n\nHow do the two texts differ in their approach to the question of when the market should be held?", "options": ["Text 1 focuses on vendor profits, while Text 2 focuses on how far shoppers must travel.", "Text 1 opposes holding any market, while Text 2 supports holding it every day.", "Text 1 describes the history of the market, while Text 2 describes its current rules.", "Text 1 focuses on shoppers’ free time, while Text 2 focuses on competition from other events."], "answer": 3, "explanation": "Text 1 argues for Saturday because more people are ‘off work,’ which is about shoppers’ availability. Text 2 argues against it because Saturday ‘already hosts three other street fairs,’ which is about competition. Neither text discusses travel distance, so the first distractor is unsupported. Neither opposes the market itself or offers a history, so the other two distractors misread both passages."}, {"n": 36, "domain": "D9", "stem": "A newsletter editor is checking this sentence: ‘The community center opened a new art room, the children filled it within a week.’ Which revision corrects the error in the sentence?", "options": ["The community center opened a new art room the children filled it within a week.", "The community center opened a new art room, and the children filled it within a week.", "The community center opened a new art room, which the children filled it within a week.", "The community center opened a new art room; and the children filled it within a week."], "answer": 1, "explanation": "The original joins two complete sentences with only a comma, which is a comma splice. Adding the coordinating conjunction ‘and’ after the comma repairs it. Removing the comma leaves a run-on with no boundary at all. The ‘which’ version adds a pronoun that repeats the object, ‘it,’ creating a new error. A semicolon already separates sentences, so adding ‘and’ after it is incorrect."}, {"n": 37, "domain": "D9", "stem": "A volunteer coordinator writes this sentence on a poster: ‘The list of volunteers for the cleanup crews are posted outside the gym.’ Which choice corrects the error in subject-verb agreement?", "options": ["The list of volunteers for the cleanup crews were posted outside the gym.", "The list of volunteers for the cleanup crews are being posted outside the gym.", "The list of volunteers for the cleanup crews is posted outside the gym.", "The lists of volunteers for the cleanup crews is posted outside the gym."], "answer": 2, "explanation": "The subject is the singular noun ‘list,’ and the phrases ‘of volunteers’ and ‘for the cleanup crews’ do not change that, so the verb must be singular: ‘is.’ The choices with ‘were’ and ‘are being’ keep a plural verb with a singular subject. The last choice changes the subject to a plural noun but keeps the singular verb, creating a new mismatch."}, {"n": 38, "domain": "D9", "stem": "Several dancers placed their shoes beside a bag that belongs to one instructor. Which sentence uses apostrophes correctly to show ownership in that situation?", "options": ["The dancer’s shoes were lined up beside the instructors’ bag.", "The dancers shoes were lined up beside the instructors bag.", "The dancers’s shoes were lined up beside the instructor’s bags.", "The dancers’ shoes were lined up beside the instructor’s bag."], "answer": 3, "explanation": "Several dancers is a plural noun ending in s, so the possessive adds only an apostrophe after the s: dancers’. One instructor is singular, so the possessive adds apostrophe and s: instructor’s. The first distractor reverses the two. The second drops both apostrophes. The third adds an extra s after the apostrophe to a plural and changes the bag to a plural noun."}, {"n": 39, "domain": "D9", "stem": "A volunteer newsletter is describing the woman who runs the neighborhood food drive and thanking her crew. Which sentence is punctuated correctly?", "options": ["Ms. Alvarez, who coordinates the food drive, thanked every volunteer.", "Ms. Alvarez who coordinates the food drive, thanked every volunteer.", "Ms. Alvarez, who coordinates the food drive thanked every volunteer.", "Ms. Alvarez who coordinates the food drive thanked every volunteer."], "answer": 0, "explanation": "The clause ‘who coordinates the food drive’ adds extra information about a person already named, so it is set off with a pair of commas, one before and one after. The first distractor has only the closing comma, and the second has only the opening comma, so each leaves the clause half set off. The last has no commas, which treats extra information as if it were essential."}, {"n": 40, "domain": "D9", "stem": "A tutor reads this sentence in a student’s draft: ‘The tutors told the students they would need to reserve a room early.’ The tutor wants to remove the unclear pronoun. Which revision does that best?", "options": ["The tutors told the students that they should reserve a room early.", "The tutors said that the students should reserve a room early.", "The tutors told them that they would need to reserve a room early.", "The tutors reserved a room early after telling them what they needed."], "answer": 1, "explanation": "In the original, ‘they’ could mean the tutors or the students, so the reader cannot be sure who must reserve the room. The best revision names the students and removes the pronoun. The first distractor keeps ‘they,’ so the confusion remains. The second adds two pronouns with no clear antecedent. The last changes the meaning, since it says the tutors reserved the room."}, {"n": 41, "domain": "D9", "stem": "The club president wants the goals in this sentence written in parallel form: ‘The club’s goals are to recruit new members, raising funds, and organizing a spring festival.’ Which revision is parallel?", "options": ["The club’s goals are to recruit new members, raising funds, and to organize a spring festival.", "The club’s goals are recruiting new members, to raise funds, and organizing a spring festival.", "The club’s goals are to recruit new members, to raise funds, and to organize a spring festival.", "The club’s goals are to recruit new members, to raise funds, and organizing a spring festival."], "answer": 2, "explanation": "Items in a list should share the same grammatical form. The correct choice uses three infinitives, to recruit, to raise and to organize. Each distractor mixes infinitives with the -ing forms, so one or two items break the pattern: the first and last mix infinitives with a single -ing form, and the second mixes an infinitive between two -ing forms."}, {"n": 42, "domain": "D9", "stem": "A student writes: ‘Last Saturday, volunteers swept the courtyard, painted the benches, and then they serve lunch to everyone who stopped by.’ Which revision corrects the inconsistent verb tense?", "options": ["Last Saturday, volunteers swept the courtyard, painted the benches, and then they serving lunch to everyone who stopped by.", "Last Saturday, volunteers sweep the courtyard, paint the benches, and then served lunch to everyone who stopped by.", "Last Saturday, volunteers swept the courtyard, painted the benches, and then will serve lunch to everyone who stopped by.", "Last Saturday, volunteers swept the courtyard, painted the benches, and then served lunch to everyone who stopped by."], "answer": 3, "explanation": "The words ‘Last Saturday’ place every action in the past, so all verbs must be past tense: swept, painted and served. The original switches to the present ‘serve.’ The first distractor swaps in an incomplete verb form, ‘serving.’ The second changes the first two verbs to present tense. The last uses a future form, ‘will serve,’ which clashes with the past setting."}, {"n": 43, "domain": "D9", "stem": "A campus newsletter includes the sentence below, which has a blank. ‘The road closure had a strong ______ on shuttle times.’ Which word belongs in the blank?", "options": ["affect", "effect", "affected", "affecting"], "answer": 1, "explanation": "The blank follows the article ‘a’ and the adjective ‘strong,’ so a noun is needed. The noun meaning a result or outcome is ‘effect.’ The word ‘affect’ is usually a verb meaning to influence, so it cannot fill a noun slot here. The forms ‘affected’ and ‘affecting’ are verb forms and also cannot follow ‘a strong’ as the name of a result."}, {"n": 44, "domain": "D9", "stem": "A student writes this sentence in a narrative about a rainy afternoon: ‘Walking across the quad, the rain soaked Jon’s notes.’ Which revision corrects the dangling modifier?", "options": ["Walking across the quad, Jon felt the rain soak his notes.", "Walking across the quad, the rain began to soak Jon’s notes.", "Jon’s notes, walking across the quad, were soaked by the rain.", "While the rain soaked Jon’s notes, walking across the quad."], "answer": 0, "explanation": "The opening phrase ‘Walking across the quad’ needs to be followed by the person who was walking, but the original names the rain. The correct revision puts Jon right after the comma. The first distractor still names the rain as the walker. The second says the notes were walking. The last turns the sentence into a fragment and leaves the walker unnamed."}, {"n": 45, "domain": "D9", "stem": "The pantry sign reads: ‘The pantry needs three items canned beans, rice, and cooking oil.’ Which revision adds the correct punctuation?", "options": ["The pantry needs three items; canned beans, rice, and cooking oil.", "The pantry needs three items, canned beans, rice, and cooking oil.", "The pantry needs three items: canned beans, rice, and cooking oil.", "The pantry needs three items. Canned beans, rice, and cooking oil."], "answer": 2, "explanation": "A colon can follow a complete statement to introduce a list that names the items. A semicolon joins two independent clauses, but the list is not a complete sentence. A comma there makes the list read as part of a long series and blurs the connection. A period leaves the list as a fragment, which cannot stand alone as a sentence."}, {"n": 46, "domain": "D9", "stem": "A writer drafts this sentence for a flyer: ‘Due to the fact that the rain was falling heavily, the festival was moved to an indoor location.’ Which revision is the most concise while keeping the meaning?", "options": ["Because heavy rain fell, the festival was moved indoors.", "Due to the fact that heavy rain was falling down, the festival was moved indoors.", "Because of the fact that it rained heavily, the festival was moved to an indoor place.", "Since the rain was falling in a heavy way, the festival got moved to indoors."], "answer": 0, "explanation": "Wordy phrases such as ‘due to the fact that’ can be replaced by one word like ‘because,’ and ‘an indoor location’ becomes the single word ‘indoors.’ The correct choice keeps the cause and the effect in fewer words. The distractors keep wordy phrases (‘of the fact that,’ ‘falling down,’ ‘in a heavy way’) or add awkward wording such as ‘got moved to indoors.’"}, {"n": 47, "domain": "D10", "stem": "A student is drafting the introduction to an essay about library hours.\n\n(1) At Riverbend College, the library closes at 9 p.m. on weekdays. (2) Many students work evening jobs and cannot arrive until after that time. (3) [blank]\n\nThe writer wants sentence 3 to state the essay’s position clearly. Which choice best accomplishes this goal?", "options": ["Libraries have been important places for learning and reading for hundreds of years.", "Some students enjoy studying in dining halls, while others prefer the dorm lounges.", "The library has a large collection of books and several rooms for group study.", "Extending weekday library hours until midnight would give every student a fair chance to use the quiet study space."], "answer": 3, "explanation": "A thesis statement takes a position that the rest of the essay can support. The correct choice proposes a specific action and a reason, building on the facts in sentences 1 and 2. The statement about libraries through history is too general and takes no position. The sentence about dining halls and lounges offers no stance. The sentence about the collection is a descriptive detail unrelated to the problem."}, {"n": 48, "domain": "D10", "stem": "A student is revising a paragraph about a neighborhood garden.\n\n(1) The Maple Street garden gives neighbors fresh vegetables all summer. (2) Members split the weekly harvest according to the hours they have worked. (3) Last year, one member’s tomato plants grew taller than the fence. (4) My cousin collects model trains and displays them in his garage. (5) Because of this system, even new members feel that their effort is rewarded.\n\nWhich sentence should be deleted to improve the focus of the paragraph?", "options": ["Sentence 2, because it explains the harvest system in unnecessary detail", "Sentence 4, because it introduces a hobby unrelated to the garden", "Sentence 3, because it describes a single plant that the paragraph never uses", "Sentence 5, because it repeats information that sentence 1 already gave"], "answer": 1, "explanation": "The paragraph is about how the garden shares its harvest, and sentence 4 moves to a cousin’s model trains, which has nothing to do with it. Sentence 2 is essential because sentence 5 refers back to ‘this system.’ Sentence 3 is a small garden detail that still fits the topic. Sentence 5 states a result of the system and does not repeat sentence 1."}, {"n": 49, "domain": "D10", "stem": "A student is revising a paragraph about recycling on campus.\n\n(1) Campus recycling bins are often contaminated with food waste. (2) [blank], workers must sort the materials by hand before anything is sent out. (3) This slows the whole process and raises the cost of the program. (4) Clear labels and a short reminder near each bin could help reduce the problem.\n\nWhich transition best completes sentence 2?", "options": ["For example", "However", "As a result", "Meanwhile"], "answer": 2, "explanation": "Sentence 2 describes a consequence of the contamination named in sentence 1, so a cause-and-effect transition fits: ‘As a result.’ ‘For example’ would introduce a specific case, but sentence 2 is not an example of food waste. ‘However’ signals a contrast that does not exist here. ‘Meanwhile’ suggests two events at the same time, which is not the relationship between these sentences."}, {"n": 50, "domain": "D10", "stem": "A student is finishing an essay on student volunteering.\n\n(1) Students who volunteer at the food pantry learn to schedule, communicate and solve problems under pressure. (2) Those same hours stock shelves and feed local families. (3) [blank]\n\nThe writer wants a concluding sentence that ties these two points together. Which choice best does this?", "options": ["By giving a few hours each month, students gain job skills while strengthening the neighborhoods around the campus.", "Many students are also interested in joining sports teams and music groups.", "Some residents were unable to attend the volunteer fair held in the fall.", "Volunteering is something that many people do, and it is done in many places."], "answer": 0, "explanation": "A strong conclusion brings together the two points already made: skills students gain and help given to families. The correct choice names both. The sentence about sports and music introduces unrelated activities. The fair attendance remark adds a new detail that has no link to the argument. The final distractor is vague and general, and it adds no idea that connects the paragraph."}]}, {"id": "test2", "title": "Practice Test 2", "items": [{"n": 1, "domain": "D1", "stem": "A welder cut a steel rod to a length of 7/8 of a foot. What is that length written as a decimal number of feet?", "options": ["0.125", "0.78", "0.875", "1.14"], "answer": 2, "explanation": "Divide 7 by 8 to get 0.875. The value 0.78 comes from writing the numerator and denominator side by side after a decimal point, which has no connection to division. The value 1.14 comes from dividing 8 by 7, the reciprocal, which is longer than a whole foot even though 7/8 is less than one. The value 0.125 is the missing piece, 1/8, left over after the cut."}, {"n": 2, "domain": "D1", "stem": "A cabinet shop sets the price of a job at 40 percent more than its material cost of 250 dollars. What is the price of the job in dollars?", "options": ["100", "150", "290", "350"], "answer": 3, "explanation": "A 40 percent markup on 250 is 0.40 x 250 = 100 dollars, and the price is the cost plus the markup, so 250 + 100 = 350. The value 100 is only the markup and leaves out the original cost. The value 150 subtracts the markup, which gives a discount instead of an increase. The value 290 adds 40 dollars rather than 40 percent, treating the percent as a flat dollar amount."}, {"n": 3, "domain": "D1", "stem": "A painter mixes base and tint in the ratio 3 parts base to 2 parts tint by volume and needs 20 liters of mixed paint in all. How many liters of tint are needed?", "options": ["8", "10", "12", "18"], "answer": 0, "explanation": "The ratio has 3 + 2 = 5 parts, so each part is 20 / 5 = 4 liters, and tint takes 2 parts, which is 8 liters. The value 12 is the amount of base, the other part of the mix. The value 10 divides the total by the 2 parts of tint alone, ignoring the base. The value 18 subtracts the 2 parts from the total as though parts were liters."}, {"n": 4, "domain": "D2", "stem": "A painting crew coats 45 square feet of wall in 3 hours. Working at the same steady rate, how many square feet can the crew coat in 8 hours?", "options": ["24", "50", "120", "135"], "answer": 2, "explanation": "The rate is 45 / 3 = 15 square feet per hour, and 15 x 8 = 120. The value 135 multiplies 45 by the 3 hours instead of using the rate. The value 24 multiplies the two hour counts, 3 x 8, and ignores the area. The value 50 treats the problem as additive, adding the 5 extra hours to 45, though a steady rate means the area grows in proportion to time."}, {"n": 5, "domain": "D2", "stem": "A cable reel holds 270 feet of wire, and each installation run needs 18 yards. How many complete runs can be cut from the reel?", "options": ["1", "5", "15", "45"], "answer": 1, "explanation": "Convert first: 18 yards is 18 x 3 = 54 feet, and 270 / 54 = 5 runs. The value 15 divides 270 by 18 without converting, mixing feet and yards. The value 45 converts in the wrong direction, treating 18 yards as 6 feet. The value 1 treats a yard as 12 feet, so each run looks like 216 feet and only one run fits."}, {"n": 6, "domain": "D2", "stem": "A sandwich shop pays 18 dollars for 12 loaves of bread. At the same price per loaf, how many dollars would 30 loaves cost?", "options": ["45", "54", "216", "540"], "answer": 0, "explanation": "Each loaf costs 18 / 12 = 1.50 dollars, so 30 loaves cost 30 x 1.50 = 45 dollars. The value 54 rounds the 2.5 groups of 12 up to 3 groups and multiplies 18 x 3, which overstates the cost because only half of the third group is needed. The values 216 and 540 multiply 18 by 12 and by 30, which multiplies the total price rather than the price of one loaf."}, {"n": 7, "domain": "D3", "stem": "A plumber charges a visit fee of 45 dollars plus 30 dollars for each hour of work. A customer’s bill was 165 dollars. Which equation can be solved to find h, the number of hours worked?", "options": ["30 + 45h = 165", "45 + 30h = 165", "75h = 165", "45h = 165 + 30"], "answer": 1, "explanation": "The visit fee is paid once and the rate is paid for each hour, so the bill is 45 + 30h. Setting it equal to 165 gives 30h = 120 and h = 4. The equation with the numbers swapped charges 45 dollars per hour and 30 dollars once, which reverses the situation. Writing 75h treats the visit fee as an hourly charge. The last equation attaches the hourly rate to the wrong number."}, {"n": 8, "domain": "D3", "stem": "A delivery driver earns 12 dollars for each delivery and pays a 20 dollar vehicle fee each day. What is the least whole number of deliveries the driver must make in one day to keep at least 100 dollars after the fee?", "options": ["7", "9", "10", "11"], "answer": 2, "explanation": "Keeping at least 100 dollars means 12d - 20 >= 100, so 12d >= 120 and d >= 10. Ten deliveries give exactly 100 dollars after the fee. The value 9 divides 100 by 12 and rounds up, forgetting the fee. The value 7 subtracts the fee instead of adding it back, which solves 12d >= 80. The value 11 treats at least as strictly more than, though exactly 100 dollars still qualifies."}, {"n": 9, "domain": "D3", "stem": "A shop’s monthly electric bill is a linear function of the number of machines running. With 4 machines the bill is 210 dollars, and with 10 machines it is 330 dollars. What would the bill be, in dollars, with 15 machines running?", "options": ["300", "350", "410", "430"], "answer": 3, "explanation": "The slope is (330 - 210) / (10 - 4) = 20 dollars per machine. Going from 10 to 15 machines adds 5 x 20 = 100, so the bill is 430. The value 300 multiplies 15 by the slope and leaves out the fixed charge. The value 350 adds the cost of only one more machine. The value 410 adds 4 machines instead of 5, a counting slip when moving from 10 to 15."}, {"n": 10, "domain": "D3", "stem": "A carpenter cuts a 96 inch board into 5 equal shelves and a 6 inch scrap, using the whole board. What is the length of each shelf in inches?", "options": ["18", "19.2", "20.4", "90"], "answer": 0, "explanation": "Write 5x + 6 = 96, so 5x = 90 and x = 18 inches. The value 19.2 divides the whole board by 5 and forgets the scrap. The value 20.4 adds the scrap to 96 before dividing, which reverses the subtraction. The value 90 correctly removes the scrap but stops before dividing by the 5 shelves, so it is the total shelf length rather than the length of one shelf."}, {"n": 11, "domain": "D4", "stem": "A lunch stand sold wraps for 6 dollars each and soups for 4 dollars each. In one day it sold 50 items for a total of 252 dollars. How many wraps did it sell?", "options": ["24", "26", "42", "50"], "answer": 1, "explanation": "Let w be wraps and s soups, so w + s = 50 and 6w + 4s = 252. Replacing s with 50 - w gives 2w + 200 = 252, so w = 26, and soups are 24. The value 24 is the soup count, the wrong variable. The value 42 divides all the money by the wrap price, assuming only wraps were sold. The value 50 is the total number of items, not just the wraps."}, {"n": 12, "domain": "D4", "stem": "The floor of a rectangular storage yard is 4 meters longer than it is wide, and its area is 96 square meters. How long is the yard in meters?", "options": ["4", "8", "10", "12"], "answer": 3, "explanation": "Let the width be x, so x(x + 4) = 96, which becomes x^2 + 4x - 96 = 0, or (x + 12)(x - 8) = 0. The width is 8 and the length is 8 + 4 = 12. The value 8 is the width, not the length. The value 4 is only the extra length. The value 10 comes from taking the square root of 96 as if the yard were a square, which ignores the 4 meter difference."}, {"n": 13, "domain": "D4", "stem": "A machinist models the area of a metal plate as x^2 - 9x + 20 square inches. Which expression is equal to this area when written in factored form?", "options": ["(x + 4)(x + 5)", "(x - 4)(x - 5)", "(x - 2)(x - 10)", "(x - 1)(x - 20)"], "answer": 1, "explanation": "Look for two numbers that multiply to 20 and add to -9; they are -4 and -5, so the factors are (x - 4)(x - 5). Expanding checks it: x^2 - 5x - 4x + 20. The pair with plus signs multiplies to 20 but adds to +9, so it gets the middle sign wrong. The pair -2 and -10 multiplies to 20 but adds to -12. The pair -1 and -20 adds to -21."}, {"n": 14, "domain": "D5", "stem": "A wall in a workshop measures 14 feet by 9 feet and has a door opening of 3 feet by 2 feet. How many square feet of the wall need paint?", "options": ["120", "123", "126", "132"], "answer": 0, "explanation": "The wall area is 14 x 9 = 126 square feet and the door is 3 x 2 = 6, so the painted area is 126 - 6 = 120. The value 126 ignores the door. The value 132 adds the door instead of removing it. The value 123 subtracts only the 3 foot width of the door, not its full area. Area problems need the product of both sides for every piece."}, {"n": 15, "domain": "D5", "stem": "A landscaper is laying paving stones in a circular patio with a radius of 5 meters. Using 3.14 for pi, what is the area of the patio in square meters?", "options": ["15.7", "31.4", "78.5", "314"], "answer": 2, "explanation": "The area of a circle is pi x r^2, so 3.14 x 5 x 5 = 78.5 square meters. The value 31.4 is the circumference, 2 x 3.14 x 5, which measures the edge instead of the surface. The value 15.7 is pi x r, which skips the second factor of the radius. The value 314 squares the diameter of 10 instead of the radius, as if the radius were 10."}, {"n": 16, "domain": "D5", "stem": "A 17 foot brace runs from the top of a wall to a point on the floor 8 feet from the base of the wall, and the wall meets the floor at a right angle. How high up the wall does the brace reach, in feet?", "options": ["9", "15", "17", "25"], "answer": 1, "explanation": "The brace is the hypotenuse, so the height is the square root of 17^2 - 8^2 = 289 - 64 = 225, which is 15. The value 9 subtracts the lengths directly, 17 - 8, which ignores the squares. The value 25 adds them, 17 + 8, the same mistake in the other direction. The value 17 is the brace length itself, the hypotenuse, not a leg of the triangle."}, {"n": 17, "domain": "D6", "stem": "A tire shop installed tires on five mornings: 40, 44, 50, 58 and 68 tires. What is the mean number of tires installed per morning?", "options": ["28", "50", "52", "68"], "answer": 2, "explanation": "Add the five counts to get 260 and divide by 5, which gives 52. The value 50 is the median, the middle value of the ordered list, so it measures the center differently. The value 68 is the largest count only. The value 28 is the range, the largest minus the smallest, which measures spread instead of center."}, {"n": 18, "domain": "D6", "stem": "A drawer holds 6 red, 9 blue and 5 yellow cable ties. If one tie is pulled out at random, what is the percent chance that it is red?", "options": ["30 percent", "40 percent", "45 percent", "70 percent"], "answer": 0, "explanation": "There are 6 + 9 + 5 = 20 ties and 6 are red, so the chance is 6/20 = 30 percent. The value 40 percent compares red with blue only, 6 out of 15, leaving out the yellow ties. The value 45 percent is the chance of blue, 9 out of 20, the wrong color. The value 70 percent is the chance of not drawing red, the complement of the answer."}, {"n": 19, "domain": "D6", "stem": "At a print shop, the large press runs without a fault on 90 percent of days and the small press runs without a fault on 80 percent of days, and the two presses fail independently. What is the percent chance that both presses run without a fault on a given day?", "options": ["2 percent", "28 percent", "70 percent", "72 percent"], "answer": 3, "explanation": "Independent events multiply: 0.90 x 0.80 = 0.72, or 72 percent. The value 70 percent subtracts the failure rates, 100 - 10 - 20, which treats the failures as non-overlapping. The value 28 percent is the chance that at least one press fails, the complement of the answer. The value 2 percent is the chance that both presses fail, 0.10 x 0.20, which is the opposite event."}, {"n": 20, "domain": "D6", "stem": "A mechanic logged the number of oil changes completed on six Saturdays: 18, 6, 21, 14, 12 and 19. What is the median number of oil changes?", "options": ["14", "15", "16", "18"], "answer": 2, "explanation": "Order the values: 6, 12, 14, 18, 19, 21. With six values the median is the mean of the two middle ones, (14 + 18) / 2 = 16. The value 15 is the mean of all six values, a different measure of center. The value 14 takes only the lower middle value, and 18 takes only the upper middle value, so neither averages the pair."}, {"n": 21, "domain": "D7", "stem": "Dalia had sanded the table leg three times, yet she ran her thumb along it once more. Her uncle, who owned the workshop, had not spoken since he picked up the table and turned it over to study the joints. The hum of the dust collector filled the silence. Finally he set the table down, smiled slightly, and slid a pencil behind his ear. “Next one, you sign the underside,” he said, and walked back to his bench.\n\nWhich statement best explains what the uncle’s last remark shows about Dalia’s work?", "options": ["He found flaws in the joints and wants her to start the whole table over.", "He is annoyed that she spent so long sanding a single table leg.", "He plans to sell the table under his own name at the workshop.", "He is pleased with the table and trusts her to put her own name on her next one."], "answer": 3, "explanation": "The uncle studies the joints in silence, then smiles and says, “Next one, you sign the underside.” Makers sign only work they are proud of, so the remark signals approval and trust. Flaws in the joints would be followed by criticism, not a smile. Nothing suggests he is annoyed by the sanding; her care is the quality he is rewarding. The last choice contradicts his words, since he tells her to sign."}, {"n": 22, "domain": "D7", "stem": "At four in the morning the bakery belonged to Rosalind and the ovens. She had learned to read dough the way other people read faces: a sticky sheen meant too much water, and a stiff skin meant too little. Tonight the dough had a mind of its own, sagging over the edge of the bowl as though it wanted to leave. Rosalind sighed, dusted her hands, and folded in a spoonful of flour, patiently, the way you coax a stubborn friend.\n\nWhat does the phrase “a mind of its own” most nearly suggest about the dough?", "options": ["It was thinking carefully about how the recipe should turn out.", "It was acting unpredictably and resisting her usual handling.", "It had been mixed with the wrong flavor and needed replacing.", "It was fully risen and ready to go into the oven."], "answer": 1, "explanation": "The passage says the dough “had a mind of its own, sagging over the edge of the bowl as though it wanted to leave.” That is figurative language for dough that will not behave as expected. Dough cannot literally think about a recipe. Nothing says the flavor is wrong, and sagging, sticky dough is not ready to bake; Rosalind folds in more flour to bring it back under control."}, {"n": 23, "domain": "D7", "stem": "Mr. Okafor never raised his voice on a job site. When a joint leaked or a measurement was off, he simply stopped, studied the pipe for a long moment, and said, “Show me how you got here.” I used to dread those pauses. Now I notice that nobody on the crew ever makes the same mistake twice, and that the other apprentices copy the way he runs a finger along a seam before saying a word. I have started doing it myself, though I hope no one has noticed.\n\nWhich choice best describes the narrator’s attitude toward Mr. Okafor?", "options": ["Resentment of his slow and careful way of checking every detail", "Boredom with the repeated questions he asks", "Confusion about what he expects from the crew", "Admiration that has replaced early nervousness"], "answer": 3, "explanation": "The narrator says, “I used to dread those pauses,” which shows the early nervousness, and then admits, “I have started doing it myself,” which shows imitation born of respect. Resentment would not lead someone to copy him. Boredom does not fit a narrator who notices that no one repeats a mistake. The passage never suggests confusion; his question is clear and the crew learns from it."}, {"n": 24, "domain": "D7", "stem": "When Ines took over her father’s repair shop, she found a drawer of paper tags in his handwriting. Each tag named a customer and an item: a toaster, a bicycle chain, a wristwatch, a lamp with a cracked base. Beside each was a date and the words “will have it ready.” Some dates were three years old. She could have thrown the whole drawer into the recycling bin, and nobody would have blamed her. Instead she cleared a corner of the bench and began with the oldest tag. By March the drawer was empty, and she hung her father’s apron beside the door, within reach.\n\nWhich theme is best supported by the passage?", "options": ["Finishing a loved one’s unkept promises can be a way of carrying on what they started.", "Old tools and paper tags are worth more than anything found in a modern shop.", "A small business cannot survive once the person who began it is gone.", "Customers should avoid leaving their belongings in a shop for long periods."], "answer": 0, "explanation": "Ines could have discarded the tags, yet she works through the oldest promise first and empties the drawer. She then hangs the apron “within reach,” a sign that she carries on the work rather than putting it away. Nothing compares old tools with modern ones. The shop keeps going under her care, which contradicts the second choice, and the passage offers no advice to customers."}, {"n": 25, "domain": "D8", "stem": "To: All warehouse staff. Starting the first Monday of next month, the loading dock will switch to two staggered shifts, one beginning at six in the morning and one at ten. The change responds to the long lines of delivery trucks that form between eight and ten, when both crews currently arrive together. Staff may choose a shift by the end of this week, and requests will be filled in order of length of service. Break times will be adjusted to match.\n\nWhich statement best expresses the main idea of the memo?", "options": ["Employees with the longest service will receive higher pay beginning next month.", "Delivery trucks will no longer be allowed to arrive between eight and ten.", "The dock is adopting staggered shifts to reduce truck lines, and staff will choose between them.", "Break times at the warehouse are being removed for both of the new shifts."], "answer": 2, "explanation": "The memo announces two staggered shifts, explains that they answer the truck lines, and tells staff to choose one. Length of service decides who gets a requested shift, not who gets higher pay, so the first distractor invents a raise. The memo changes crew arrival times, not truck arrival times. Break times are “adjusted to match,” which is different from being removed."}, {"n": 26, "domain": "D8", "stem": "Before climbing, set the ladder on firm, level ground. For an extension ladder, a common rule is to place the base one foot away from the wall for every four feet of height to the point of contact. Face the ladder while climbing and keep three points of contact at all times, meaning two hands and one foot, or two feet and one hand. Never carry tools in your hands; wear a belt or hoist them up once you are in position.\n\nAccording to the notice, what does keeping three points of contact mean?", "options": ["Placing the base one foot from the wall for every four feet of height.", "Setting the ladder on firm, level ground at three separate spots.", "Carrying tools in both hands while one foot stays on the ladder.", "Having two hands and one foot, or two feet and one hand, on the ladder at once."], "answer": 3, "explanation": "The notice defines the term itself: “meaning two hands and one foot, or two feet and one hand.” The one foot for every four feet of height describes where to set the base, a different safety step. The ground requirement is about stability, not body position. The last choice breaks the notice, which says never to carry tools in your hands."}, {"n": 27, "domain": "D8", "stem": "Dear Ms. Patel, I am writing about the cabinets installed in my kitchen last week. The doors close smoothly and the finish is lovely, and my neighbors have already asked for your number. However, the drawer under the sink sticks whenever it is pulled more than halfway, and one handle was installed slightly crooked. I would be grateful if someone could visit to adjust these two items at a time that suits your schedule. Thank you for the care you took with everything else. Sincerely, Mr. Alvarez.\n\nWhich inference about Mr. Alvarez is best supported by the letter?", "options": ["He is generally satisfied but wants two specific problems corrected.", "He is unhappy with the whole job and hopes to receive a refund.", "He has not yet looked closely at the work in his kitchen.", "He plans to hire a different company to repair the drawer."], "answer": 0, "explanation": "Mr. Alvarez praises the doors, the finish, and the “care you took with everything else,” then names exactly two problems and asks for a visit. That mix shows general satisfaction with limited complaints. A refund is never mentioned, and his detailed description proves he has looked closely. He asks Ms. Patel’s company to return, so hiring another company contradicts the letter."}, {"n": 28, "domain": "D8", "stem": "Every small shop owner eventually asks whether to track expenses by hand or in software. A notebook costs almost nothing and forces owners to look at every purchase. Software, on the other hand, sorts receipts automatically and produces monthly summaries in seconds, saving hours that could be spent with customers. Still, a program is only as accurate as the entries fed into it, so the habit of recording each sale the same day matters more than the tool. Owners who build that habit succeed with either method.\n\nWhat is the author’s primary purpose in the passage?", "options": ["To persuade shop owners to replace their notebooks with accounting software at once.", "To explain that consistent daily record keeping matters more than which method an owner uses.", "To warn readers that accounting software often makes errors when sorting receipts.", "To describe the steps for sorting receipts into categories for monthly summaries."], "answer": 1, "explanation": "The author weighs both methods fairly and then concludes that “the habit of recording each sale the same day matters more than the tool.” That conclusion is the purpose. The passage praises software but never urges an immediate switch. Its remark about accuracy concerns the entries owners type, not errors by the program, and it never lists steps for categorizing receipts."}, {"n": 29, "domain": "D8", "stem": "The trainer’s diagram of the circuit panel was so lucid that even the newest apprentices could trace each wire from the breaker to the outlet. He labeled every line, used a different color for each circuit, and left no step to guesswork. By the end of the hour, the class no longer stared at the panel with worry but with curiosity.\n\nAs used in the passage, what does the word lucid most nearly mean?", "options": ["bright and glowing with light", "long and complicated", "clear and easy to follow", "quickly sketched"], "answer": 2, "explanation": "The context supplies the meaning: the apprentices could trace each wire, every line was labeled, and nothing was left to guesswork. All of that describes a diagram that is clear and easy to follow. The word bright is a common meaning of similar-sounding words but does not fit a diagram. A long, complicated diagram would have increased worry rather than relieved it, and a quick sketch would not have labeled every line."}, {"n": 30, "domain": "D8", "stem": "Hiring a seasonal worker and training a current employee for extra hours both solve a busy-season problem, but they differ in cost and speed. A seasonal hire needs paperwork and several days of training, yet the owner pays only for the weeks needed. A current employee already knows the shop, so the learning curve is short; however, overtime pay can add up quickly, and the employee may tire. Owners should weigh how long the rush will last before choosing.\n\nWhich text structure does the author mainly use?", "options": ["Chronological order of the steps in hiring", "A chain of causes that ends in a closed shop", "A single problem followed by one recommended fix", "Comparison and contrast of two options"], "answer": 3, "explanation": "The opening sentence says the two choices “differ in cost and speed,” and each following sentence sets one option beside the other, with signal words such as yet and however. That is comparison and contrast. No timeline of steps organizes the paragraph. No chain of causes leads to a closed shop. The ending asks owners to weigh the options instead of recommending one fix."}, {"n": 31, "domain": "D8", "stem": "Cross-training makes a small shop more reliable. Last winter, a three-person bakery lost its only cake decorator to the flu for a week. Because the owner had earlier taught two other workers the basics of piping, the weekend wedding orders were still finished on time. Across town, a florist where each task belonged to one person closed for two days when her assistant was out sick.\n\nWhich detail from the passage best supports the claim that cross-training makes a small shop more reliable?", "options": ["The bakery has only three people on its staff.", "Two other workers could pipe, so the bakery’s wedding orders were finished on time.", "The decorator was out sick for a week last winter.", "The florist’s shop is located across town from the bakery."], "answer": 1, "explanation": "Evidence must show that cross-training led to reliability. The bakery lost its decorator, yet two workers who had been taught piping finished the orders on time, so the shop stayed reliable because of the training. The staff size, the decorator’s illness, and the florist’s location are facts in the passage, but none of them shows how training protects a shop."}, {"n": 32, "domain": "D8", "stem": "Many new food truck owners think the hardest part is the cooking. In fact, the paperwork can take longer than the menu. Permits, health inspections, and parking approvals each come from a different office, and each has its own waiting period. One owner kept a single folder with copies of every form and a calendar of due dates. She said she stopped being surprised once she could see everything in one place. Her system is simple, but it saved her weeks.\n\nWhat is the function of the last sentence of the passage?", "options": ["It sums up how much the owner’s organizing method helped her.", "It introduces a new problem with parking approvals.", "It contradicts the claim that paperwork is slow.", "It explains why health inspections are required."], "answer": 0, "explanation": "The sentence follows the description of the folder and calendar and states the result: the simple system “saved her weeks.” That closes the example by summing up its benefit. Parking approvals were already named earlier and are not a new problem. The sentence supports, rather than contradicts, the claim that paperwork is slow, and it does not discuss why inspections exist."}, {"n": 33, "domain": "D8", "stem": "Passage 1: Apprenticeships are the best way to enter a trade. Learners earn wages from the first week, avoid student debt, and absorb the habits of experienced workers that no classroom can fully teach.\n\nPassage 2: Classroom programs deserve credit too. Students can study safety rules and theory without the pressure of a live job site, and many programs include hands-on labs. A student who understands why a rule exists is less likely to skip it later.\n\nHow do the two passages differ in their view of how to learn a trade?", "options": ["Passage 1 claims a trade cannot be learned at all, while Passage 2 says it can.", "Passage 1 focuses on safety rules, while Passage 2 focuses on student debt.", "Passage 1 stresses paid, on-the-job learning, while Passage 2 stresses studying theory and safety in a classroom.", "Both passages agree that apprenticeships are the only worthwhile path."], "answer": 2, "explanation": "Passage 1 points to wages, avoided debt, and learning habits from experienced workers, all features of on-the-job training. Passage 2 points to safety rules, theory, and labs, all features of a classroom. The second choice reverses the two topics, the first invents a claim that a trade cannot be learned, and the last ignores that Passage 2 defends classroom programs."}, {"n": 34, "domain": "D8", "stem": "A bike repair shop tracked the work it completed during one week.\n\nDay: Monday, Tuesday, Wednesday, Thursday, Friday\nTune-ups: 6, 4, 5, 9, 12\nFlat repairs: 10, 9, 8, 7, 5\n\nWhich conclusion is best supported by the information above?", "options": ["Flat repairs outnumbered tune-ups on every day of the week.", "Monday was the busiest day of the week for the shop.", "Tune-ups were more common than flat repairs on most days.", "Tune-ups rose toward the end of the week while flat repairs declined."], "answer": 3, "explanation": "Tune-ups go 6, 4, 5, 9, 12 and flat repairs go 10, 9, 8, 7, 5, so the first rise late in the week while the second fall. Flat repairs lose on Thursday, 7 to 9, and on Friday, 5 to 12. Monday totals 16 jobs and Friday totals 17, so Monday is not busiest. Tune-ups lead on only two of the five days, not most days."}, {"n": 35, "domain": "D8", "stem": "A hardware store manager argues that moving the paint display to the front of the store will raise paint sales. She notes that customers who see a product when they enter are more likely to remember it, and that the front shelves already hold the store’s best-selling items. Because many shoppers go straight to the aisles they know, she believes they may never notice paint if it stays in the back.\n\nWhich new fact would most weaken the manager’s argument?", "options": ["Most paint buyers choose a brand in advance and walk straight to the back aisle to find it.", "Many customers who buy paint also buy brushes and tape during the same visit.", "The front shelves have enough room to hold the entire paint display.", "The store’s best-selling items are mostly displayed along the front wall."], "answer": 0, "explanation": "The argument assumes that shoppers must see paint to buy it. If most paint buyers already know their brand and head straight to the back aisle, a front display would add little, which weakens the claim. Buying brushes and tape together is neutral. Having room for the display only shows the move is possible, and the best sellers at the front match her reasoning rather than undermine it."}, {"n": 36, "domain": "D9", "stem": "A shop manager drafted this sentence for the staff newsletter: “The delivery arrived early, we had not cleared the loading bay.” Which revision corrects the error without changing the meaning?", "options": ["The delivery arrived early we had not cleared the loading bay.", "The delivery arrived early, but we had not cleared the loading bay.", "The delivery arrived early, which we had not cleared the loading bay.", "The delivery arrived early; but we had not cleared the loading bay."], "answer": 1, "explanation": "The original is a comma splice: two complete thoughts are joined by only a comma. Adding the coordinating conjunction but after the comma fixes it and keeps the contrast. Removing the comma creates a run-on with no punctuation at all. The which version attaches a clause that does not make sense. A semicolon already joins two main clauses, so adding but after it is incorrect."}, {"n": 37, "domain": "D9", "stem": "A garage supervisor is checking this sentence: “The list of required tools, which includes two wrenches and a torque gauge, ____ posted by the door of the garage.” Which choice correctly completes the sentence?", "options": ["are", "were", "have been", "is"], "answer": 3, "explanation": "The subject of the sentence is the singular noun list. The phrase between the commas, which includes two wrenches and a torque gauge, is an interruption that does not change the subject. Choosing a plural verb because wrenches and gauge sit close to the blank is the classic attraction error. Only the singular is agrees with list, while are, were, and have been are all plural forms."}, {"n": 38, "domain": "D9", "stem": "A clerk wrote: “The shop owner told the new employee that her schedule had changed.” The writer means the new employee’s schedule, but the pronoun could point to either woman. Which revision removes the unclear pronoun and keeps the meaning?", "options": ["The shop owner told the new employee that she had changed the schedule.", "The shop owner told the new employee that their schedule had changed.", "The shop owner told the new employee, “Your schedule has changed.”", "The shop owner, telling the new employee that schedules had changed."], "answer": 2, "explanation": "Quoting the owner’s words with the pronoun your points directly at the employee, so nothing is left to guess. The first alternative still uses she and now suggests the owner changed the schedule, which alters the meaning. The word their is a plural pronoun that has no plural antecedent here. The last choice is a frag
